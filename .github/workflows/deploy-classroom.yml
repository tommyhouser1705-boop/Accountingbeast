name: Set up Ledger Lane accounts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-classroom.yml'
      - 'scripts/setup-cloud.mjs'
      - 'scripts/deployment-db.mjs'
      - 'scripts/check-cloud.mjs'
      - 'scripts/check-ai.mjs'
      - 'scripts/check-student-browser.mjs'
      - 'scripts/check-count-browser.mjs'
      - 'classroom.js'
      - 'cloud.js'
      - 'classroom.css'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      owner_email:
        description: Email you use to sign in as the demo owner
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ledger-classroom-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEDGER_AI_API_KEY: ${{ secrets.LEDGER_AI_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: eaahwjgdpmvaasgtjpaq
      APP_ORIGIN: https://tommyhouser1705-boop.github.io
      OWNER_EMAIL: ${{ inputs.owner_email }}
      OWNER_EMAIL_SHA256: e3737fdb130002ebe421ac0d76f084e608bacfa90684068284b9a482359d48b3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Retry deployment after the repository token permissions were updated.
      - name: Check deployment access
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN in repository Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
      - name: Report code version
        run: git log -1 --format='%h %s'
      - name: Install deployment dependencies
        run: npm ci
      - name: Test accounting and access controls
        run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: '2.120.0'
      - name: Prepare database and owner account
        run: node scripts/setup-cloud.mjs
      - name: Configure website origin
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "APP_ORIGIN=$APP_ORIGIN"
      - name: Connect assignment generation
        if: env.LEDGER_AI_API_KEY != ''
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "LEDGER_AI_API_KEY=$LEDGER_AI_API_KEY"
      - name: Deploy authenticated classroom server
        run: supabase functions deploy classroom --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
      - name: Install student-test browser
        if: env.LEDGER_AI_API_KEY != ''
        run: npx playwright install --with-deps chromium
      - name: Check supplies-count grading as a student
        if: env.LEDGER_AI_API_KEY != ''
        run: node scripts/check-count-browser.mjs
      - name: Detect changes to AI generation
        id: ai-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif [ -n "$(git diff --name-only HEAD^ HEAD -- supabase/functions/classroom/generator.mjs supabase/functions/classroom/generation-schema.mjs lesson-engine.js scripts/check-ai.mjs scripts/check-student-browser.mjs classroom.js classroom.css cloud.js)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check original assignment generation
        if: env.LEDGER_AI_API_KEY != '' && steps.ai-changes.outputs.changed == 'true'
        run: node scripts/check-ai.mjs
      - name: Check server responds to website
        run: node scripts/check-cloud.mjs

      - name: Save student walkthrough screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-walkthrough
          path: student-test-results/
          if-no-files-found: ignore
