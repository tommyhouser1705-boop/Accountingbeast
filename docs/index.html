.designer-preview { background: #fffaf3; border-color: #ebdfcf; }

/* The workbench: colorful wayfinding, quiet documents, clear states. */
.ws { margin-top: 24px; gap: 22px; }
.ws-top > button { color: #67608d; border-color: #dbd5ef; padding-left: 12px; }
.ws-head { border: 0; padding: 0; margin: 0; background: none; flex-wrap: nowrap; }

.ws-meter { background: #fff; padding: 15px 18px; min-width: 195px; border-radius: 12px; border: 1px solid var(--line); }
.ws-meter strong { color: var(--violet); font-size: 29px; }
.ws-meter small { font-size: 10px; }
.ws-steps { background: #e5e6f0; padding: 5px; gap: 4px; border-radius: 12px; }
.ws-steps li { background: transparent; color: #73778e; border-radius: 8px; padding: 13px 15px; font-size: 12px; }
.ws-steps li > span { color: #6b648c; background: #f4f3fb; width: 25px; height: 25px; }
.ws-steps li.current { color: #fff; background: var(--violet); box-shadow: 0 3px 8px #5145bd20; }
.ws-steps li.current > span { color: var(--violet); }
.ws-steps li.done { background: #e0eee8; color: #326a59; }

.ws-list { background: #fbfaff; padding: 18px 12px; border-color: #dcd7ee; border-radius: 14px; }
.ws-list h3 { padding: 0 8px 12px; margin-bottom: 0; border-bottom: 1px solid #e7e2f2; font-size: 14px; }
.ws-list h4 { margin: 20px 10px 9px; color: #8a809d; font-size: 9px; letter-spacing: 1.1px; }
.ws-record { border-radius: 8px; padding: 12px 9px; color: #5c5a77; }
.ws-record:hover { background: #efebfb; }
.ws-record.active { border-color: #aa99df; background: #eeebfc; box-shadow: inset 3px 0 0 #7660c2; color: #4f4389; }
.ws-record strong { font-size: 11px; line-height: 1.5; }
.ws-record small { font-size: 9px; color: #7a748b; margin-top: 4px; }
.ws-dot { border-color: #cbc5df; height: 19px; width: 19px; margin-top: 3px; }
.ws-record.done .ws-dot { background: #357663; border-color: #357663; }
.ws-record.retry .ws-dot { background: #ae6234; border-color: #ae6234; }
.ws-task { padding: 24px; }
.ws-task-head { padding-bottom: 16px; margin-bottom: 22px; border-bottom: 1px solid #e7e8f0; }
.ws-task-head h2 { font-size: 25px; margin-top: 8px; letter-spacing: -.8px; }
.ws-task-head p { font-size: 12px; }
.ws-chip { background: #f0edf7; color: #7a6c8e; font-size: 10px; padding: 6px 12px; }
.ws-chip.done { background: #e2f1e9; color: #2f755d; }
.ws-chip.retry { background: #ffebd8; color: #9c5c2e; }

.guided-task-heading { background: #ede8fc; color: var(--violet); border-color: #d6cdef; border-radius: 8px; }

.bookkeeper { background: #f8f7fe; border-color: #e0dcf0; border-radius: 10px; }
.source-document { background: #fffefa; border: 1px solid #e5dece; border-radius: 6px; box-shadow: 3px 4px 0 #efece3; }

.document-paper { background: #fffefa; }
.entry-form h3 { color: #4d3e88; }
.entry-table select, .entry-table input { background: #fff; padding: 8px; font-size: 12px; }
.entry-feedback { border-radius: 9px; }

.ws-next { background: #e9e3fc; border-color: #d2c6f3; padding: 23px; border-radius: 13px; }

.ws-next.ready { background: #e5f1eb; border-color: #bbd7c9; }
.ws-next-record { background: #36304f; }
.ws-journal { padding: 20px 24px; overflow-x: auto; }

th { color: #6b6181; background: #f5f2fb; }

</script><script>// Guided student workspace, demo helpers and shared shell pieces.
// Loaded before classroom.js; relies on its globals (Q, safe, cash, data, role, record, Lessons...) at call time.

function workspaceStatus(r, e) {
  if (e.autoPosted) return { key: 'auto', label: 'Recorded for you' };
  const x = entryAssessment(r, e);
  if (!x) return { key: 'todo', label: 'To do' };
  return x.correct ? { key: 'done', label: 'Done' } : { key: 'retry', label: 'Try again' };
}

function workspaceProgress(r) {
  const events = (r.scenario?.events || []).filter((e) => !e.autoPosted);
  const done = events.filter((e) => entryAssessment(r, e)?.correct).length;
  return { done, total: events.length, pct: events.length ? Math.round((done / events.length) * 100) : 0 };
}

function cardProgress(r) {
  if (!r || !r.scenario) return '';
  const p = workspaceProgress(r);
  return `<div class="card-progress" aria-label="${p.done} of ${p.total} entries done"><div class="meter"><span style="width:${r.completed ? 100 : p.pct}%"></span></div><small>${r.completed ? 'Complete' : `${p.done} of ${p.total} entries done`}</small></div>`;
}

function workspaceSteps(r) {
  const a = r.assignment, s = r.scenario, stage = r.stage || 0;
  const labels = a.version >= 2 ? [...s.stages, 'Report'] : ['Record the transaction', 'Month-end', 'Report'];
  const reporting = r.advanced && (a.version < 2 || stage >= Lessons.finalStage(a)) && Lessons.availableEvents(r).every((e) => workspaceStatus(r, e).key !== 'todo' && workspaceStatus(r, e).key !== 'retry');
  let current = a.version >= 2 ? stage : r.advanced ? 1 : 0;
  if (reporting) current = labels.length - 1;
  if (r.completed) current = labels.length;
  return `<ol class="ws-steps" aria-label="Assignment steps">${labels.map((x, i) => `<li class="${i < current ? 'done' : i === current ? 'current' : ''}"><span>${i < current ? '✓' : i + 1}</span>${safe(x)}</li>`).join('')}</ol>`;
}

function workspaceNextStep(r) {
  const a = r.assignment, s = r.scenario, stage = r.stage || 0;
  const open = Lessons.availableEvents(r).filter((e) => ['todo', 'retry'].includes(workspaceStatus(r, e).key)).length;
  const remaining = open ? `<p>${open} ${open === 1 ? 'record still needs' : 'records still need'} an entry. You can continue now and come back to ${open === 1 ? 'it' : 'them'} later.</p>` : '<p>Every record so far is done.</p>';
  if (a.version >= 2) {
    if (Lessons.pendingMonth(r) !== null) return '';
    if (stage < Lessons.finalStage(a)) {
      const next = s.stages[stage + 1];
      return `<section class="ws-next"><div><span class="tag">WHAT’S NEXT</span><h3>${safe(next)}</h3>${remaining}</div><button id="advance-episode" data-cloud-submit>Continue to ${safe(next.toLowerCase())} →</button></section>`;
    }
  } else if (!r.advanced) {
    const monthEnd = ['prepaid', 'equipment'].includes(a.topic);
    return `<section class="ws-next"><div><span class="tag">WHAT’S NEXT</span><h3>${monthEnd ? 'Move to month-end' : 'See what happens next'}</h3>${remaining}</div><button id="advance-episode">${monthEnd ? 'Go to month-end' : 'Open the next record'} →</button></section>`;
  }
  if (!r.advanced) return '';
  return open
    ? `<section class="ws-next"><div><span class="tag">WHAT’S NEXT</span><h3>Finish your entries</h3>${remaining}<p>Then answer the report questions below.</p></div></section>`
    : `<section class="ws-next ready"><div><span class="tag">WHAT’S NEXT</span><h3>All entries are done</h3><p>Answer the report questions below to finish the assignment.</p></div><a class="button" href="#ws-report">Go to the report ↓</a></section>`;
}

function workspaceReport(r) {
  const a = r.assignment, s = r.scenario;
  if (!r.advanced) return '';
  const allCorrect = s.events.every((e) => entryAssessment(r, e)?.correct);
  const prediction = s.prediction ? predictionPanel().replace(/3 · A QUICK CONCEPT CHECK/, 'REPORT · QUICK CHECK') : '';
  const effects = r.prediction !== undefined || !s.prediction
    ? `<section class="card reflection"><div class="tag">REPORT · FINANCIAL EFFECT</div><h2>What do your accounts show?</h2><p>${a.version >= 2 ? 'Use your T accounts to fill in these totals.' : safe(Lessons.topic(a).effect) + ' Use your T accounts to fill in these totals.'}</p><form id="effect-form">${s.effects.map((e) => `<label class="statement-line">${e.label}<input name="${e.key}" aria-label="${e.label}" type="number" step=".01" required value="${safe(r.effectDraft?.[e.key] ?? '')}"></label>`).join('')}<button ${!allCorrect ? 'disabled' : ''}>Check my report</button>${!allCorrect ? '<p class="foot">Finish every journal entry correctly first.</p>' : ''}</form><div id="effect-feedback" role="status">${r.completed ? completion(r) : ''}</div></section>`
    : '';
  return `<div id="ws-report" class="ws-report">${prediction}${effects}</div>`;
}

function workspaceJournal(r) {
  const s = r.scenario;
  const rows = Object.entries(r.entries).map(([id, e]) => e.rows.map((x, i) => `<tr><td>${i === 0 ? safe(e.date) : ''}</td><td>${i === 0 ? safe(s.events.find((x) => x.id === id)?.title || '') : ''}</td><td>${safe(x.account)}</td><td>${Number(x.debit) ? cash(Number(x.debit)) : ''}</td><td>${Number(x.credit) ? cash(Number(x.credit)) : ''}</td></tr>`).join('')).join('');
  return `<details class="card ws-journal"><summary>Your journal so far (${Object.keys(r.entries).length} ${Object.keys(r.entries).length === 1 ? 'entry' : 'entries'})</summary><table><thead><tr><th>Date</th><th>Record</th><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${rows || '<tr><td colspan="5">Your journal entries will appear here.</td></tr>'}</tbody></table><p class="foot">Corrections replace entries here. Your first attempts stay in your grading record.</p></details>`;
}

function episodeWorkspace(r) {
  const a = r.assignment, s = r.scenario, v2 = a.version >= 2, stage = r.stage || 0;
  const available = Lessons.availableEvents(r);
  const open = (e) => workspaceStatus(r, e).key !== 'done' && !e.autoPosted;
  let current = available.find((e) => e.id === record);
  if (!current) {
    current = available.filter((e) => !v2 || e.stage === stage).find(open) || available.find(open) || available[available.length - 1];
    record = current ? current.id : null;
  }
  const p = workspaceProgress(r);
  const item = (e) => {
    const st = workspaceStatus(r, e);
    return `<li><button class="ws-record ${st.key}${current && e.id === current.id ? ' active' : ''}" data-record="${safe(e.id)}" ${current && e.id === current.id ? 'aria-current="true"' : ''}><span class="ws-dot" aria-hidden="true">${st.key === 'done' ? '✓' : st.key === 'retry' ? '!' : ''}</span><span><strong>${safe(businessText(e.title, r.business))}</strong><small>${safe(e.date)} · ${st.label}</small></span></button></li>`;
  };
  const groups = v2
    ? [...new Set(available.map((e) => e.stage))].sort((x, y) => x - y).map((g) => `<div class="ws-group"><h4>${safe(s.stages[g])}</h4><ul>${available.filter((e) => e.stage === g).map(item).join('')}</ul></div>`).join('')
    : `<ul>${available.map(item).join('')}</ul>`;
  const idx = current ? available.indexOf(current) : -1;
  const nextOpen = current && workspaceStatus(r, current).key === 'done' ? available.slice(idx + 1).find(open) || available.find(open) : null;
  const task = current
    ? `<section class="ws-task guided-task-heading" aria-label="Current record"><div class="ws-task-head"><div><span class="tag">RECORD ${idx + 1} OF ${available.length}</span><h2>${safe(businessText(current.title, r.business))}</h2><p>${safe(recordPurpose(current))}</p></div><span class="ws-chip ${workspaceStatus(r, current).key}">${workspaceStatus(r, current).label}</span></div><div class="guided-workspace"><section class="guided-evidence">${documentHtml(current, a, r.business)}</section><section class="card bookkeeper"><div class="tag">YOUR JOURNAL ENTRY</div><h3>Which accounts change, and by how much?</h3>${journalForm(current, false)}${nextOpen ? `<button class="ws-next-record" data-record="${safe(nextOpen.id)}">Next record: ${safe(businessText(nextOpen.title, r.business))} →</button>` : ''}</section></div></section>`
    : '<section class="card ws-task"><h2>No new records yet</h2><p>Continue below when you’re ready.</p></section>';
  return `<div class="ws">
<div class="ws-top"><button class="quiet" id="back-assignments">← All assignments</button><div class="ws-tools"><button class="quiet" id="practice-guide">How to record an entry</button><button class="secondary" id="view-taccounts">T accounts</button></div></div>
<header class="ws-head"><div><span class="tag">${safe(Lessons.topic(a).name)} · ${month(a)}</span><h1>${safe(businessText(a.title, r.business))}</h1><details class="assignment-overview"><summary>About this assignment</summary><p>${safe(businessText(a.instructions, r.business))}</p><p><strong>Starting cash:</strong> ${cash(s.opening)}</p></details></div><div class="ws-meter" aria-label="${p.done} of ${p.total} entries done"><strong>${p.done}/${p.total}</strong><small>entries done</small><div class="meter"><span style="width:${r.completed ? 100 : p.pct}%"></span></div></div></header>
${workspaceSteps(r)}
${v2 ? orderConfirmation(r) + monthlyChoiceForm(r) : ''}
<div class="ws-body"><aside class="ws-list card" aria-label="Records"><h3>Records</h3>${groups || '<p>No records yet.</p>'}</aside><div class="ws-main">${task}${workspaceNextStep(r)}</div></div>
${workspaceReport(r)}
${workspaceJournal(r)}
</div>`;
}

if(a.version===3)return guidedAssignment(r);if(typeof episodeWorkspace==='function')return episodeWorkspace(r);
const s=r.scenario,unlocked=Lessons.availableEvents(r),allCorrect=s.events.every(e=>entryAssessment(r,e)?.correct);return `<button class="quiet" id="back-assignments">← All assignments</button><div class="lesson-heading"><div class="tag">${Lessons.topic(a).name} · ${month(a)}</div><h2>${safe(businessText(a.title))}</h2><details class="assignment-overview"><summary>What this assignment is about</summary><p>${safe(businessText(a.instructions))}</p></details></div>${a.version>=2?episodeScene(r):''}<div class="episode-strip"><div><span class="tag">YOUR BUSINESS CHOICES</span>${a.version>=2?`<details><summary>${visibleDecisions(r).length} ${visibleDecisions(r).length===1?'decision':'decisions'} for ${safe(r.business.name)}</summary>${visibleDecisions(r).map(x=>`<p>${safe(x)}</p>`).join('')}</details>`:`<strong>${safe(s.decision)}</strong>`}</div><div><span class="tag">VERIFIED STARTING CASH</span><strong>${cash(s.opening)}</strong></div><div><span class="tag">SCENARIO STATUS</span><strong>${r.completed?'Completed':a.version>=2?s.stages[r.stage||0]:r.advanced?'Month-end review':'Business decision made'}</strong></div></div><div class="lesson-workspace"><section class="card"><div class="tag">2 · READ THE BUSINESS RECORDS</div><h2>Records inbox</h2><p>Open a record, read what happened, then write its entry. After saving, check the feedback. When you’ve tried the current records, continue to the next batch.</p><button id="practice-guide" class="quiet">Replay guided practice</button>${recordsInbox(r)}${a.version>=2?episodeProgress(r):!r.advanced?`<div class="time-step"><h3>${['prepaid','equipment'].includes(a.topic)?'The month moves forward':'The next business event arrives'}</h3><p>${['prepaid','equipment'].includes(a.topic)?'Your business has used its resources for one month. Check what changes at month-end.':'Read the next document to distinguish the later event from the original transaction.'}</p><button id="advance-episode">${['prepaid','equipment'].includes(a.topic)?'Advance to month-end →':'Continue the episode →'}</button></div>`:''}<button class="quiet" id="view-taccounts">Open T accounts</button></section><section class="card bookkeeper"><div class="tag">YOUR BOOKKEEPING</div><h2>${record?'Journal entry':'Open a document to begin'}</h2>${record?journalForm(s.events.find(e=>e.id===record)): '<p>Choose a document in the records inbox. Inspect it before selecting accounts and writing the entry.</p>'}</section></div>${a.version===3?businessChallenge(r)+finishJournal(r):r.advanced?predictionPanel():''}${a.version!==3&&r.advanced&&r.prediction!==undefined?`<section class="card reflection"><div class="tag">4 · SEE THE FINANCIAL EFFECT</div><h2>What do the accounts tell you?</h2><p>${a.version>=2?'Read the records, write your entries, and finish the report.':Lessons.topic(a).effect} Use your T accounts to reconcile these statement totals.</p><form id="effect-form">${s.effects.map(e=>`<label class="statement-line">${e.label}<input name="${e.key}" aria-label="${e.label}" type="number" step=".01" required value="${safe(r.effectDraft?.[e.key]??'')}"></label>`).join('')}<button ${!allCorrect?'disabled':''}>Check financial effects</button>${!allCorrect?'<p class="foot">Correct the journal entries before completing the statement sections.</p>':''}</form><div id="effect-feedback" role="status">${r.completed?completion(r):''}</div></section>`:''}<section class="card reflection"><h3>Assignment journal</h3><table><thead><tr><th>Date</th><th>Document</th><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${Object.entries(r.entries).map(([id,e])=>e.rows.map((x,i)=>`<tr><td>${i===0?e.date:''}</td><td>${i===0?s.events.find(x=>x.id===id).title:''}</td><td>${safe(x.account)}</td><td>${Number(x.debit)?cash(Number(x.debit)):''}</td><td>${Number(x.credit)?cash(Number(x.credit)):''}</td></tr>`).join('')).join('')||'<tr><td colspan="5">Your journal entries will appear here.</td></tr>'}</tbody></table><p class="foot">Corrections replace entries in these books. Original attempts remain in your grading record.</p></section>`;}
function recordPurpose(e){if(e.autoPosted)return 'This report shows the customers your business served and the money it earned. These everyday sales are already in your books so you can focus on this lesson. Do not enter them again.';const d=e.detail?.document||e.document||{},kind=documentLayout(e,d);return kind==='invoice'?'Check what was delivered, the invoice date, and whether it was paid. Record the purchase or sale shown here.':kind==='bank'?'This bank record shows money received or sent. Check who sent it, why it moved, and the date. A deposit could be investor funding, a loan, or customer money; it is not automatically a sale.':kind==='payment'?'This is a payment, not another purchase. Check the payment date, amount, and the earlier bill it settles. Record the money moving in or out.':kind==='count'?'This count shows what remains at month-end. Compare it with your purchases and earlier usage to work out what was used this month.':kind==='receipt'?'This receipt shows a completed transaction. Check what was bought or sold and how much was paid, then record it.':kind==='quote'?'Check whether this is only an offer or an actual transaction. A proposal alone may need no entry.':'Read the dates, coverage and amounts. Work out what changed during this period, then record the change.';}
function guidedContinue(r){const stage=r.stage||0,last=Lessons.finalStage(r.assignment),batch=Lessons.availableEvents(r).filter(e=>e.stage===stage&&!e.autoPosted),untried=batch.filter(e=>!r.entries[e.id]).length,incorrect=batch.filter(e=>r.entries[e.id]&&!entryAssessment(r,e)?.correct).length;const status=untried?`${untried} ${untried===1?'document still needs':'documents still need'} an entry or a no-entry response.`:incorrect?`${incorrect} saved ${incorrect===1?'entry needs':'entries need'} another look. You can correct them now or return later.`:'All entries in this step are checked. You’re ready to continue.';if(stage>=last)return `<h3>Finish the books</h3><p>${untried||incorrect?safe(status):'This step is checked. Review any earlier entries marked “needs another look”, then use Finish assignment below.'}</p>`;const controls=r.assignment.interactive?.controls.filter(c=>Lessons.decisions.controlStage(r.assignment,c)===stage+1)||[],date=controls.some(c=>c.kind==='date'),next=controls.length?(date?'Choose when to pay the bill':'Make the next business choice'):stage+1===last?'Open month-end records':'Open the next records';return `<h3>Next: ${safe(next)}</h3><p>${safe(status)}</p><button id="advance-episode" data-cloud-submit>${safe(next)} →</button><p class="foot">Continue whenever you’re ready. Unfinished work stays in Earlier records. This button does not submit the assignment.</p>`;}

function guidedAssignment(r){Lessons.expandAccountChoices(r.scenario);const a=r.assignment,stage=r.stage||0,pending=Lessons.pendingDecision(r),available=Lessons.availableEvents(r),batch=available.filter(e=>e.stage===stage),earlier=available.filter(e=>e.stage<stage);if(pending!==null)record=null;else if(!available.some(e=>e.id===record)||r.guidedStage!==stage){record=(batch.find(e=>!r.entries[e.id])||batch[0])?.id||null;r.guidedStage=stage;}const current=available.find(e=>e.id===record),index=batch.findIndex(e=>e.id===record),next=batch[index+1],button=e=>`<button class="guided-record ${record===e.id?'selected':''}" data-record="${safe(e.id)}"><span>${safe(e.date)}</span><strong>${safe(e.title)}</strong><small>${e.autoPosted?'Recorded for you':r.entries[e.id]?(entryAssessment(r,e)?.correct?'✓ Correct':'Saved · needs another look'):'Not entered'}</small></button>`;return `<button class="quiet" id="back-assignments">← All assignments</button><div class="lesson-heading"><div class="tag">${safe(r.business.name)} · ${safe(month(a))}</div><h2>${safe(businessText(a.title,r.business))}</h2><div class="assignment-instructions"><h3>Your goal</h3><p>${safe(businessText(a.instructions,r.business))}</p><p class="foot">Make the business choices as they appear. Read each business document. Record purchases, payments, sales and adjustments; an unaccepted quote may need no entry. Reports summarize your books and do not need a new journal entry. Continue opens more business activity; Finish assignment submits your completed books.</p></div></div><nav class="guided-path" aria-label="Assignment steps"><span class="done">1 · Make a business choice</span><span class="${r.completed?'done':pending===null&&!r.advanced?'current':''}">2 · Read and record what happened</span><span class="${pending!==null?'current':''}">3 · Choose what happens next</span><span class="${r.completed?'done':r.advanced?'current':''}">4 · Finish the books</span></nav>${businessActivitySummary(r)}${pending!==null?`<section class="card guided-next"><h2>Your next business choice</h2>${earlier.length?`<details open><summary>The invoice for this decision</summary>${earlier.filter(e=>documentLayout(e,e.detail.document)==='invoice').map(e=>documentHtml(e,a,r.business)).join('')}</details>`:''}${monthlyChoiceForm(r)}</section>`:`${orderConfirmation(r)}<section class="guided-task-heading"><div class="tag">${safe(r.scenario.stages[stage])}${batch.length?(index>=0?' · Record '+(index+1)+' of '+batch.length:' · Earlier record'):''}</div><h2>${current?safe(current.title):'This step is finished'}</h2><p>${current?recordPurpose(current):'Continue to make the next business choice or receive the next records.'}</p></section>${batch.length?`<div class="guided-record-tabs">${batch.map(button).join('')}</div>`:''}${current?`<div class="guided-workspace"><section class="guided-evidence">${documentHtml(current,a,r.business)}</section><section class="card bookkeeper"><div class="tag">${current.autoPosted?'BUSINESS REPORT':'YOUR ENTRY'} · ${safe(current.date)}</div><h2>${current.autoPosted?'Read your business results':'Write the journal entry'}</h2>${current.autoPosted?'':'<p class="entry-directions">Use the document beside this form. Enter the transaction date, then choose the accounts and enter the debit and credit amounts. Save to find out whether your entry is correct.</p>'}${journalForm(current,false)}${next?`<button class="guided-next-record" data-record="${safe(next.id)}">Next record: ${safe(next.title)} →</button>` :`<p class="guided-ready">${current.autoPosted||entryAssessment(r,current)?.correct?'This record is checked. Use the next-step button below.':'Save and check this record, then use the next-step button below. You can return to make corrections later.'}</p>`}</section></div>`:''}<section class="card guided-continue">${guidedContinue(r)}</section>`}<div class="guided-tools"><button class="quiet" id="view-taccounts">Open T accounts</button><button class="quiet" id="assignment-tour">What do I do?</button><button class="quiet" id="practice-guide">Replay guided practice</button></div>${earlier.length?`<details class="card earlier-work"><summary>Earlier records · ${earlier.length} available</summary>${earlier.map(button).join('')}</details>`:''}${r.advanced?finishJournal(r):''}<details class="optional-business"><summary>Optional business challenge</summary>${businessChallenge(r)}</details>`;}
function journalForm(e,showDocument=true){if(e.autoPosted)return `<section class="recorded-activity"><div class="tag">ALREADY IN YOUR BOOKS</div><h3>Sales recorded for you</h3><p>Your business earned this money from customers. This lesson focuses on your other entries, so these sales have already been posted.</p><p>There is no entry to type here and no points to earn from copying it.</p><button type="button" class="secondary" id="show-business-books">See the posted entry in T accounts</button></section>`;const r=run(),old=r.entries[e.id];Lessons.expandAccountChoices(r.scenario);if(record!==r.selectedRecord){entryRows=old?.rows.length?structuredClone(old.rows):[{account:'',debit:'',credit:''},{account:'',debit:'',credit:''}];r.selectedRecord=record;}return `${showDocument?documentHtml(e,assignment(),r.business):''}<form id="journal-form"><label class="field">Journal-entry date<input id="entry-date" type="date" required value="${safe(old?.date||r.entryDateDraft||'')}"></label><table><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${entryRows.map((x,i)=>`<tr><td><select data-line="${i}" data-field="account" aria-label="Account ${i+1}" required><option value="">Select account</option>${(assignment().version===3?r.scenario.accountList:assignment().version===2?[...new Set(['Cash','Owner Capital',...r.scenario.events.flatMap(x=>[x.debit,x.credit])])].sort():Lessons.accounts).map(a=>`<option ${a===x.account?'selected':''}>${safe(a)}</option>`).join('')}</select></td><td><input data-line="${i}" data-field="debit" aria-label="Debit ${i+1}" type="number" step=".01" min="0" value="${safe(x.debit)}"></td><td><input data-line="${i}" data-field="credit" aria-label="Credit ${i+1}" type="number" step=".01" min="0" value="${safe(x.credit)}"></td></tr>`).join('')}</tbody></table><div class="actions"><button>Save and check entry</button><button type="button" class="secondary" id="add-line">+ Line</button>${assignment().version===3?'<button type="button" class="secondary" id="no-entry">No journal entry required</button>':''}${assignment().support==='guided'?'<button type="button" class="quiet" id="hint">Concept hint</button>':''}</div></form><div id="entry-feedback" role="status">${old?entryFeedback(entryAssessment(r,e)):''}</div><p class="foot">The account list is the business’s full chart, not a shortlist of answers. Choose only accounts supported by this document. Use the date the transaction happened, choose the accounts affected, and enter equal debit and credit totals. Saving checks your entry; it does not end the assignment.</p>`;}
function entryFeedback(g){if(!g)return '<div class="message">Entry saved. Refresh to see feedback.</div>';return `<div class="message ${g.correct?'':'error'}">${g.correct?'Correct entry. Your date, accounts, debit and credit match this record.':`${!g.date?'Use the transaction date printed on the document, not today’s date. ':''}${!g.account?'The accounts don’t match this record. Check what the business received or used, and whether cash was paid or the amount is still owed. ':!g.amount?'The amounts or debit/credit sides don’t match. Recalculate using this document’s amounts and payment terms. ':''}Your entry is saved, but it needs another look. Correct it and check again.`}</div>`;}
function finishJournal(r){const all=r.scenario.events.every(e=>entryAssessment(r,e)?.correct),saved=r.scenario.events.filter(e=>r.entries[e.id]).length,total=r.scenario.events.length;return `<section class="card journal-finish"><div class="tag">YOUR NEXT STEP</div><h2>${r.completed?'You finished this assignment':!r.advanced?'Keep the business moving':all?'Your entries are ready':'Check the entries that need another look'}</h2><p>${!r.advanced?'Read the current records and try their entries. When you’ve worked through this batch, use the continue button in the inbox to receive the next records. You may move ahead with unfinished entries.':all?'Every record has a correct entry or a correctly identified no-entry decision. Your books below update automatically. Finish when you’re ready.':`${saved} of ${total} records have an entry. The inbox marks correct entries and entries to revisit. Open a marked record to correct it.`}</p>${r.advanced?`<div class="books-review"><h3>Review the books you built</h3><p>The trial balance below summarizes your entries. Preparing it is not a transaction—do not write another journal entry or copy its numbers. Check the records marked for correction, then finish your assignment.</p>${trialBalanceHtml(r)}</div>`:''}${r.completed?completion(r):r.advanced&&all?'<button id="finish-assignment" data-cloud-submit>Finish assignment</button>':''}<p class="foot">Your score comes from your dated journal entries. ${gradingCopy(r.assignment)} Earlier attempts stay available to your professor.</p></section>`;}
function assignmentTourKey(){return 'ledger-tour-'+(typeof cloudAccount!=='undefined'&&cloudAccount?cloudAccount.id:'local')+'-'+assignment().id;}

function assignmentTour(step=0){const a=assignment(),d=Q('#lesson-dialog'),name=safe(data.profile?.name||'your business'),pages=[{title:'You run the business. You keep the books.',text:`This assignment takes place at ${name} over ${a.periodMonths||1} ${(a.periodMonths||1)===1?'month':'months'}. ${safe(businessText(a.instructions))}<p>Your grade comes from your entries, not how much money you make.</p>`},{title:'Start with a business choice',text:'The first screen tells you what the business needs. Choose the items, quantities, coverage or payment arrangement shown on the form. Confirm your choice to get the first documents. You will make later choices when they come up, instead of deciding everything now.'},{title:'Read the document beside your entry',text:'Look for the transaction date, what was delivered or used, the amount, and whether money was paid or is still owed. Enter that date, choose your accounts, and type the debit and credit. Click <strong>Save and check entry</strong>. Green means correct; “needs another look” means saved but needs a correction.'},{title:'Continue when you’ve tried the current record',text:'Use <strong>Next record</strong> to move through this step. Use the continue button below the work area to make the next decision or open month-end records. You can move on with an unfinished entry and return later. <strong>Earlier records</strong> keeps past documents available; <strong>Open T accounts</strong> shows your books. At the end, check any unfinished entries and click <strong>Finish assignment</strong>.'}];const mark=()=>{try{localStorage.setItem(assignmentTourKey(),'done');}catch{}};if(d.open)d.close();d.innerHTML=`<div class="tag">ASSIGNMENT WALKTHROUGH · ${step+1} OF ${pages.length}</div><h2>${pages[step].title}</h2><div class="tour-explanation"><p>${pages[step].text}</p></div><div class="actions">${step?'<button class="secondary" id="tour-back">Back</button>':''}<button id="tour-next">${step===pages.length-1?'Start my assignment':'Next →'}</button><button class="quiet" id="tour-skip">Close walkthrough</button></div><p class="foot">Replay this at any time with “What do I do?” No work is submitted during the walkthrough.</p>`;d.oncancel=mark;d.showModal();Q('#tour-next').onclick=()=>{if(step===pages.length-1){mark();d.close();}else assignmentTour(step+1);};if(Q('#tour-back'))Q('#tour-back').onclick=()=>assignmentTour(step-1);Q('#tour-skip').onclick=()=>{mark();d.close();};}
function practiceKey(){return 'ledger-first-practice-'+(typeof cloudAccount!=='undefined'&&cloudAccount?cloudAccount.id:'local');}

function practiceGuide(step=0){const d=Q('#lesson-dialog'),name=safe(data.profile?.name||'your business');if(d.open)d.close();d.innerHTML=step===0?`<div class="tag">GUIDED PRACTICE · NO POINTS</div><h2>Here’s how an assignment works</h2><p>You run ${name}. Your choices create records. Your job is to read those records and enter what happened in the books.</p><ol class="practice-steps"><li><strong>Choose what the business will do.</strong> For example, decide how many supplies to order.</li><li><strong>Read the document.</strong> Check what arrived, when it happened, and whether it was paid.</li><li><strong>Write the journal entry.</strong> Enter the date, accounts, debit and credit. Save to get feedback.</li><li><strong>Continue when you’ve tried this batch.</strong> New records arrive. Your earlier books stay available.</li></ol><button id="practice-next">Try one together →</button>`:step===1?`<div class="tag">PRACTICE RECEIPT · NO POINTS</div><h2>Your business buys supplies</h2><div class="practice-receipt"><strong>${name}</strong><p>September 2, 2026 · Receipt P-001</p><p>Supplies delivered: $100.00<br>Paid in full today from business checking.</p></div><p>The business received supplies it will use later, so Supplies increases. It paid cash today, so Cash decreases.</p><p><strong>Try it:</strong> enter September 2, 2026, debit Supplies for $100 and credit Cash for $100. This practice entry never goes into your assignment or your grade.</p><form id="practice-entry"><label class="field">Transaction date<input type="date" name="date" required></label><div class="form-pair"><label class="field">Debit account<select name="debitAccount"><option value="">Choose</option><option>Supplies</option><option>Cash</option><option>Supplies Expense</option></select></label><label class="field">Debit amount<input name="debit" type="number" min="0" step=".01" required></label><label class="field">Credit account<select name="creditAccount"><option value="">Choose</option><option>Supplies</option><option>Cash</option><option>Supplies Expense</option></select></label><label class="field">Credit amount<input name="credit" type="number" min="0" step=".01" required></label></div><button>Check practice entry</button></form><div id="practice-feedback" role="status" aria-live="polite"></div>`:`<div class="tag">PRACTICE COMPLETE</div><h2>You’re ready to try your own records</h2><p>In the assignment, your documents will show the facts. You choose the accounts and amounts yourself. A green <strong>Correct entry</strong> message means the date, accounts and amounts are right. <strong>Needs another look</strong> means your entry is saved but needs a correction.</p><p>Try the current records, then continue to the next batch. You don’t need to copy ledger balances or complete a quiz.</p><button id="finish-practice">Start my assignment</button>`;d.showModal();if(Q('#practice-next'))Q('#practice-next').onclick=()=>practiceGuide(1);if(Q('#practice-entry'))Q('#practice-entry').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),g=Lessons.assess([{account:v.debitAccount,debit:Number(v.debit),credit:0},{account:v.creditAccount,debit:0,credit:Number(v.credit)}],v.date,{date:'2026-09-02',debit:'Supplies',credit:'Cash',amount:100});Q('#practice-feedback').innerHTML=g.correct?'<div class="message"><strong>Correct.</strong> Supplies increases by $100; cash decreases by $100. Buying supplies is different from using them.</div><button id="practice-understood">Continue →</button>':`<div class="message error">${!g.date?'Use the receipt date: September 2, 2026. ':''}${!g.account?'Choose Supplies as the debit account and Cash as the credit account. ':!g.amount?'Enter $100 on each side. ':''}Try again; this practice is not graded.</div>`;if(Q('#practice-understood'))Q('#practice-understood').onclick=()=>practiceGuide(2);};if(Q('#finish-practice'))Q('#finish-practice').onclick=()=>{try{localStorage.setItem(practiceKey(),'done');}catch{}d.close();if(assignment()?.version===3&&!tourSeen())assignmentTour();};}

function readBusinessChoice(a,form,business,base){const controls=a.interactive.controls.filter(c=>c.kind==='basket'?[...form.keys()].some(k=>k.startsWith(c.id+'__')):form.has(c.id)),subset={...a,interactive:{...a.interactive,controls}};return {...(base||Lessons.decisions.defaultChoice(a,business)),...Lessons.decisions.readChoice(subset,form)};}
function monthlyChoiceForm(r){const m=Lessons.pendingDecision(r);if(m===null)return '';const a=r.assignment,subset={...a,interactive:{...a.interactive,controls:Lessons.decisionControls(r)}};return `<section class="monthly-choice"><div class="tag">YOUR NEXT BUSINESS DECISION</div><h3>What happens next at ${safe(r.business.name)}?</h3><p>${subset.interactive.controls.some(c=>c.kind==='date')?'Your order has arrived, and the supplier’s bill is still waiting. Check the invoice terms below and choose when to pay. The next document confirms your payment; record the payment, not another purchase.':'The business is ready for its next choice. Read the earlier records and make the choice below. Then read the new document and record what changed.'}</p><form id="monthly-choice">${businessControls(subset,r.business,r.choice)}<button data-cloud-submit>${subset.interactive.controls.some(c=>c.kind==='date')?'Schedule my payment':'Confirm my decision'}</button><div id="monthly-feedback" role="status"></div></form></section>`;}

function predictionPanel(){const r=run(),p=r.scenario.prediction;return `<section class="card reflection"><div class="tag">3 · A QUICK CONCEPT CHECK</div><h3>${safe(p.prompt)}</h3>${r.prediction===undefined?`<form id="prediction-form">${p.options.map((x,i)=>`<label class="prediction-option"><input type="radio" name="prediction" value="${i}" required>${safe(x)}</label>`).join('')}<button>Check my prediction</button></form>`:`<div class="message">${r.prediction===p.correct?'You predicted it correctly.':'Let’s connect the event to the accounts.'} ${safe(p.feedback)}</div>`}</section>`;}
function completion(r){const s=Lessons.grade(r);if(r.assignment.version===3)return `<div class="message"><strong>Assignment complete.</strong> Journal score: ${s.journal}/100. Your entries have been checked. Corrections and earlier attempts stay in your submission history.</div>`;return `<div class="message"><strong>Assignment completed.</strong> First-attempt score: ${s.journal+s.effects+s.prediction}/100. Journal ${s.journal}/80 · effects ${s.effects}/15 · prediction ${s.prediction}/5.<br>Your business identity continues. The next assignment starts with its own balances.</div>`;}
function wireAssignment(){Q('#back-assignments').onclick=()=>{active=null;record=null;notice='';render();};const a=assignment(),r=run();if(Q('#practice-guide'))Q('#practice-guide').onclick=()=>practiceGuide();if(Q('#assignment-tour'))Q('#assignment-tour').onclick=()=>assignmentTour();if(!r){const form=Q('#business-choice');const preview=()=>{if(a.interactive){try{const choice=readBusinessChoice(a,new FormData(form),data.profile),values=Lessons.decisions.choiceValues(a,choice,data.profile);Q('#choice-preview').innerHTML=a.interactive.controls.filter(c=>Lessons.decisions.controlStage(a,c)===0).map(c=>`<div><strong>${safe(businessText(c.label,data.profile))}</strong><span>${c.kind==='basket'||c.kind==='money'?cash(values[c.id]):c.kind==='date'?safe(Lessons.decisions.dateValue(a,c,choice[c.id])):safe(values[c.id])}</span></div>`).join('')+decisionImpact(a,choice,data.profile);}catch(error){Q('#choice-preview').textContent=error.message;}return;}const choice=a.interactive?readBusinessChoice(a,new FormData(form),data.profile):Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)]));if(a.publicDefinition){const plan=a.blueprint.paths[choice.plan],opening=a.blueprint.opening.filter(x=>x.account==='Cash').reduce((n,x)=>n+x.debit-x.credit,0);Q('#choice-preview').innerHTML=`<strong>${safe(plan.label)}</strong><p>${safe(plan.description.replaceAll('{{business}}',data.profile.name))}</p><p>Starting cash: ${cash(opening)} · ${plan.events.length} source records.</p>`;return;}const s=Lessons.expected(a,choice,data.profile);Q('#choice-preview').innerHTML=a.version===3?`<strong>Your chosen plan</strong><p>${safe(s.decision)}</p><p>Starting cash: ${cash(s.opening)} · ${s.events.length} documents. Review the facts before preparing the entries.</p>`:a.version===2?`<strong>Your plan, in numbers</strong>${s.decisions.map((x,i)=>`<p>${safe(x)}<br><small>${safe(choiceCostLine(a.concepts[i],s))}</small></p>`).join('')}<p>Verified starting cash: ${cash(s.opening)} · ${s.events.length} source records. Journal entries remain your work.</p>`:`${safe(s.decision)}. Starting cash: ${cash(s.opening)}. The decision creates source documents; you must determine the entries.`;};form.querySelectorAll('select,input').forEach(s=>{s.onchange=preview;s.oninput=preview;});preview();if(a.version===3)queueMicrotask(()=>{if(Q('#business-choice')&&!Q('#lesson-dialog').open){if(!practiceSeen())practiceGuide();else if(!tourSeen())assignmentTour();}});form.onsubmit=e=>{e.preventDefault();const choice=a.interactive?readBusinessChoice(a,new FormData(form),data.profile):Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)]));data.runs[a.id]={assignment:structuredClone(a),business:structuredClone(data.profile),choice,scenario:Lessons.expected(a,choice,data.profile),decidedMonths:[0],entries:{},first:{},advanced:false,completed:false};persist();render();focusAssignmentStep();};return;}
if(a.version===3&&!tourSeen())queueMicrotask(()=>{if(!Q('#lesson-dialog').open)assignmentTour();});if(Q('#monthly-choice'))Q('#monthly-choice').onsubmit=e=>{e.preventDefault();const choice=readBusinessChoice(a,new FormData(e.target),r.business,r.choice);if(!Lessons.decisions.validChoice(a,choice,r.business)){Q('#monthly-feedback').textContent='Check the quantities and amounts.';return;}const m=Lessons.pendingDecision(r);r.choice=choice;r.scenario=Lessons.expected(a,choice,r.business);r.decidedStages=[...(r.decidedStages||(r.decidedMonths||[0]).map(m=>m*2)),m];r.decidedMonths=[...new Set([...(r.decidedMonths||[0]),Math.floor(m/2)])];persist();render();focusAssignmentStep();};if(Q('#finish-assignment'))Q('#finish-assignment').onclick=()=>{if(!r.advanced||!r.scenario.events.every(e=>entryAssessment(r,e)?.correct))return;r.completed=true;persist();render();};document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{if(a.version===3||typeof episodeWorkspace==='function'){record=b.dataset.record;r.entryDateDraft='';render();Q('.guided-task-heading')?.scrollIntoView({behavior:'smooth',block:'start'});}else viewRecord(b.dataset.record);});Q('#view-taccounts').onclick=tAccounts;if(Q('#show-business-books'))Q('#show-business-books').onclick=tAccounts;if(Q('#advance-episode'))Q('#advance-episode').onclick=()=>{if(Lessons.pendingMonth(r)!==null)return;if(a.version>=2){r.stage=Math.min(Lessons.finalStage(a),(r.stage||0)+1);r.advanced=r.stage===Lessons.finalStage(a);}else r.advanced=true;persist();render();focusAssignmentStep();};if(Q('#journal-form')){Q('#entry-date').oninput=e=>r.entryDateDraft=e.target.value;document.querySelectorAll('[data-line]').forEach(el=>el.oninput=()=>entryRows[Number(el.dataset.line)][el.dataset.field]=el.value);Q('#add-line').onclick=()=>{if(entryRows.length<8){entryRows.push({account:'',debit:'',credit:''});render();}};if(Q('#no-entry'))Q('#no-entry').onclick=()=>{if(!Q('#entry-date').reportValidity())return;const e=r.scenario.events.find( function documentHtml(e,a,business){if(e.kind==='generated')return generatedDocument(e,a,business);if(e.kind==='episode')return episodeDocument(e,a,business);const d=e.detail,kind=e.kind,name=safe(business.name);let title='',issuer='',status='',body='',total=cash(e.amount),label='Total';if(kind==='lease'){title='Commercial rental receipt';issuer='Oak Street Property Management';status='PAID';body=`Tenant: ${name}<br>Location: ${['Quiet side street','Neighborhood main street','Town center'][d.location]}<br>Coverage begins: ${Lessons.day(a,1)}<br>Months paid in advance: ${d.months}<br>Monthly rental rate: ${cash(d.rate)}<br>Payment method: business checking`;label='Payment received';}if(kind==='coverage'){title='Rental coverage schedule';issuer='Oak Street Property Management';status='NO PAYMENT DUE';body=`Tenant: ${name}<br>Period ended: ${e.date}<br>Time occupied this period: 1 month<br>Original prepaid coverage: ${d.months} months<br>Monthly rental rate: ${cash(d.rate)}<br>Current cash charge: $0.00`;label='Coverage used at contract rate';}if(kind==='invoice'){title='Customer invoice';issuer=business.name;status='UNPAID';body=`Bill to: Neighborhood catering customer<br>Services delivered: ${e.date}<br>Order status: completed<br>Invoice total: ${cash(d.sale)}<br>Payment terms: agreed partial settlement later this month<br>Payment received on invoice date: $0.00`;label='Amount due';if(business.type==='Design studio')body=body.replace('catering customer','design client');if(business.type==='Bike repair')body=body.replace('catering customer','repair customer');}if(kind==='remittance'){title='Customer payment confirmation';issuer='Neighborhood Bank';status='RECEIVED';body=`Account holder: ${name}<br>Payment against invoice dated: ${Lessons.day(a,8)}<br>Original invoice: ${cash(d.sale)}<br>Transfer received: ${cash(d.paid)}<br>New services included with this transfer: none`;label='Cash deposited';}if(kind==='equipment'){title='Equipment supplier invoice';issuer='Northside Business Equipment';status='PAID';body=`Customer: ${name}<br>Item: ${safe((equipmentNames[business.type]||equipmentNames['Coffee shop'])[[600,1200,1800].indexOf(d.cost)])}<br>Delivered and placed in service: ${e.date}<br>Payment method: business checking`;label='Invoice total';}if(kind==='asset'){title='Fixed asset register';issuer=business.name+' · Business records';status='MONTH-END';body=`Placed in service: ${Lessons.day(a,1)}<br>Cost: ${cash(d.cost)}<br>Estimated useful life: ${d.life} years<br>Residual value: $0.00<br>Depreciation method: straight-line<br>Convention: full month from placement in service<br>Months used this period: 1`;label='Asset cost';total=cash(d.cost);}if(kind==='deposit'){title='Owner capital deposit slip';issuer='Neighborhood Bank';status='RECEIVED';body=`Account holder: ${name}<br>Depositor: business owner<br>Transfer description: initial business investment<br>Customer services involved: none`;label='Cash deposited';}if(kind==='advertising'){title='Advertising service invoice';issuer='Local Reach Media';status='PAID';body=`Client: ${name}<br>Campaign: ${['Local listing','Neighborhood promotion','Opening campaign'][[60,120,200].indexOf(d.ad)]}<br>Service delivered during: ${month(a)}<br>Payment method: business checking`;label='Invoice total';}return `<article class="source-document"><div class="paper-top"><span>${safe(issuer)}</span><span class="paper-status">${status}</span></div><h2>${title}</h2><div class="paper-meta"><span>Document ${safe(e.id).toUpperCase()}</span><span>${e.date}</span></div><div class="paper-item">${safe(e.title)}</div><p>${body}</p><div class="paper-total"><span>${label}</span><strong>${total}</strong></div><div class="paper-footer">Business copy · Retain with assignment records</div></article>`;}
function trialBalanceHtml(r){const t=Lessons.trialBalance(r.scenario,r.entries);return `<section class="trial-balance"><h3>Trial balance · ${safe(r.business.name)}</h3><p>Each row is an account’s ending balance from your posted entries. This is calculated for you; there are no totals to copy into another form.</p><table><thead><tr><th>Account</th><th>Debit balance</th><th>Credit balance</th></tr></thead><tbody>${t.rows.map(x=>`<tr><td>${safe(x.account)}</td><td>${x.debit?cash(x.debit):''}</td><td>${x.credit?cash(x.credit):''}</td></tr>`).join('')}</tbody><tfoot><tr><th>Total</th><th>${cash(t.debits)}</th><th>${cash(t.credits)}</th></tr></tfoot></table><p><strong>${t.balanced?'Debits and credits match.':'Debits and credits do not match.'}</strong> A matching total can still contain errors. Use the source documents and entry feedback to check the accounts and dates.</p>${r.scenario.accountDefinitions?`<div class="accounting-equation"><span>Assets <strong>${cash(t.assets)}</strong></span><b>=</b><span>Liabilities <strong>${cash(t.liabilities)}</strong></span><b>+</b><span>Equity <strong>${cash(t.equity)}</strong></span></div><p class="foot">Revenue increases equity. Expenses decrease equity. These figures include verified opening balances and any sales recorded for you.</p>`:''}</section>`;}
function tAccounts(){const r=run(),b=Lessons.balances(r.scenario,r.entries),d=Q('#lesson-dialog');const used=(r.scenario.accountList||Lessons.accounts).filter(a=>b[a]||Object.values(r.entries).some(e=>e.rows.some(x=>x.account===a)));d.innerHTML='<h2>Assignment T accounts</h2><p>Verified opening balances are included. These books show your latest entries, including errors until corrected.</p><div class="t-grid">'+used.map(a=>{const opening=r.scenario.openingBalances?r.scenario.openingBalances.filter(x=>x.account===a).reduce((n,x)=>n+x.debit-x.credit,0):a==='Cash'?r.scenario.opening:a==='Owner Capital'?-r.scenario.opening:0;return `<section class="t-account"><h3>${a}</h3><div class="t-head"><span>Debit</span><span>Credit</span></div><div class="t-body">${['debit','credit'].map(side=>`<div>${opening&&((opening>0)===(side==='debit'))?`<div><small>Verified opening balance</small>${cash(Math.abs(opening))}</div>`:''}${Object.values(r.entries).flatMap(e=>e.rows.filter(x=>x.account===a&&Number(x[side])).map(x=>`<div><small>${e.date}</small>${cash(Number(x[side]))}</div>`)).join('')}</div>`).join('')}</div><p>Balance: ${cash(Math.abs(b[a]))} ${b[a]>=0?'Dr':'Cr'}</p></section>`;}).join('')+'</div>'+trialBalanceHtml(r)+'<button id="close-ledger" class="secondary">Back to assignment</button>';d.showModal();Q('#close-ledger').onclick=()=>d.close();}

function professorSummary(a){const topics=a.teachingTopics||[],covered=new Set((a.topicCoverage||[]).map(x=>x.topicIndex)),controls=a.interactive?.controls||[],events=a.interactive?.events||a.blueprint?.paths?.[0]?.events||[],months=a.periodMonths||1,adjustments=events.filter(e=>e.stage===Lessons.finalStage(a)||/count|adjust|coverage|depreciation|accru|closing/i.test(e.title));return `<section class="professor-summary"><div class="tag">AT A GLANCE · STUDENT WORK</div><h3>What students will do</h3><p>Students run their own business over <strong>${months} ${months===1?'month':'months'}</strong> (${safe(month(a))}). They make the choices below, receive records from those choices, and write dated journal entries. Later records show what changes as time passes.</p><ul>${controls.map(c=>`<li>${safe(businessText(c.label,{name:'their business',type:'business',specialty:'its products and services'}))} — ${safe(businessText(c.purpose,{name:'their business',type:'business',specialty:'its products and services'}))}</li>`).join('')}</ul><p><strong>Accounting work:</strong> ${events.length} source records${adjustments.length?`, including ${adjustments.length} period-end or adjustment records`:''}. ${a.objectives.map(x=>safe(businessText(x,{name:'their business',type:'business'}))).join(' ')}</p><p><strong>How it unfolds:</strong> business choice → invoice or receipt → dated entry → next decision or month-end evidence → update the books. Grades come from accounting entries, not profit. ${a.simulation?'Customer activity gives the decisions a visible business result. When sales are outside the lesson, they are recorded automatically and earn no points.':''}</p>${topics.length?`<h4>Topics from the notes</h4><ul class="topic-coverage">${topics.map((t,i)=>`<li><strong>${safe(t.name)}</strong><span>${a.topicCoverage?.length?(covered.has(i)?'Included in source records':'Not covered in this draft'):'Check the records below for coverage'}</span></li>`).join('')}</ul>${a.topicCoverage?.length?`<p>${covered.size} of ${topics.length} topics included. Use the draft chat below if a missing topic matters for this lesson.</p>`:''}`:''}</section>`;}
function reviewDraft(){const a=teacherDraft,reviewBusiness={name:'Example business',type:reviewBusinessType},s=Lessons.expected(a,a.interactive?(Lessons.decisions.validChoice(a,reviewDecision,reviewBusiness)?reviewDecision:Lessons.decisions.defaultChoice(a,reviewBusiness)):a.version===3?{plan:reviewPlan}:a.version===2?Lessons.defaultEpisodeChoice(a):defaultChoice(a.topic),reviewBusiness),d=Q('#lesson-dialog'),example={...reviewBusiness,color:'sage'};d.innerHTML=`<div class="tag">PROFESSOR REVIEW · DRAFT</div><h2>${safe(businessText(a.title))}</h2><p>${safe(businessText(a.instructions))}</p>${a.version===3?professorSummary(a):''}${a.interactive?`<section class="review-decisions"><h3>Try the student’s decisions</h3><label class="field">Preview business<select id="review-business-type">${Object.keys(Lessons.businesses).map(type=>`<option ${type===reviewBusinessType?'selected':''}>${safe(type)}</option>`).join('')}</select></label><form id="review-decisions">${businessControls(a,reviewBusiness,Lessons.decisions.validChoice(a,reviewDecision,reviewBusiness)?reviewDecision:Lessons.decisions.defaultChoice(a,reviewBusiness))}<button class="secondary">Update preview</button></form></section>`:a.version===3?`<label class="field">Review this business option<select id="review-plan">${a.blueprint.paths.map((path,i)=>`<option value="${i}" ${i===reviewPlan?'selected':''}>${safe(path.label)}</option>`).join('')}</select></label>`:''}<div class="message"><strong>Student choice:</strong> ${safe(s.decision)}<br>The documents and answers below reflect these decisions. Change the preview to check a different order or budget.</div>${a.version>=2?`<details class="review-alignment"><summary>Topics covered and source notes</summary>${notesAnalysisHtml(a,true)}<p>${s.events.length} records · ${a.interactive?a.interactive.controls.length+' business decisions':a.version===3?'3 alternative business choices':a.concepts.length+' decision areas'} · ${s.stages.length} parts · dated journal entries.</p><p>Student records use their own business name and relevant items. Amounts come from their decisions.</p></details>`:''}<h3>What students will receive</h3><p class="foot">Open each record to check the facts. Then review the expected accounting below.</p><div class="review-docs">${s.events.map((e,i)=>`<details class="review-record" ${i===0?'open':''}><summary><span>${safe(e.date)}</span><strong>${safe(e.title)}</strong><small>View record</small></summary>${documentHtml(e,a,example)}</details>`).join('')}</div><details class="teacher-key"><summary>Answer key and grades</summary><table><thead><tr><th>Date</th><th>Debit</th><th>Credit</th><th>Amount</th></tr></thead><tbody>${s.events.map(e=>`<tr><td>${e.date}</td><td>${e.lines?e.lines.filter(x=>x.debit).map(x=>safe(x.account)+' '+cash(x.debit)).join('<br>'):e.debit}</td><td>${e.lines?e.lines.filter(x=>x.credit).map(x=>safe(x.account)+' '+cash(x.credit)).join('<br>'):e.credit}</td><td>${cash(e.amount)}</td></tr>`).join('')}</tbody></table>${a.version===3?'':`<p>${safe(s.prediction.prompt)}<br>Expected: ${safe(s.prediction.options[s.prediction.correct])}</p>`}<p>${s.effects.map(e=>e.label+': '+cash(e.value)).join('<br>')}</p><p>${a.version===3?'Journal entries: 100%. '+gradingCopy(a)+' Accounts '+(a.grading?.weights?.account??100/3).toFixed(0)+'% · amounts '+(a.grading?.weights?.amount??100/3).toFixed(0)+'% · dates '+(a.grading?.weights?.date??100/3).toFixed(0)+'%.':'Journal entries 80% · final balances 15% · concept check 5%.'}</p></details><div class="message">This assignment starts fresh. ${a.version===3?'Opening balances: '+a.blueprint.opening.map(x=>safe(x.account)+' '+cash(x.debit||x.credit)+' '+(x.debit?'Dr':'Cr')).join(' · '):s.opening?cash(s.opening)+' verified opening Cash and Owner Capital.':'Starts with no balances.'} No earlier assignment is required.</div><div class="actions review-publish-bar"><button id="publish-assignment">${a.published?'Save as a new assignment':'Approve & publish assignment'}</button><button class="secondary" id="close-review">Return to draft</button></div><p class="foot">Professor view is a local prototype, not a secure teacher login. Publishing does not notify students or upload to an LMS.</p>`;d.showModal();if(Q('#review-business-type'))Q('#review-business-type').onchange=e=>{reviewBusinessType=e.target.value;reviewDecision=null;d.close();reviewDraft();};if(Q('#review-decisions'))Q('#review-decisions').onsubmit=e=>{e.preventDefault();const choice=Lessons.decisions.readChoice(a,new FormData(e.target));if(!Lessons.decisions.validChoice(a,choice,reviewBusiness)){notice='Check the preview quantities and amounts.';return;}reviewDecision=choice;d.close();reviewDraft();};if(Q('#review-plan'))Q('#review-plan').onchange=e=>{reviewPlan=Number(e.target.value);d.close();reviewDraft();};Q('#close-review').onclick=()=>d.close();Q('#publish-assignment').onclick=()=>{if(!Lessons.checkAssignment(a))return;const published={...structuredClone(a),id:a.published?crypto.randomUUID():a.id,published:true,origin:'Professor assignment'};data.assignments.push(published);teacherDraft=defaultDraft();data.teacherDraft=teacherDraft;persist();d.close();teacherTab='library';notice='Assignment approved. Download its file to share with students.';render();};}
function download(filename,value){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function importAssignment(){const d=Q('#lesson-dialog');d.innerHTML='<h2>Import your professor’s assignment</h2><p>Select the assignment JSON file your professor shared through your course LMS or email. Your business identity stays the same; the assignment gets fresh accounting records.</p><input id="assignment-file" type="file" accept=".json,application/json"><div id="import-result" role="status"></div><button class="quiet" id="cancel-import">Cancel</button>';d.showModal();Q('#cancel-import').onclick=()=>d.close();Q('#assignment-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>150000)throw Error('Assignment file is too large.');const a=JSON.parse(await file.text());if(!Lessons.checkAssignment(a)||a.published!==true)throw Error('This is not a supported published Ledger Lane assignment.');if(data.assignments.some(x=>x.id===a.id))throw Error('This assignment is already in your classroom.');data.assignments.push({...a,origin:'Professor assignment'});persist();d.close();active=null;notice='Assignment imported. Select it to begin.';render();}catch(err){Q('#import-result').textContent=err.message;}};}
function help(){const d=Q('#lesson-dialog'),teacher=typeof cloudAccount!=='undefined'&&cloudAccount&&cloudAccount.role!=='student';d.innerHTML=`<h2>${teacher?'Instructor guide':'Getting started'}</h2><ol class="instructions">${(teacher?['Create a class in My classroom and approve your students’ email addresses.','Open Assignment studio and upload or paste the course material. Add a short learning goal and choose the period and assignment length.','Create the draft. Try different business decisions and review the documents and expected journal entries. The draft remains private until you publish it.','Publish to the selected class. Students find the assignment in their accounts.','Open the class gradebook to review scores, dated entries, and the original submission history.']:['Create your business, or sign in with the email your professor approved.','Open a class assignment and make a business choice.','Read the receipts, invoices, and period-end records. Write dated journal entries using the accounts and amounts.','Move the business forward whenever you’re ready. Bookkeeping does not block business activity.','Check the feedback after saving each entry. Correct the records marked Needs another look. The books update automatically; finish after the final records are checked.']).map(x=>`<li>${x}</li>`).join('')}</ol><p>${teacher?'AI creates a draft, not a published answer. Your review confirms the accounting, source facts, and teaching scope. Generating drafts uses paid API requests; student work and grading do not.':'Each assignment starts with its own balances. Your business identity stays with you; errors in earlier assignments do not carry forward.'}</p><button id="close-help">Close guide</button>`;d.showModal();Q('#close-help').onclick=()=>d.close();}
render();
function episodeChoiceForm(a){return `<section class="card episode-choices"><div class="tag">YOUR PLAN FOR ${safe(month(a)).toUpperCase()}</div><h2>Make the month your own.</h2><p>${a.concepts.length} operating decisions. Each creates its own records. You can run the month before doing any journal entries.</p><form id="business-choice">${Lessons.episodeChoices(a).map((c,i)=>`<fieldset class="decision-block"><legend>${i+1}. ${safe(c.decision)}</legend><p>${safe(c.goal)}</p>${c.fields.map(([field,label,values,numbers])=>`<label class="field">${safe(label)}<select name="${c.id}_${field}">${values.map((x,i)=>`<option value="${numbers?numbers[i]:i}" ${i===1?'selected':''}>${safe(c.id==='equipment'&&field==='level'?equipmentNames[data.profile.type][i]:x)}</option>`).join('')}</select></label>`).join('')}${c.id==='supplies'?`<p class="foot">For your ${safe(data.profile.type.toLowerCase())}: ${safe(Lessons.businesses[data.profile.type].supplies)}. These are operating supplies, not merchandise inventory.</p>`:''}</fieldset>`).join('')}<div class="message" id="choice-preview"></div><button data-cloud-submit>Confirm my business choice →</button></form></section>`;}
function recordsInbox(r){const events=Lessons.availableEvents(r),stage=r.stage||0;const recordButton=e=>`<button class="record" data-record="${safe(e.id)}"><span>${safe(e.date)}<br><strong>${safe(e.title)}</strong><small>${r.entries[e.id]?(entryAssessment(r,e)?.correct?(r.entries[e.id].rows.length?'✓ Correct entry':'✓ Correct: no entry'):'Needs another look'):'Not checked yet'}</small></span><span>View document →</span></button>`;if(r.assignment.version<2)return events.map(recordButton).join('');return orderConfirmation(r)+monthlyChoiceForm(r)+([...new Set(events.map(e=>e.stage))].sort((a,b)=>b-a).map(batch=>`<details class="record-batch" ${batch===stage?'open':''}><summary><strong>${safe(r.scenario.stages[batch])}</strong><span>${events.filter(e=>e.stage===batch).length} ${events.filter(e=>e.stage===batch).length===1?'record':'records'}${batch===stage?' · Current':''}</span></summary>${events.filter(e=>e.stage===batch).map(recordButton).join('')}</details>`).join('')||'<p>No new records in this part of the month. Your earlier records remain below; continue when you’re ready.</p>');}
function episodeProgress(r){const stage=r.stage||0,s=r.scenario,total=s.events.length,saved=Object.keys(r.entries).length;return `<div class="episode-progress"><ol>${s.stages.map((x,i)=>`<li class="${i===stage?'current':i<stage?'done':''}"><span>${i+1}</span>${safe(x)}</li>`).join('')}</ol><p>${saved} of ${total} records entered · ${Lessons.availableEvents(r).filter(e=>!entryAssessment(r,e)?.correct).length} available records to check</p>${Lessons.pendingMonth(r)!==null?'<p>Make this month’s business choice above before continuing.</p>':stage<Lessons.finalStage(r.assignment)?`<p>${(r.assignment.periodMonths||1)>1?'Your earlier records and books stay available as new records arrive.':stage===0?'The first records are ready. Read them now or continue to the next part of the month.':'Continue to month-end to receive the final records.'}</p><button id="advance-episode" data-cloud-submit>${(r.assignment.periodMonths||1)>1?(stage%2===0?'Open '+s.stages[stage+1]:'Continue to '+s.stages[stage+1]):stage===0?'Continue the month':'Open month-end records'} →</button><small>When you’ve tried the current records, continue to see what happens next. You can return to unfinished entries later.</small>`:'<div class="message">All records are available. Check your entries, then finish the assignment.</div>'}</div>`;}
function episodeDocument(e,a,business){const lines=e.detail.lines;const moneyKeys=/rate$|premium$|cost|amount|received|principal|payment|due$|wage$|purchased$|at cost$|transfer|advance$|supplies$/i;return `<article class="source-document"><div class="paper-top"><span>${safe(lines.find(([k])=>['Supplier','Provider','Lender','Depositor','Sender'].includes(k))?.[1]||business.name+' · Business records')}</span><span class="paper-status">${e.stage===2?'MONTH-END':'BUSINESS COPY'}</span></div><h2>${safe(businessText(e.title,business))}</h2><div class="paper-meta"><span>Ref ${safe(a.id.slice(0,6)).toUpperCase()}-${safe(e.id).toUpperCase()}</span><span>${safe(e.date)}</span></div><div class="paper-item">${safe(business.name)} · ${safe(business.specialty||business.type)}</div><dl class="document-facts">${lines.map(([key,value])=>`<div><dt>${safe(key)}</dt><dd>${safe(typeof value==='number'&&moneyKeys.test(key)?cash(value):value)}</dd></div>`).join('')}</dl>${e.stage!==2?`<div class="paper-total"><span>Transaction amount</span><strong>${cash(e.amount)}</strong></div>`:''}<div class="paper-footer">Retain with the ${safe(month(a))} business records · All dates refer to this scenario</div></article>`;}
function notesAnalysisHtml(a,review=false){if(a.version===3)return `<div class="scope-analysis"><h3>Learning objectives</h3><ul>${a.objectives.map(x=>`<li>${safe(x)}</li>`).join('')}</ul><h3>Referenced course material</h3>${a.source.map(x=>`<blockquote>${safe(x.evidence)}</blockquote>`).join('')}<p class="foot">Topics taken from your notes. Entries and reporting totals checked across business decisions. Check the source facts, topics, and answers. Try different student decisions before publishing.</p></div>`;if(typeof cloudAccount!=='undefined'&&cloudAccount&&!review)return `<p class="foot">${a.notes?.trim()?a.notes.trim().split(/\s+/).length+' words loaded. Generate a new draft after changing the source.':'Upload notes or paste the material you want students to apply.'}</p>`;const analysis=Lessons.analyzeNotes(a.notes||'');return `<div class="scope-analysis"><h3>${analysis.matches.length?'Concepts found in your notes':'What are you teaching?'}</h3>${analysis.matches.length?analysis.matches.map(x=>`<div class="scope-concept">${review?`<strong>${safe(x.name)}</strong>`:`<label><input type="checkbox" name="note-concept" value="${x.id}" ${a.needsRegeneration||!a.concepts||a.concepts.includes(x.id)?'checked':''}> ${safe(x.name)}</label>`}<blockquote>${safe(x.evidence)}</blockquote></div>`).join(''):'<p>Upload or paste the relevant notes. You can combine rent, insurance, supplies, receivables, equipment, owner funding, customer deposits, wages, operating accruals, supplier purchases, loans, withdrawals, and cash revenue.</p>'}${analysis.unsupported.length?`<div class="message error"><strong>Outside the current generator’s scope</strong><p>${analysis.unsupported.map(safe).join('; ')}. These topics will not be assigned or graded. Narrow the source material or leave them for a separate lesson.</p></div>`:''}<p class="foot">Select only concepts already taught. Up to six per episode. Generated depreciation uses straight-line, zero residual value, and a full month; generated loans use simple monthly interest.</p></div>`;}
async function readCourseNotes(file){if(file.size>10*1024*1024)throw Error('Choose a notes file smaller than 10 MB.');if(/\.(txt|md)$/i.test(file.name))return file.text();if(/\.pdf$/i.test(file.name)){const pdfjs=await import('./assets/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc=new URL('./assets/pdf.worker.mjs',location.href).href;const loadingTask=pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false});const pdf=await loadingTask.promise;try{if(pdf.numPages>80)throw Error('Upload the relevant chapter or slides, up to 80 pages.');let text='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),content=await page.getTextContent();text+=content.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n';if(text.length>30000)break;}return text;}finally{await loadingTask.destroy();}}if(/\.docx$/i.test(file.name)){if(!window.mammoth)await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='./assets/mammoth.browser.min.js';script.onload=resolve;script.onerror=()=>reject(Error('The document reader could not load. Refresh or paste your notes.'));document.head.appendChild(script);});const result=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return result.value;}throw Error('Use PDF, DOCX, TXT, or Markdown. You can also paste text from slides.');}
function conceptForRecord(id){return id.startsWith('rent-')?'prepaid':id.startsWith('insurance-')?'insurance':id.startsWith('supplies-')?'supplies':id.startsWith('customer-')||id==='second-invoice'?'receivables':id.startsWith('equipment-')||id==='asset-register'?'equipment':id==='owner-deposit'||id==='advertising-invoice'?'capital':id.startsWith('booking-')?'unearned':id.startsWith('payroll-')?'wages':id.startsWith('utility-')?'utilities':id.startsWith('supplier-')?'payables':id.startsWith('loan-')||id==='interest-accrual'?'borrowing':id==='owner-withdrawal'?'drawings':'cashsales';}
function choiceCostLine(id,s){const records=s.events.filter(e=>conceptForRecord(e.id)===id),paid=records.filter(e=>e.credit==='Cash').reduce((n,e)=>n+e.amount,0),received=records.filter(e=>e.debit==='Cash').reduce((n,e)=>n+e.amount,0);return [paid?'Planned cash payments: '+cash(paid):'',received?'Planned cash receipts: '+cash(received):'',!paid&&!received?'These records involve an unpaid obligation or a credit transaction.':''].filter(Boolean).join(' · ');}
function episodeScene(r){const stage=r.stage||0,batch=r.scenario.events.filter(e=>e.stage===stage),next=r.scenario.stages[stage+1];return `<section class="episode-scene"><div class="scene-store">${shop(r.business)}</div><div><div class="tag">${safe(r.scenario.stages[stage])} · ${safe(r.business.name)}</div><h3>${r.advanced?'The final records are here.':'See what happens next.'}</h3><p>${batch.length?batch.length+(batch.length===1?' new record is ready.':' new records are ready.')+' Read what happened before deciding which accounts change.':'Your earlier records are available. Continue to receive the next batch.'}</p><p>${next?'Next: '+safe(next)+'. Your entries and balances carry forward.':'Review your entries and accounts, then finish the assignment.'}</p><span class="scene-badge">${safe(month(r.assignment))} · ${safe(r.business.specialty||r.business.type)}</span></div></section>`;}

function generatedChoiceForm(a){if(a.interactive)return interactiveChoiceForm(a);return `<section class="card"><div class="tag">YOUR BUSINESS CHOICE</div><h2>What will your business do?</h2><p>Choose an option below. We’ll show you the receipts, invoices, and reports from what happens next. You’ll use those records to write your entries.</p><form id="business-choice">${a.blueprint.paths.map((p,i)=>`<label class="plan-option"><input type="radio" name="plan" value="${i}" ${i===0?'checked':''}><span><strong>${safe(p.label)}</strong><small>${safe(p.description.replaceAll('{{business}}',data.profile.name).replaceAll('{{type}}',data.profile.type))}</small></span></label>`).join('')}<div class="message" id="choice-preview"></div><button data-cloud-submit>Make this business choice</button></form></section>`;}
function documentLayout(e,d){const t=(e.title+' '+d.status).toLowerCase();return /\bcount\b|on hand/.test(t)?'count':/schedule|register|coverage/.test(t)?'schedule':/payment|transfer|remittance/.test(t)?'payment':/bank|statement/.test(t)?'bank':/receipt|paid in full/.test(t)?'receipt':/quote|proposal/.test(t)?'quote':d.layout||'invoice';}
function variedDocument(e,d,layout,business){const fields=d.fields.filter(f=>f.value!==business.name),header=`<header><strong>${safe(d.issuer)}</strong><span>${safe(d.status)}</span></header>`,ref=`<p class="document-reference">${safe(e.date)} · ${safe(e.id).toUpperCase()}</p>`,facts=fields.map(f=>`<div><span>${safe(f.label)}</span><strong>${safe(f.value)}</strong></div>`).join('');if(layout==='payment'||layout==='bank'){const amount=fields.find(f=>/amount paid|transfer amount|cash paid|payment amount|amount received|deposited|withdrawal|cash received/i.test(f.label));return `<article class="bank-voucher">${header}<div class="bank-voucher-body"><span class="bank-confirmed">✓ ${layout==='bank'?'Bank activity record':'Transfer confirmed'}</span><h2>${safe(e.title)}</h2><p>Business account · ${safe(business.name)}</p>${amount?`<div class="bank-transfer-amount">${safe(amount.value)}</div>`:''}${ref}<div class="bank-transfer-details">${facts}</div><footer>Keep this confirmation with the original invoice.</footer></div></article>`;}if(layout==='sales')return `<article class="sales-report">${header}<div class="sales-report-heading"><span>MONTHLY SALES SUMMARY</span><h2>${safe(business.name)}</h2>${ref}</div><div class="sales-report-facts">${facts}</div><footer>Customer payments received · Business copy<br>${e.autoPosted?'Already posted to your books. Do not record these sales again.':'Use this report to record sales for the period.'}</footer></article>`;if(layout==='receipt')return `<article class="till-receipt">${header}<h2>Receipt</h2><p>${safe(e.title)}<br>${safe(business.name)}</p>${ref}<div class="receipt-lines">${facts}</div><footer>Transaction copy<br>Thank you for your business</footer></article>`;if(layout==='count'||layout==='schedule')return `<article class="internal-sheet">${header}<div class="sheet-caption">${layout==='count'?'MONTH-END PHYSICAL COUNT':'COVERAGE & BUSINESS SCHEDULE'}</div><h2>${safe(e.title)}</h2><p>Prepared for ${safe(business.name)}</p>${ref}<table><thead><tr><th>${layout==='count'?'Count information':'Schedule detail'}</th><th>Recorded fact</th></tr></thead><tbody>${fields.map(f=>`<tr><td>${safe(f.label)}</td><td>${safe(f.value)}</td></tr>`).join('')}</tbody></table><footer>${layout==='count'?'A count is evidence of what remains, not a new purchase.':'Use the coverage dates to identify what belongs in this period.'}</footer></article>`;return `<article class="supplier-proposal">${header}<div class="proposal-mark">QUOTATION · OFFER</div><h2>${safe(e.title)}</h2><p>For ${safe(business.name)}</p>${ref}<div class="proposal-details">${facts}</div><footer>Check the order status. An offer alone does not mean a purchase was made.</footer></article>`;}

 const owner=cloudAccount.role==='owner'?`<section class="ih-card"><h2>Instructor access</h2><p class="ih-muted">Approve a professor’s email so they can create an account.</p><form id="grant-access" class="ih-inline"><input name="email" type="email" required maxlength="254" placeholder="professor@school.edu" aria-label="Email"><select name="role" aria-label="Role"><option value="professor">Professor</option><option value="student">Student</option></select><button class="lp-btn sm" data-cloud-submit>Approve</button></form><button id="view-access" class="lp-link">View approved accounts</button></section>`:'';
 return `<div class="lp ih"><section class="ih-head"><div><span class="lp-eyebrow">INSTRUCTOR HOME</span><h1>Welcome to Ledger Lane</h1><p>Signed in as ${safe(cloudAccount.email)}. Your classes, students and gradebook are all on this page.</p></div><div class="ih-actions"><button id="enter-connected" class="lp-btn">Open the lesson library →</button><a class="lp-btn alt" href="lessons.html">Try a lesson as a student</a></div></section>${steps}<section class="ih-card"><div class="ih-card-head"><h2>Gradebook${cls?` · ${safe(cls.name)}`:''}</h2><a class="lp-link" href="lessons.html#library">Assign lessons →</a></div><p class="ih-muted">Scores are first-attempt accuracy on graded tasks and appear when a student finishes an assigned lesson.</p>${grid}</section><div class="ih-grid">${classCard}${rosterCard}</div>${owner}</div>`;
}

async function gradebook(roster=false){const result=await cloud.call('gradebook',{classId:cloudClass}),d=Q('#lesson-dialog');d.innerHTML=`<h2>${roster?'Class roster':'Class gradebook'}</h2><p>${safe(cloudClasses.find(c=>c.id===cloudClass)?.name)} · Journal scores follow each assignment’s grading rules. Original submissions remain available.</p>${result.students.map(s=>`<section class="card"><h3>${safe(s.email)}</h3><p>${safe(s.business?.name||'Account/business not created yet')}</p>${roster?'<button class="secondary" data-remove="'+safe(s.email)+'">Remove from this class</button>':result.assignments.map(a=>{const r=s.runs.find(r=>r.assignment_id===a.id),g=r?.state.serverGrade;return `<div class="library-row"><div><strong>${safe(a.definition.title)}${a.definition.deleted?' · Deleted':''}</strong><p>${r?`${g.journal+g.effects+g.prediction}/100 · ${a.definition.version===3?'journal entries '+g.journal+'/100':'journal '+g.journal+'/80 · effects '+g.effects+'/15 · prediction '+g.prediction+'/5'} · ${r.state.completed?'Completed':'In progress'}`:'Not started'}</p></div>${r?`<button class="secondary" data-work="${s.runs.indexOf(r)}" data-student="${safe(s.email)}">Review work</button>`:''}</div>`;}).join('')}</section>`).join('')||'<p>No students invited yet.</p>'}<button id="close-gradebook" class="quiet">Close</button>`;d.showModal();Q('#close-gradebook').onclick=()=>d.close();d.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>cloudTask(async()=>{await cloud.call('remove-student',{classId:cloudClass,email:el.dataset.remove});d.close();await gradebook(true);}));d.querySelectorAll('[data-work]').forEach(el=>el.onclick=()=>cloudTask(async()=>{const s=result.students.find(s=>s.email===el.dataset.student),r=s.runs[Number(el.dataset.work)];const attempts=await cloud.call('attempts',{studentId:r.student_id,assignmentId:r.assignment_id});d.innerHTML=`<h2>${safe(s.business?.name||s.email)} · submitted work</h2><p>${safe(r.state.assignment.title)}</p><h3>Latest journal</h3>${Object.entries(r.state.entries).map(([id,e])=>`<div class="card"><strong>${safe(id)} · ${safe(e.date)}</strong>${e.rows.map(x=>`<p>${safe(x.account)} · debit ${cash(x.debit)} · credit ${cash(x.credit)}</p>`).join('')}</div>`).join('')}<h3>Server submission history</h3>${attempts.sort((a,b)=>a.revision-b.revision).map(a=>`<details><summary>${a.revision} · ${safe(a.action)} · ${safe(a.created_at?new Date(a.created_at).toLocaleString():'Time unavailable')}</summary>${submissionDetails(a,r.state)}</details>`).join('')}<button id="back-gradebook">Back to gradebook</button>`;Q('#back-gradebook').onclick=()=>cloudTask(async()=>{d.close();await gradebook();});}));}
