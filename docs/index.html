// A small arithmetic parser. No eval, property access, or executable expressions.
function calculate(formula,values){if(typeof formula!=='string'||formula.length>200)throw Error('Invalid accounting formula.');const tokens=formula.match(/[a-z][a-z0-9_]*|(?:\d+(?:\.\d*)?|\.\d+)|<=|>=|==|[<>()+*/-]/g)||[];if(tokens.join('')!==formula.replace(/\s/g,''))throw Error('Invalid accounting formula.');let at=0;const primary=()=>{const t=tokens[at++];if(t==='('){const n=compare();if(tokens[at++]!==')')throw Error('Incomplete formula.');return n;}if(t==='-')return -primary();if(t==='+')return primary();if(/^(?:\d|\.)/.test(t||''))return Number(t);if(t&&Object.hasOwn(values,t))return values[t];throw Error('Unknown decision in formula: '+String(t).slice(0,40));};const product=()=>{let n=primary();while(['*','/'].includes(tokens[at])){const op=tokens[at++],v=primary();if(op==='/'&&v===0)throw Error('A choice cannot divide by zero.');n=op==='*'?n*v:n/v;}return n;};const sum=()=>{let n=product();while(['+','-'].includes(tokens[at])){const op=tokens[at++],v=product();n=op==='+'?n+v:n-v;}return n;};const compare=()=>{let n=sum();if(['<=','>=','<','>','=='].includes(tokens[at])){const op=tokens[at++],v=sum();n=Number(op==='<='?n<=v:op==='>='?n>=v:op==='<'?n<v:op==='>'?n>v:n===v);}return n;};const n=compare();if(at!==tokens.length||!Number.isFinite(n)||Math.abs(n)>1e6)throw Error('Decision amount is outside the lesson limits.');return cents(n);}

function profilePage(){designDraft={name:'',type:'Coffee shop',color:'sage',style:Lessons.styles[0],district:Lessons.districts[0],...designDraft};shell(`<section class="designer-heading"><div class="tag">YOUR SEMESTER STARTS HERE</div><h1>A business that’s yours.</h1><p>Choose what you do, design your place, and give it a personality. This business stays with you all semester.</p></section>${designer('profile-form')}`);wireDesigner('profile-form',false);Q('#profile-form').onsubmit=e=>{e.preventDefault();try{data.profile=Lessons.normalizeBusiness(readBusinessForm(e.target));designDraft=null;persist();render();}catch(error){notice=error.message;render();}};}
function readBusinessForm(form){const f=Object.fromEntries(new FormData(form));return {name:f.name,type:f.type,color:f.color,style:f.style,district:f.district,specialty:f.specialty,logo:f.logo,tagline:f.tagline};}
function designer(id,editing=false){const p=designDraft||data.profile,biz=Lessons.businesses[p.type];return `<form id="${id}" class="business-designer"><section><div class="tag">01 · FIND YOUR THING</div><h2>What will you build?</h2><div class="business-picker">${Object.entries(Lessons.businesses).map(([type,b])=>`<label class="business-tile ${p.type===type?'chosen':''}"><input type="radio" name="type" value="${safe(type)}" ${p.type===type?'checked':''} ${editing?'disabled':''}><span class="business-icon">${b.icon}</span><strong>${safe(type)}</strong><small>${safe(b.description)}</small></label>`).join('')}</div>${editing?`<input type="hidden" name="type" value="${safe(p.type)}"><p class="foot">Your business type stays with completed assignment records.</p>`:''}</section><section class="card designer-preview"><div id="design-shop">${shop(p)}</div><div class="tag">02 · MAKE IT YOURS</div><label class="field">Business name<input id="business-name" name="name" maxlength="45" required placeholder="Tommy’s Coffee" value="${safe(p.name)}"></label><label class="field">A line for your sign<input name="tagline" maxlength="70" placeholder="Good mornings start here" value="${safe(p.tagline||'')}"></label><label class="field">Your specialty<select name="specialty">${biz.products.map(x=>`<option ${x===p.specialty?'selected':''}>${safe(x)}</option>`).join('')}</select></label><div class="form-pair"><label class="field">Storefront<select name="style">${Lessons.styles.map(x=>`<option ${x===p.style?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Neighborhood<select name="district">${Lessons.districts.map(x=>`<option ${x===p.district?'selected':''}>${x}</option>`).join('')}</select></label></div><fieldset class="palette"><legend>Brand color</legend>${Object.entries(Lessons.colors).map(([color,hex])=>`<label style="--swatch:${hex}" title="${color}"><input type="radio" name="color" value="${color}" ${color===p.color?'checked':''}><span></span><small>${color}</small></label>`).join('')}</fieldset><label class="field">Sign symbol<select name="logo">${[biz.icon,'✦','●','❧','◇'].map(x=>`<option ${x===p.logo?'selected':''}>${x}</option>`).join('')}</select></label><p class="foot">Your design is personal. Accounting assignments start with their own verified balances.</p><button ${id==='profile-form'?'data-cloud-submit':''}>${editing?'Save my business':'Open my business'} →</button></section></form>`;}
function wireDesigner(id,editing){const form=Q('#'+id);form.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>{const v=readBusinessForm(form);const typeChanged=v.type!==designDraft.type;if(typeChanged){v.specialty=Lessons.businesses[v.type].products[0];v.logo=Lessons.businesses[v.type].icon;}designDraft=v;form.querySelectorAll('.business-tile').forEach(t=>t.classList.toggle('chosen',t.querySelector('input').value===v.type));const specialty=form.querySelector('[name=specialty]'),logo=form.querySelector('[name=logo]');if(typeChanged||!Lessons.businesses[v.type].products.includes(specialty.value)){specialty.innerHTML=Lessons.businesses[v.type].products.map(x=>`<option>${safe(x)}</option>`).join('');}if(typeChanged||![Lessons.businesses[v.type].icon,'✦','●','❧','◇'].includes(logo.value)){logo.innerHTML=[Lessons.businesses[v.type].icon,'✦','●','❧','◇'].map(x=>`<option>${x}</option>`).join('');}Q('#design-shop').innerHTML=shop(designDraft);}));}

function shop(p=data.profile){const b=Lessons.businesses[p.type]||Lessons.businesses['Coffee shop'],style=p.style||Lessons.styles[0];return `<div class="class-shop ${safe(p.color)} ${style==='Modern studio'?'modern':style==='Garden storefront'?'garden':''}" style="--brand:${Lessons.colors[p.color]||Lessons.colors.sage}"><div class="district-line">${safe(p.district||Lessons.districts[0])} · ${safe(p.type)}</div><div class="shop-sign"><span>${safe(p.logo||b.icon)}</span> ${safe(p.name||'Your business')}<small>${safe(p.tagline||p.specialty||b.products[0])}</small></div><div class="class-awning"></div><div class="class-windows"><span>${b.icon}</span><span class="shop-door">${run()?.completed?'MONTH CLOSED':'OPEN'}</span><span>${safe(p.logo||b.icon)}</span></div><div class="shop-sidewalk"></div></div>`;}

function studentIntro(){return `<div class="intro"><div><div class="tag">${safe(data.profile.type)} · BUSINESS CLASSROOM</div><h1>${safe(data.profile.name)}</h1><p>Your business stays the same. Each assignment starts with its own records.</p></div><button id="import" class="secondary">Import assignment</button></div><nav class="tabs"><button data-page="assignments" class="${page==='assignments'?'selected':''}">Assignments</button><button data-page="ledger" class="${page==='ledger'?'selected':''}">General ledger</button><button data-page="portfolio" class="${page==='portfolio'?'selected':''}">Learning portfolio</button><button data-page="profile" class="${page==='profile'?'selected':''}">Business profile</button></nav>`;}
function studentNav(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;active=null;notice='';render();});Q('#import').onclick=importAssignment;}
function renderStudent(){let content='';if(page==='profile')content=`<div class="role-grid"><section class="card">${shop()}</section><section class="card"><h2>Your business identity</h2><p><strong>${safe(data.profile.name)}</strong><br>${safe(data.profile.type)}</p><p>Business identity carries across assignments. Balances, transactions and mistakes do not. Each assignment is a separate classroom scenario.</p><button id="edit-profile" class="secondary">Redesign my business</button></section></div>`;else if(page==='ledger')content=ledgerPage();else if(page==='portfolio')content=portfolio();else if(active)content=assignmentPage();else content=`<div class="assignment-layout"><section class="card business-summary">${shop()}<h3>A business worth understanding.</h3><p>Select a lesson or import an assignment from your professor. You will choose a business action, read the documents, and account for the result.</p><div class="message">Example assignments are ready to try. Your professor can replace these with course-specific assignments.</div></section><div class="assignment-list">${data.assignments.filter(a=>a.published&&!a.deleted).map(a=>{const r=data.runs[a.id],s=r?Lessons.grade(r):null;return `<section class="card assignment-card"><div class="tag">${safe(a.origin||a.course)} · ${Lessons.topic(a).name}</div><h2>${safe(businessText(a.title))}</h2><p>${safe(businessText(a.instructions))}</p><div class="assignment-meta"><span>${month(a)}</span><span>${a.interactive?a.interactive.controls.length+' decisions · '+a.blueprint.paths[0].events.length+' records':a.version===3?'Business plan · '+a.blueprint.paths[0].events.length+' records':a.version===2?a.concepts.length+' decisions · '+Lessons.expected(a,Lessons.defaultEpisodeChoice(a),data.profile).events.length+' records':'One decision · two records'}</span><span>${r?.completed?'Completed':r?'In progress':'Not started'}</span>${a.version===3?'<span>Created from course notes</span>':a.version===2?`<span>${safe(a.concepts.map(id=>Lessons.concepts[id].name).join(' · '))}</span>`:''}</div><button data-open="${safe(a.id)}">${r?.completed?'Review assignment':r?'Continue assignment':'Start assignment'} →</button></section>`;}).join('')}</div></div>`;
shell(studentIntro()+content);studentNav();if(page==='ledger'&&Q('#open-ledger'))Q('#open-ledger').onclick=()=>{const old=active;active=Q('#ledger-episode').value;tAccounts();active=old;};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{active=b.dataset.open;record=null;notice='';render();});if(page==='profile')Q('#edit-profile').onclick=editProfile;if(page==='portfolio'){Q('#export-portfolio').onclick=()=>download('ledger-lane-portfolio.json',{version:1,profile:data.profile,runs:data.runs,note:'Local student-controlled work, not an authenticated grade record.'});return;}if(active)wireAssignment();}
function portfolio(){const rows=data.assignments.filter(a=>data.runs[a.id]);return `<section class="card portfolio-card"><h2>Your progress</h2><p>Journal scores update as you correct your work. Your professor can review earlier submissions.</p><table><thead><tr><th>Assignment</th><th>Score</th><th>Status</th></tr></thead><tbody>${rows.map(a=>{const r=data.runs[a.id],s=Lessons.grade(r);return `<tr><td>${safe(businessText(a.title))}</td><td>${s.journal+s.effects+s.prediction}/100</td><td>${r.completed?'Completed':'In progress'}</td></tr>`;}).join('')||'<tr><td colspan="3">Start an assignment to begin.</td></tr>'}</tbody></table><button id="export-portfolio">Download portfolio</button><p class="foot">Downloads are copies of your work.</p></section>`;}

function editProfile(){designDraft={...data.profile};const d=Q('#lesson-dialog');d.innerHTML=`<h2>Your business, your style.</h2>${designer('edit-profile-form',true)}<button class="quiet" id="cancel-design">Cancel</button>`;d.showModal();wireDesigner('edit-profile-form',true);Q('#cancel-design').onclick=()=>{designDraft=null;d.close();};Q('#edit-profile-form').onsubmit=e=>{e.preventDefault();data.profile=Lessons.normalizeBusiness(readBusinessForm(e.target));designDraft=null;persist();d.close();render();};}

function choiceForm(a){if(a.version===3)return generatedChoiceForm(a);if(a.version===2)return episodeChoiceForm(a);let fields='';if(a.topic==='prepaid')fields=`<label class="field">Location<select name="location"><option value="0">Quiet side street · $150/month</option><option value="1">Neighborhood main street · $250/month</option><option value="2">Town center · $400/month</option></select></label><label class="field">Pay in advance for<select name="months"><option value="1">One month</option><option value="3" selected>Three months</option><option value="6">Six months</option></select></label><p>The payment purchases coverage beginning on the first day of the assignment month. At month-end, one month has been used. Other operating transactions are excluded from this lesson.</p>`;if(a.topic==='receivables')fields=`<label class="field">Customer order<select name="order"><option value="0">Small order · $400</option><option value="1">Medium order · $700</option><option value="2">Large order · $1,000</option></select></label><label class="field">Customer payment arrangement<select name="collection"><option value="0">Collect 25% this month</option><option value="1" selected>Collect 50% this month</option><option value="2">Collect 100% this month</option></select></label><p>You deliver the order on credit, then collect the agreed portion later in the month. Supplies and other expenses are outside this focused lesson.</p>`;if(a.topic==='equipment')fields=`<label class="field">Equipment package<select name="level">${equipmentNames[data.profile.type].map((x,i)=>`<option value="${i}">${safe(x)} · ${cash([600,1200,1800][i])}</option>`).join('')}</select></label><label class="field">Estimated useful life<select name="life"><option value="0">3 years</option><option value="1" selected>5 years</option><option value="2">6 years</option></select></label><p>Equipment is placed in service on the first day. Use straight-line depreciation, zero residual value, and one full month of use. The estimate is a classroom choice; actual estimates require evidence.</p>`;if(a.topic==='capital')fields=`<label class="field">Owner contribution<select name="investment"><option value="0">$3,000</option><option value="1" selected>$5,000</option><option value="2">$7,000</option></select></label><label class="field">Advertising package<select name="ad"><option value="0">Local listing · $60</option><option value="1">Neighborhood promotion · $120</option><option value="2">Opening campaign · $200</option></select></label><p>The owner funds the business, then you pay for advertising delivered during the month. No sales occur in this focused episode.</p>`;return `<section class="card"><div class="tag">1 · MAKE THE BUSINESS CHOICE</div><h2>What will ${safe(data.profile.name)} do?</h2><form id="business-choice">${fields}<div class="message" id="choice-preview"></div><button>Confirm business decision →</button></form></section>`;}
function visibleDecisions(r){return r.assignment.interactive?r.scenario.decisions.filter((_,i)=>(r.decidedStages||(r.decidedMonths||[0]).map(m=>m*2)).includes(Lessons.decisions.controlStage(r.assignment,r.assignment.interactive.controls[i]))):r.scenario.decisions;}
function assignmentPage(){const a=assignment(),r=run();if(!r)return `<button class="quiet" id="back-assignments">← All assignments</button><div class="lesson-heading"><div class="tag">${Lessons.topic(a).name} · ${month(a)}</div><h2>${safe(businessText(a.title))}</h2><p>${safe(businessText(a.instructions))}</p><div class="message">This assignment starts fresh. ${a.version===3?'Opening balances are supplied with this assignment.':a.version===2?'Opening cash and owner capital are verified for this episode.':a.topic==='capital'?'Opening cash is $0.':'Opening cash is $8,000, supported by verified owner capital.'} Your business name and design stay the same; this assignment has its own books.</div></div><div class="role-grid"><section class="card">${shop()}<h3>What you’ll practice</h3>${a.version>=2?`<ol class="mission-list">${(a.version===3?a.objectives:a.concepts.map(id=>Lessons.concepts[id].goal)).map(goal=>`<li>${safe(goal)}</li>`).join('')}</ol><p class="foot">${a.version===3?'Your journal entries earn the points. Corrections improve your score. No balance-copying or multiple-choice quiz.':'Grading: journal 80% · financial report 15% · concept check 5%.'}</p>`:`<p>${Lessons.topic(a).goal}</p>`}<p>${a.version===3?'Make your business choices. Open each record, enter its date, and write the debit and credit. We’ll tell you whether the entry is right.':a.version===2?'Read the records, write your entries, and finish the report.':Lessons.topic(a).effect}</p><button id="practice-guide" class="secondary">Try a guided practice entry</button></section>${choiceForm(a)}</div>`;
if(a.version===3)return guidedAssignment(r);
const s=r.scenario,unlocked=Lessons.availableEvents(r),allCorrect=s.events.every(e=>entryAssessment(r,e)?.correct);return `<button class="quiet" id="back-assignments">← All assignments</button><div class="lesson-heading"><div class="tag">${Lessons.topic(a).name} · ${month(a)}</div><h2>${safe(businessText(a.title))}</h2><details class="assignment-overview"><summary>What this assignment is about</summary><p>${safe(businessText(a.instructions))}</p></details></div>${a.version>=2?episodeScene(r):''}<div class="episode-strip"><div><span class="tag">YOUR BUSINESS CHOICES</span>${a.version>=2?`<details><summary>${visibleDecisions(r).length} ${visibleDecisions(r).length===1?'decision':'decisions'} for ${safe(r.business.name)}</summary>${visibleDecisions(r).map(x=>`<p>${safe(x)}</p>`).join('')}</details>`:`<strong>${safe(s.decision)}</strong>`}</div><div><span class="tag">VERIFIED STARTING CASH</span><strong>${cash(s.opening)}</strong></div><div><span class="tag">SCENARIO STATUS</span><strong>${r.completed?'Completed':a.version>=2?s.stages[r.stage||0]:r.advanced?'Month-end review':'Business decision made'}</strong></div></div><div class="lesson-workspace"><section class="card"><div class="tag">2 · READ THE BUSINESS RECORDS</div><h2>Records inbox</h2><p>Open a record, read what happened, then write its entry. After saving, check the feedback. When you’ve tried the current records, continue to the next batch.</p><button id="practice-guide" class="quiet">Replay guided practice</button>${recordsInbox(r)}${a.version>=2?episodeProgress(r):!r.advanced?`<div class="time-step"><h3>${['prepaid','equipment'].includes(a.topic)?'The month moves forward':'The next business event arrives'}</h3><p>${['prepaid','equipment'].includes(a.topic)?'Your business has used its resources for one month. Check what changes at month-end.':'Read the next document to distinguish the later event from the original transaction.'}</p><button id="advance-episode">${['prepaid','equipment'].includes(a.topic)?'Advance to month-end →':'Continue the episode →'}</button></div>`:''}<button class="quiet" id="view-taccounts">Open T accounts</button></section><section class="card bookkeeper"><div class="tag">YOUR BOOKKEEPING</div><h2>${record?'Journal entry':'Open a document to begin'}</h2>${record?journalForm(s.events.find(e=>e.id===record)): '<p>Choose a document in the records inbox. Inspect it before selecting accounts and writing the entry.</p>'}</section></div>${a.version===3?businessChallenge(r)+finishJournal(r):r.advanced?predictionPanel():''}${a.version!==3&&r.advanced&&r.prediction!==undefined?`<section class="card reflection"><div class="tag">4 · SEE THE FINANCIAL EFFECT</div><h2>What do the accounts tell you?</h2><p>${a.version>=2?'Read the records, write your entries, and finish the report.':Lessons.topic(a).effect} Use your T accounts to reconcile these statement totals.</p><form id="effect-form">${s.effects.map(e=>`<label class="statement-line">${e.label}<input name="${e.key}" aria-label="${e.label}" type="number" step=".01" required value="${safe(r.effectDraft?.[e.key]??'')}"></label>`).join('')}<button ${!allCorrect?'disabled':''}>Check financial effects</button>${!allCorrect?'<p class="foot">Correct the journal entries before completing the statement sections.</p>':''}</form><div id="effect-feedback" role="status">${r.completed?completion(r):''}</div></section>`:''}<section class="card reflection"><h3>Assignment journal</h3><table><thead><tr><th>Date</th><th>Document</th><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${Object.entries(r.entries).map(([id,e])=>e.rows.map((x,i)=>`<tr><td>${i===0?e.date:''}</td><td>${i===0?s.events.find(x=>x.id===id).title:''}</td><td>${safe(x.account)}</td><td>${Number(x.debit)?cash(Number(x.debit)):''}</td><td>${Number(x.credit)?cash(Number(x.credit)):''}</td></tr>`).join('')).join('')||'<tr><td colspan="5">Your journal entries will appear here.</td></tr>'}</tbody></table><p class="foot">Corrections replace entries in these books. Original attempts remain in your grading record.</p></section>`;}
function recordPurpose(e){const d=e.detail?.document||e.document||{},kind=documentLayout(e,d);return kind==='invoice'?'Check what was delivered, the invoice date, and whether it was paid. Record the purchase or sale shown here.':kind==='payment'||kind==='bank'?'This is a payment, not another purchase. Check the payment date, amount, and the earlier bill it settles. Record the money moving in or out.':kind==='count'?'This count shows what remains at month-end. Compare it with your purchases and earlier usage to work out what was used this month.':kind==='receipt'?'This receipt shows a completed transaction. Check what was bought or sold and how much was paid, then record it.':kind==='quote'?'Check whether this is only an offer or an actual transaction. A proposal alone may need no entry.':'Read the dates, coverage and amounts. Work out what changed during this period, then record the change.';}
function guidedContinue(r){const stage=r.stage||0,last=Lessons.finalStage(r.assignment);if(stage>=last)return '<div class="message">All records are here. Check any entries marked “needs another look”, then finish below.</div>';const controls=r.assignment.interactive?.controls.filter(c=>Lessons.decisions.controlStage(r.assignment,c)===stage+1)||[],date=controls.some(c=>c.kind==='date'),next=controls.length?(date?'Choose when to pay the bill':'Make the next business choice'):stage+1===last?'Open month-end records':'See the next records',remaining=Lessons.availableEvents(r).filter(e=>e.stage===stage&&!r.entries[e.id]).length;return `<h3>Next: ${safe(next)}</h3><p>${remaining?`You have ${remaining} ${remaining===1?'record':'records'} left to try in this step. You can continue and return to ${remaining===1?'it':'them'} later.`:'You’ve tried the records in this step. Continue when you’re ready.'}</p><button id="advance-episode" data-cloud-submit>${safe(next)} →</button><p class="foot">Your earlier documents and entries stay available. Continuing does not submit your assignment.</p>`;}
function guidedAssignment(r){const a=r.assignment,stage=r.stage||0,pending=Lessons.pendingDecision(r),available=Lessons.availableEvents(r),batch=available.filter(e=>e.stage===stage),earlier=available.filter(e=>e.stage<stage);if(pending!==null)record=null;else if(!available.some(e=>e.id===record)||r.guidedStage!==stage){record=(batch.find(e=>!r.entries[e.id])||batch[0])?.id||null;r.guidedStage=stage;}const current=available.find(e=>e.id===record),index=batch.findIndex(e=>e.id===record),next=batch[index+1],button=e=>`<button class="guided-record ${record===e.id?'selected':''}" data-record="${safe(e.id)}"><span>${safe(e.date)}</span><strong>${safe(e.title)}</strong><small>${r.entries[e.id]?(entryAssessment(r,e)?.correct?'✓ Correct':'Saved · needs another look'):'Not entered'}</small></button>`;return `<button class="quiet" id="back-assignments">← All assignments</button><div class="lesson-heading"><div class="tag">${safe(r.business.name)} · ${safe(month(a))}</div><h2>${safe(businessText(a.title,r.business))}</h2><details><summary>Assignment goal and instructions</summary><p>${safe(businessText(a.instructions,r.business))}</p></details></div><nav class="guided-path" aria-label="Assignment steps"><span class="done">1 · Make a business choice</span><span class="${pending===null?'current':''}">2 · Read and record what happened</span><span class="${pending!==null?'current':''}">3 · Choose what happens next</span><span class="${r.advanced?'current':''}">4 · Finish the books</span></nav>${pending!==null?`<section class="card guided-next"><h2>Your next business choice</h2>${earlier.length?`<details><summary>Review the earlier invoice before deciding</summary>${earlier.filter(e=>documentLayout(e,e.detail.document)==='invoice').map(e=>documentHtml(e,a,r.business)).join('')}</details>`:''}${monthlyChoiceForm(r)}</section>`:`${stage===0?orderConfirmation(r):''}<section class="guided-task-heading"><div class="tag">${safe(r.scenario.stages[stage])}${batch.length?(index>=0?' · Record '+(index+1)+' of '+batch.length:' · Earlier record'):''}</div><h2>${current?safe(current.title):'This step is finished'}</h2><p>${current?recordPurpose(current):'Continue to make the next business choice or receive the next records.'}</p></section>${batch.length?`<div class="guided-record-tabs">${batch.map(button).join('')}</div>`:''}${current?`<div class="guided-workspace"><section class="guided-evidence">${documentHtml(current,a,r.business)}</section><section class="card bookkeeper"><div class="tag">YOUR ENTRY · ${safe(current.date)}</div><h2>Record this in your books</h2>${journalForm(current,false)}${next?`<button class="guided-next-record" data-record="${safe(next.id)}">Next record: ${safe(next.title)} →</button>`:'<p class="guided-ready">When you’ve tried this record, continue below. You can return to fix entries later.</p>'}</section></div>`:''}<section class="card guided-continue">${guidedContinue(r)}</section>`}<div class="guided-tools"><button class="quiet" id="view-taccounts">Open T accounts</button><button class="quiet" id="assignment-tour">What do I do?</button><button class="quiet" id="practice-guide">Replay guided practice</button></div>${earlier.length?`<details class="card earlier-work"><summary>Earlier records · ${earlier.length} available</summary>${earlier.map(button).join('')}</details>`:''}${r.advanced?finishJournal(r):''}<details class="optional-business"><summary>Optional business challenge</summary>${businessChallenge(r)}</details>`;}
function journalForm(e,showDocument=true){const r=run(),old=r.entries[e.id];if(record!==r.selectedRecord){entryRows=old?.rows.length?structuredClone(old.rows):[{account:'',debit:'',credit:''},{account:'',debit:'',credit:''}];r.selectedRecord=record;}return `${showDocument?documentHtml(e,assignment(),r.business):''}<form id="journal-form"><label class="field">Journal-entry date<input id="entry-date" type="date" required value="${safe(old?.date||r.entryDateDraft||'')}"></label><table><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${entryRows.map((x,i)=>`<tr><td><select data-line="${i}" data-field="account" aria-label="Account ${i+1}" required><option value="">Select account</option>${(assignment().version===3?r.scenario.accountList:assignment().version===2?[...new Set(['Cash','Owner Capital',...r.scenario.events.flatMap(x=>[x.debit,x.credit])])].sort():Lessons.accounts).map(a=>`<option ${a===x.account?'selected':''}>${a}</option>`).join('')}</select></td><td><input data-line="${i}" data-field="debit" aria-label="Debit ${i+1}" type="number" step=".01" min="0" value="${safe(x.debit)}"></td><td><input data-line="${i}" data-field="credit" aria-label="Credit ${i+1}" type="number" step=".01" min="0" value="${safe(x.credit)}"></td></tr>`).join('')}</tbody></table><div class="actions"><button>Save and check entry</button><button type="button" class="secondary" id="add-line">+ Line</button>${assignment().version===3?'<button type="button" class="secondary" id="no-entry">No journal entry required</button>':''}${assignment().support==='guided'?'<button type="button" class="quiet" id="hint">Concept hint</button>':''}</div></form><div id="entry-feedback" role="status">${old?entryFeedback(entryAssessment(r,e)):''}</div><p class="foot">Use the date the transaction happened, choose the accounts affected, and enter equal debit and credit totals. Saving checks your entry; it does not end the assignment.</p>`;}
function entryFeedback(g){if(!g)return '<div class="message">Entry saved. Refresh to see feedback.</div>';return `<div class="message ${g.correct?'':'error'}">${g.correct?'Correct entry. Your date, accounts, debit and credit match this record.':`${!g.date?'Use the transaction date printed on the document, not today’s date. ':''}${!g.account?'The accounts don’t match this record. Check what the business received or used, and whether cash was paid or the amount is still owed. ':!g.amount?'The amounts or debit/credit sides don’t match. Recalculate using this document’s amounts and payment terms. ':''}Your entry is saved, but it needs another look. Correct it and check again.`}</div>`;}
function finishJournal(r){const all=r.scenario.events.every(e=>entryAssessment(r,e)?.correct),saved=Object.keys(r.entries).length,total=r.scenario.events.length,b=Lessons.balances(r.scenario,r.entries);return `<section class="card journal-finish"><div class="tag">YOUR NEXT STEP</div><h2>${r.completed?'You finished this assignment':!r.advanced?'Keep the business moving':all?'Your entries are ready':'Check the entries that need another look'}</h2><p>${!r.advanced?'Read the current records and try their entries. When you’ve worked through this batch, use the continue button in the inbox to receive the next records. You may move ahead with unfinished entries.':all?'Every record has a correct entry or a correctly identified no-entry decision. Your books below update automatically. Finish when you’re ready.':`${saved} of ${total} records have an entry. The inbox marks correct entries and entries to revisit. Open a marked record to correct it.`}</p>${r.advanced?`<details><summary>Your books · calculated from your entries</summary><p>These are your posted balances. You don’t need to copy them into another form.</p><div class="book-balance-list">${Object.entries(b).filter(([,n])=>n!==0).map(([name,n])=>`<div><span>${safe(name)}</span><strong>${cash(Math.abs(n))} ${n<0?'Cr':'Dr'}</strong></div>`).join('')}</div></details>`:''}${r.completed?completion(r):r.advanced&&all?'<button id="finish-assignment" data-cloud-submit>Finish assignment</button>':''}<p class="foot">Your score comes from your dated journal entries. Correcting an entry improves your score. Earlier attempts stay available to your professor.</p></section>`;}
function assignmentTourKey(){return 'ledger-tour-'+(typeof cloudAccount!=='undefined'&&cloudAccount?cloudAccount.id:'local')+'-'+assignment().id;}
function tourSeen(){try{return localStorage.getItem(assignmentTourKey())==='done';}catch{return false;}}
function assignmentTour(step=0){const a=assignment(),d=Q('#lesson-dialog'),name=safe(data.profile?.name||'your business'),pages=[{title:'You run the business. You keep the books.',text:`This assignment takes place at ${name} over ${a.periodMonths||1} ${(a.periodMonths||1)===1?'month':'months'}. ${safe(businessText(a.instructions))}<p>Your grade comes from your entries, not how much money you make.</p>`},{title:'Start with a business choice',text:'The first screen tells you what the business needs. Choose the items, quantities, coverage or payment arrangement shown on the form. Confirm your choice to get the first documents. You will make later choices when they come up, instead of deciding everything now.'},{title:'Read the document beside your entry',text:'Look for the transaction date, what was delivered or used, the amount, and whether money was paid or is still owed. Enter that date, choose your accounts, and type the debit and credit. Click <strong>Save and check entry</strong>. Green means correct; “needs another look” means saved but needs a correction.'},{title:'Continue when you’ve tried the current record',text:'Use <strong>Next record</strong> to move through this step. Use the continue button below the work area to make the next decision or open month-end records. You can move on with an unfinished entry and return later. <strong>Earlier records</strong> keeps past documents available; <strong>Open T accounts</strong> shows your books. At the end, check any unfinished entries and click <strong>Finish assignment</strong>.'}];const mark=()=>{try{localStorage.setItem(assignmentTourKey(),'done');}catch{}};if(d.open)d.close();d.innerHTML=`<div class="tag">ASSIGNMENT WALKTHROUGH · ${step+1} OF ${pages.length}</div><h2>${pages[step].title}</h2><div class="tour-explanation"><p>${pages[step].text}</p></div><div class="actions">${step?'<button class="secondary" id="tour-back">Back</button>':''}<button id="tour-next">${step===pages.length-1?'Start my assignment':'Next →'}</button><button class="quiet" id="tour-skip">Close walkthrough</button></div><p class="foot">Replay this at any time with “What do I do?” No work is submitted during the walkthrough.</p>`;d.oncancel=mark;d.showModal();Q('#tour-next').onclick=()=>{if(step===pages.length-1){mark();d.close();}else assignmentTour(step+1);};if(Q('#tour-back'))Q('#tour-back').onclick=()=>assignmentTour(step-1);Q('#tour-skip').onclick=()=>{mark();d.close();};}
function practiceKey(){return 'ledger-first-practice-'+(typeof cloudAccount!=='undefined'&&cloudAccount?cloudAccount.id:'local');}
function practiceSeen(){try{return localStorage.getItem(practiceKey())==='done';}catch{return false;}}
function practiceGuide(step=0){const d=Q('#lesson-dialog'),name=safe(data.profile?.name||'your business');if(d.open)d.close();d.innerHTML=step===0?`<div class="tag">GUIDED PRACTICE · NO POINTS</div><h2>Here’s how an assignment works</h2><p>You run ${name}. Your choices create records. Your job is to read those records and enter what happened in the books.</p><ol class="practice-steps"><li><strong>Choose what the business will do.</strong> For example, decide how many supplies to order.</li><li><strong>Read the document.</strong> Check what arrived, when it happened, and whether it was paid.</li><li><strong>Write the journal entry.</strong> Enter the date, accounts, debit and credit. Save to get feedback.</li><li><strong>Continue when you’ve tried this batch.</strong> New records arrive. Your earlier books stay available.</li></ol><button id="practice-next">Try one together →</button>`:step===1?`<div class="tag">PRACTICE RECEIPT · NO POINTS</div><h2>Your business buys supplies</h2><div class="practice-receipt"><strong>${name}</strong><p>September 2, 2026 · Receipt P-001</p><p>Supplies delivered: $100.00<br>Paid in full today from business checking.</p></div><p>The business received supplies it will use later, so Supplies increases. It paid cash today, so Cash decreases.</p><p><strong>Try it:</strong> enter September 2, 2026, debit Supplies for $100 and credit Cash for $100. This practice entry never goes into your assignment or your grade.</p><form id="practice-entry"><label class="field">Transaction date<input type="date" name="date" required></label><div class="form-pair"><label class="field">Debit account<select name="debitAccount"><option value="">Choose</option><option>Supplies</option><option>Cash</option><option>Supplies Expense</option></select></label><label class="field">Debit amount<input name="debit" type="number" min="0" step=".01" required></label><label class="field">Credit account<select name="creditAccount"><option value="">Choose</option><option>Supplies</option><option>Cash</option><option>Supplies Expense</option></select></label><label class="field">Credit amount<input name="credit" type="number" min="0" step=".01" required></label></div><button>Check practice entry</button></form><div id="practice-feedback" role="status" aria-live="polite"></div>`:`<div class="tag">PRACTICE COMPLETE</div><h2>You’re ready to try your own records</h2><p>In the assignment, your documents will show the facts. You choose the accounts and amounts yourself. A green <strong>Correct entry</strong> message means the date, accounts and amounts are right. <strong>Needs another look</strong> means your entry is saved but needs a correction.</p><p>Try the current records, then continue to the next batch. You don’t need to copy ledger balances or complete a quiz.</p><button id="finish-practice">Start my assignment</button>`;d.showModal();if(Q('#practice-next'))Q('#practice-next').onclick=()=>practiceGuide(1);if(Q('#practice-entry'))Q('#practice-entry').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),g=Lessons.assess([{account:v.debitAccount,debit:Number(v.debit),credit:0},{account:v.creditAccount,debit:0,credit:Number(v.credit)}],v.date,{date:'2026-09-02',debit:'Supplies',credit:'Cash',amount:100});Q('#practice-feedback').innerHTML=g.correct?'<div class="message"><strong>Correct.</strong> Supplies increases by $100; cash decreases by $100. Buying supplies is different from using them.</div><button id="practice-understood">Continue →</button>':`<div class="message error">${!g.date?'Use the receipt date: September 2, 2026. ':''}${!g.account?'Choose Supplies as the debit account and Cash as the credit account. ':!g.amount?'Enter $100 on each side. ':''}Try again; this practice is not graded.</div>`;if(Q('#practice-understood'))Q('#practice-understood').onclick=()=>practiceGuide(2);};if(Q('#finish-practice'))Q('#finish-practice').onclick=()=>{try{localStorage.setItem(practiceKey(),'done');}catch{}d.close();if(assignment()?.version===3&&!tourSeen())assignmentTour();};}

function readBusinessChoice(a,form,business,base){const controls=a.interactive.controls.filter(c=>c.kind==='basket'?[...form.keys()].some(k=>k.startsWith(c.id+'__')):form.has(c.id)),subset={...a,interactive:{...a.interactive,controls}};return {...(base||Lessons.decisions.defaultChoice(a,business)),...Lessons.decisions.readChoice(subset,form)};}
function monthlyChoiceForm(r){const m=Lessons.pendingDecision(r);if(m===null)return '';const a=r.assignment,subset={...a,interactive:{...a.interactive,controls:Lessons.decisionControls(r)}};return `<section class="monthly-choice"><div class="tag">YOUR NEXT BUSINESS DECISION</div><h3>What happens next at ${safe(r.business.name)}?</h3><p>Read the earlier records, then make the next choice below. Your choice creates the next document.</p><form id="monthly-choice">${businessControls(subset,r.business,r.choice)}<button data-cloud-submit>Confirm my decision</button><div id="monthly-feedback" role="status"></div></form></section>`;}

function predictionPanel(){const r=run(),p=r.scenario.prediction;return `<section class="card reflection"><div class="tag">3 · A QUICK CONCEPT CHECK</div><h3>${safe(p.prompt)}</h3>${r.prediction===undefined?`<form id="prediction-form">${p.options.map((x,i)=>`<label class="prediction-option"><input type="radio" name="prediction" value="${i}" required>${safe(x)}</label>`).join('')}<button>Check my prediction</button></form>`:`<div class="message">${r.prediction===p.correct?'You predicted it correctly.':'Let’s connect the event to the accounts.'} ${safe(p.feedback)}</div>`}</section>`;}
function completion(r){const s=Lessons.grade(r);if(r.assignment.version===3)return `<div class="message"><strong>Assignment complete.</strong> Journal score: ${s.journal}/100. Your entries have been checked. Corrections and earlier attempts stay in your submission history.</div>`;return `<div class="message"><strong>Assignment completed.</strong> First-attempt score: ${s.journal+s.effects+s.prediction}/100. Journal ${s.journal}/80 · effects ${s.effects}/15 · prediction ${s.prediction}/5.<br>Your business identity continues. The next assignment starts with its own balances.</div>`;}
function wireAssignment(){Q('#back-assignments').onclick=()=>{active=null;record=null;notice='';render();};const a=assignment(),r=run();if(Q('#practice-guide'))Q('#practice-guide').onclick=()=>practiceGuide();if(Q('#assignment-tour'))Q('#assignment-tour').onclick=()=>assignmentTour();if(!r){const form=Q('#business-choice');const preview=()=>{if(a.interactive){try{const choice=readBusinessChoice(a,new FormData(form),data.profile),values=Lessons.decisions.choiceValues(a,choice,data.profile);Q('#choice-preview').innerHTML=a.interactive.controls.filter(c=>Lessons.decisions.controlStage(a,c)===0).map(c=>`<div><strong>${safe(c.label)}</strong><span>${c.kind==='basket'||c.kind==='money'?cash(values[c.id]):safe(values[c.id])}</span></div>`).join('');}catch(error){Q('#choice-preview').textContent=error.message;}return;}const choice=a.interactive?readBusinessChoice(a,new FormData(form),data.profile):Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)]));if(a.publicDefinition){const plan=a.blueprint.paths[choice.plan],opening=a.blueprint.opening.filter(x=>x.account==='Cash').reduce((n,x)=>n+x.debit-x.credit,0);Q('#choice-preview').innerHTML=`<strong>${safe(plan.label)}</strong><p>${safe(plan.description.replaceAll('{{business}}',data.profile.name))}</p><p>Starting cash: ${cash(opening)} · ${plan.events.length} source records.</p>`;return;}const s=Lessons.expected(a,choice,data.profile);Q('#choice-preview').innerHTML=a.version===3?`<strong>Your chosen plan</strong><p>${safe(s.decision)}</p><p>Starting cash: ${cash(s.opening)} · ${s.events.length} documents. Review the facts before preparing the entries.</p>`:a.version===2?`<strong>Your plan, in numbers</strong>${s.decisions.map((x,i)=>`<p>${safe(x)}<br><small>${safe(choiceCostLine(a.concepts[i],s))}</small></p>`).join('')}<p>Verified starting cash: ${cash(s.opening)} · ${s.events.length} source records. Journal entries remain your work.</p>`:`${safe(s.decision)}. Starting cash: ${cash(s.opening)}. The decision creates source documents; you must determine the entries.`;};form.querySelectorAll('select,input').forEach(s=>{s.onchange=preview;s.oninput=preview;});preview();if(a.version===3)queueMicrotask(()=>{if(Q('#business-choice')&&!Q('#lesson-dialog').open){if(!practiceSeen())practiceGuide();else if(!tourSeen())assignmentTour();}});form.onsubmit=e=>{e.preventDefault();const choice=a.interactive?readBusinessChoice(a,new FormData(form),data.profile):Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)]));data.runs[a.id]={assignment:structuredClone(a),business:structuredClone(data.profile),choice,scenario:Lessons.expected(a,choice,data.profile),decidedMonths:[0],entries:{},first:{},advanced:false,completed:false};persist();render();};return;}
if(a.version===3&&!tourSeen())queueMicrotask(()=>{if(!Q('#lesson-dialog').open)assignmentTour();});if(Q('#monthly-choice'))Q('#monthly-choice').onsubmit=e=>{e.preventDefault();const choice=readBusinessChoice(a,new FormData(e.target),r.business,r.choice);if(!Lessons.decisions.validChoice(a,choice,r.business)){Q('#monthly-feedback').textContent='Check the quantities and amounts.';return;}const m=Lessons.pendingDecision(r);r.choice=choice;r.scenario=Lessons.expected(a,choice,r.business);r.decidedStages=[...(r.decidedStages||(r.decidedMonths||[0]).map(m=>m*2)),m];r.decidedMonths=[...new Set([...(r.decidedMonths||[0]),Math.floor(m/2)])];persist();render();};if(Q('#finish-assignment'))Q('#finish-assignment').onclick=()=>{if(!r.advanced||!r.scenario.events.every(e=>entryAssessment(r,e)?.correct))return;r.completed=true;persist();render();};document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{if(a.version===3){record=b.dataset.record;r.entryDateDraft='';render();Q('.guided-task-heading')?.scrollIntoView({behavior:'smooth',block:'start'});}else viewRecord(b.dataset.record);});Q('#view-taccounts').onclick=tAccounts;if(Q('#advance-episode'))Q('#advance-episode').onclick=()=>{if(Lessons.pendingMonth(r)!==null)return;if(a.version>=2){r.stage=Math.min(Lessons.finalStage(a),(r.stage||0)+1);r.advanced=r.stage===Lessons.finalStage(a);}else r.advanced=true;persist();render();};if(Q('#journal-form')){Q('#entry-date').oninput=e=>r.entryDateDraft=e.target.value;document.querySelectorAll('[data-line]').forEach(el=>el.oninput=()=>entryRows[Number(el.dataset.line)][el.dataset.field]=el.value);Q('#add-line').onclick=()=>{if(entryRows.length<8){entryRows.push({account:'',debit:'',credit:''});render();}};if(Q('#no-entry'))Q('#no-entry').onclick=()=>{if(!Q('#entry-date').reportValidity())return;const e=r.scenario.events.find(e=>e.id===record),date=Q('#entry-date').value;r.first[record]??=Lessons.assess([],date,e);r.entries[record]={rows:[],date};persist();render();};if(Q('#hint'))Q('#hint').onclick=()=>{r.hints||=[];if(!r.hints.includes(record))r.hints.push(record);persist();Q('#entry-feedback').innerHTML='<div class="message">'+safe((a.version===2?Lessons.concepts[conceptForRecord(record)]||Lessons.topic(a):Lessons.topic(a)).goal)+' Ask whether the business has received a future benefit, used a resource, earned revenue, or merely received payment for something already recorded.</div>';};Q('#journal-form').onsubmit=e=>{e.preventDefault();const error=Lessons.validateRows(entryRows,r.scenario.accountList||Lessons.accounts);if(error){Q('#entry-feedback').innerHTML='<div class="message error">'+error+'</div>';return;}const event=r.scenario.events.find(e=>e.id===record),date=Q('#entry-date').value,g=Lessons.assess(entryRows,date,event);r.first[record]??=g;r.entries[record]={rows:structuredClone(entryRows),date};r.entryDateDraft='';r.completed=false;persist();render();};}
if(Q('#prediction-form'))Q('#prediction-form').onsubmit=e=>{e.preventDefault();const n=Number(new FormData(e.target).get('prediction'));r.prediction=n;r.predictionFirst??=n;persist();render();};if(Q('#effect-form')){Q('#effect-form').querySelectorAll('input').forEach(el=>el.oninput=()=>{r.effectDraft||={};r.effectDraft[el.name]=el.value;persist();});Q('#effect-form').onsubmit=e=>{e.preventDefault();const input=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,Number(v)]));r.effectsFirst??=input;r.effectsLatest=input;const incorrect=r.scenario.effects.filter(x=>Math.abs(input[x.key]-x.value)>.005);if(!incorrect.length){r.completed=true;persist();Q('#effect-feedback').innerHTML=completion(r);}else{persist();Q('#effect-feedback').innerHTML='<div class="message error">Recheck '+incorrect.map(x=>x.label).join(', ')+'. Your first attempt is retained. Use the T accounts to revise your work.</div>';}};}}
function viewRecord(id){const e=run().scenario.events.find(e=>e.id===id),d=Q('#lesson-dialog');d.innerHTML=documentHtml(e,assignment(),run().business)+'<div class="actions"><button id="work-entry">Work on this entry</button><button class="secondary" id="close-record">Keep running the business</button></div>';d.showModal();Q('#close-record').onclick=()=>d.close();Q('#work-entry').onclick=()=>{d.close();record=id;run().entryDateDraft='';render();Q('.bookkeeper').scrollIntoView({behavior:'smooth',block:'start'});};}
function documentHtml(e,a,business){if(e.kind==='generated')return generatedDocument(e,a,business);if(e.kind==='episode')return episodeDocument(e,a,business);const d=e.detail,kind=e.kind,name=safe(business.name);let title='',issuer='',status='',body='',total=cash(e.amount),label='Total';if(kind==='lease'){title='Commercial rental receipt';issuer='Oak Street Property Management';status='PAID';body=`Tenant: ${name}<br>Location: ${['Quiet side street','Neighborhood main street','Town center'][d.location]}<br>Coverage begins: ${Lessons.day(a,1)}<br>Months paid in advance: ${d.months}<br>Monthly rental rate: ${cash(d.rate)}<br>Payment method: business checking`;label='Payment received';}if(kind==='coverage'){title='Rental coverage schedule';issuer='Oak Street Property Management';status='NO PAYMENT DUE';body=`Tenant: ${name}<br>Period ended: ${e.date}<br>Time occupied this period: 1 month<br>Original prepaid coverage: ${d.months} months<br>Monthly rental rate: ${cash(d.rate)}<br>Current cash charge: $0.00`;label='Coverage used at contract rate';}if(kind==='invoice'){title='Customer invoice';issuer=business.name;status='UNPAID';body=`Bill to: Neighborhood catering customer<br>Services delivered: ${e.date}<br>Order status: completed<br>Invoice total: ${cash(d.sale)}<br>Payment terms: agreed partial settlement later this month<br>Payment received on invoice date: $0.00`;label='Amount due';if(business.type==='Design studio')body=body.replace('catering customer','design client');if(business.type==='Bike repair')body=body.replace('catering customer','repair customer');}if(kind==='remittance'){title='Customer payment confirmation';issuer='Neighborhood Bank';status='RECEIVED';body=`Account holder: ${name}<br>Payment against invoice dated: ${Lessons.day(a,8)}<br>Original invoice: ${cash(d.sale)}<br>Transfer received: ${cash(d.paid)}<br>New services included with this transfer: none`;label='Cash deposited';}if(kind==='equipment'){title='Equipment supplier invoice';issuer='Northside Business Equipment';status='PAID';body=`Customer: ${name}<br>Item: ${safe((equipmentNames[business.type]||equipmentNames['Coffee shop'])[[600,1200,1800].indexOf(d.cost)])}<br>Delivered and placed in service: ${e.date}<br>Payment method: business checking`;label='Invoice total';}if(kind==='asset'){title='Fixed asset register';issuer=business.name+' · Business records';status='MONTH-END';body=`Placed in service: ${Lessons.day(a,1)}<br>Cost: ${cash(d.cost)}<br>Estimated useful life: ${d.life} years<br>Residual value: $0.00<br>Depreciation method: straight-line<br>Convention: full month from placement in service<br>Months used this period: 1`;label='Asset cost';total=cash(d.cost);}if(kind==='deposit'){title='Owner capital deposit slip';issuer='Neighborhood Bank';status='RECEIVED';body=`Account holder: ${name}<br>Depositor: business owner<br>Transfer description: initial business investment<br>Customer services involved: none`;label='Cash deposited';}if(kind==='advertising'){title='Advertising service invoice';issuer='Local Reach Media';status='PAID';body=`Client: ${name}<br>Campaign: ${['Local listing','Neighborhood promotion','Opening campaign'][[60,120,200].indexOf(d.ad)]}<br>Service delivered during: ${month(a)}<br>Payment method: business checking`;label='Invoice total';}return `<article class="source-document"><div class="paper-top"><span>${safe(issuer)}</span><span class="paper-status">${status}</span></div><h2>${title}</h2><div class="paper-meta"><span>Document ${safe(e.id).toUpperCase()}</span><span>${e.date}</span></div><div class="paper-item">${safe(e.title)}</div><p>${body}</p><div class="paper-total"><span>${label}</span><strong>${total}</strong></div><div class="paper-footer">Business copy · Retain with assignment records</div></article>`;}
function tAccounts(){const r=run(),b=Lessons.balances(r.scenario,r.entries),d=Q('#lesson-dialog');const used=(r.scenario.accountList||Lessons.accounts).filter(a=>b[a]||Object.values(r.entries).some(e=>e.rows.some(x=>x.account===a)));d.innerHTML='<h2>Assignment T accounts</h2><p>Verified opening balances are included. These books show your latest entries, including errors until corrected.</p><div class="t-grid">'+used.map(a=>{const opening=r.scenario.openingBalances?r.scenario.openingBalances.filter(x=>x.account===a).reduce((n,x)=>n+x.debit-x.credit,0):a==='Cash'?r.scenario.opening:a==='Owner Capital'?-r.scenario.opening:0;return `<section class="t-account"><h3>${a}</h3><div class="t-head"><span>Debit</span><span>Credit</span></div><div class="t-body">${['debit','credit'].map(side=>`<div>${opening&&((opening>0)===(side==='debit'))?`<div><small>Verified opening balance</small>${cash(Math.abs(opening))}</div>`:''}${Object.values(r.entries).flatMap(e=>e.rows.filter(x=>x.account===a&&Number(x[side])).map(x=>`<div><small>${e.date}</small>${cash(Number(x[side]))}</div>`)).join('')}</div>`).join('')}</div><p>Balance: ${cash(Math.abs(b[a]))} ${b[a]>=0?'Dr':'Cr'}</p></section>`;}).join('')+'</div><button id="close-ledger" class="secondary">Back to assignment</button>';d.showModal();Q('#close-ledger').onclick=()=>d.close();}
function defaultDraft(){return {version:1,id:crypto.randomUUID(),topic:'prepaid',title:'',course:'Introduction to Financial Accounting',instructions:'',year:2026,month:9,timelineMode:'auto',support:'guided',notes:'',published:false,origin:'Professor assignment'};}
function renderProfessor(){teacherDraft||=data.teacherDraft||defaultDraft();const a=teacherDraft;shell(`<div class="intro studio-heading"><div><div class="tag">INSTRUCTOR WORKSPACE</div><h1>Assignment studio</h1><p>Upload your notes, check the draft, then share it with your class.</p></div><button id="new-draft" class="secondary">New assignment</button></div><nav class="tabs"><button data-teacher="builder" class="${teacherTab==='builder'?'selected':''}">Create assignment</button><button data-teacher="library" class="${teacherTab==='library'?'selected':''}">Published assignments</button></nav>${teacherTab==='library'?teacherLibrary():`<ol class="studio-roadmap" aria-label="Assignment creation steps"><li class="${a.version>=2?'done':'current'}"><span>1</span><div><strong>Add course notes</strong><small>Choose what students practice</small></div></li><li class="${a.version>=2?'current':''}"><span>2</span><div><strong>Review the draft</strong><small>Try decisions and check the accounting</small></div></li><li><span>3</span><div><strong>Publish to class</strong><small>Students use their own businesses</small></div></li></ol><div class="professor-layout studio-layout"><section class="card studio-source"><div class="studio-section-title"><span>01</span><div><h2>What are you teaching?</h2><p>Start with the notes your students are learning from.</p></div></div><label class="upload-zone" for="notes-file"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M14 3H6v18h12V7l-4-4Zm0 0v5h4M9 12h6m-6 4h6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><strong>${a.sourceFile?safe(a.sourceFile):'Choose a notes file'}</strong><span>PDF, Word, or text · up to 10 MB</span><input id="notes-file" type="file" accept=".txt,.md,.pdf,.docx,text/plain,text/markdown,application/pdf"></label><label class="field notes-field">${a.notes?.trim()?'Review the text from your notes':'Or paste your notes'}<textarea id="teacher-notes" maxlength="30000" placeholder="Paste the material you want students to apply. You can upload a PDF instead.">${safe(a.notes)}</textarea></label><div id="notes-analysis">${notesAnalysisHtml(a)}</div><label class="field">Assignment length<select id="episode-depth">${[['focused','Short · up to 6 records'],['standard','Regular · up to 10 records'],['extended','Longer · up to 14 records']].map(([value,label])=>`<option value="${value}" ${(a.depth||'standard')===value?'selected':''}>${label}</option>`).join('')}</select></label><div class="generation-actions"><button id="suggest-topic">Create assignment from notes</button><div id="generation-status" role="status" aria-live="polite"></div></div><p class="foot">PDFs need readable text. Use a chapter or a focused set of slides. Nothing is shared with students until you review and publish.</p></section><section class="card studio-settings"><div class="studio-section-title"><span>02</span><div><h2>Assignment details</h2><p>Choose the help students get and how they finish.</p></div></div><form id="teacher-form"><details class="studio-options"><summary>Assignment settings <span>Period, help and final report</span></summary><label class="field">Assignment dates<select name="timelineMode"><option value="auto" ${(a.timelineMode||'auto')==='auto'?'selected':''}>Choose dates to fit the lesson</option><option value="manual" ${a.timelineMode==='manual'?'selected':''}>Use a month I choose</option></select></label><p class="foot">Most lessons use one month. Topics that need follow-up entries can cover up to four months.</p><div class="form-pair manual-period"><label class="field">Year<input name="year" type="number" min="2020" max="2100" required value="${a.year}"></label><label class="field">Month<select name="month">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${a.month===i+1?'selected':''}>${new Date(2026,i,1).toLocaleDateString('en-US',{month:'long'})}</option>`).join('')}</select></label></div><label class="field">What should students finish with?<select name="report"><option value="topic" ${(a.report||'topic')==='topic'?'selected':''}>Account balances for this lesson</option><option value="statements" ${a.report==='statements'?'selected':''}>Income statement and balance sheet</option></select></label><label class="field">Can students use hints?<select name="support"><option value="guided" ${a.support==='guided'?'selected':''}>Hints available</option><option value="independent" ${a.support==='independent'?'selected':''}>No hints</option></select></label><label class="field">Course<input name="course" maxlength="120" required value="${safe(a.course)}"></label></details><div class="draft-preview ${a.version>=2?'has-draft':''}"><div class="tag">${a.version>=2?'YOUR PRIVATE DRAFT':'03 · REVIEW BEFORE SHARING'}</div>${a.version>=2?`<label class="field">Assignment title<input name="title" maxlength="160" required value="${safe(a.title)}"></label><label class="field">Student instructions<textarea name="instructions" maxlength="10000" required>${safe(a.instructions)}</textarea></label><p class="timeline-note">${a.timelineReason?safe(month(a))+' · '+safe(a.timelineReason):''}</p><p>${a.version===3?a.objectives.map(safe).join('<br>'):a.concepts.map(id=>safe(Lessons.concepts[id].name)).join(' · ')}</p><div class="draft-next"><div><strong>Your next step: check the draft</strong><p>Try a student’s order, read the documents, and check the answers. You’ll publish from the review screen.</p></div><button>Preview assignment →</button></div><button type="button" class="quiet" id="edit-draft-notes">Edit notes or create another draft</button>`:'<h3>Your assignment will appear here.</h3><p>We’ll create business decisions, source records, and an answer key for your lesson. You check the draft before students see it.</p>'}</div></form></section></div>`}`);Q('#new-draft').onclick=()=>{notice='';teacherDraft=defaultDraft();data.teacherDraft=teacherDraft;teacherTab='builder';persist();render();};document.querySelectorAll('[data-teacher]').forEach(b=>b.onclick=()=>{teacherTab=b.dataset.teacher;render();});if(teacherTab==='library'){wireLibraryManagement();document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>download('ledger-lane-assignment.json',data.assignments.find(a=>a.id===b.dataset.download)));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{teacherDraft=structuredClone(data.assignments.find(a=>a.id===b.dataset.review));reviewDraft();});return;}
Q('#notes-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;const notesInput=Q('#teacher-notes');notesInput.disabled=true;Q('#suggest-topic').disabled=true;try{notice='Reading '+file.name+'…';Q('#notes-analysis').textContent=notice;const text=await readCourseNotes(file);if(text.trim().length<20)throw Error('No readable course text was found. Try a text-based PDF or paste the notes.');if(text.length>30000)throw Error('These notes are long. Upload a chapter or paste the relevant section (up to 30,000 characters).');teacherDraft.notes=text;teacherDraft.sourceFile=file.name;teacherDraft.needsRegeneration=teacherDraft.version>=2;data.teacherDraft=teacherDraft;notice='Loaded '+file.name+'. Check the text below, then create your assignment.';persist();render();}catch(error){notice='';render();const status=Q('#generation-status');status.className='generation-error';status.textContent=error.message;}};

Q('#episode-depth').onchange=e=>{teacherDraft.depth=e.target.value;data.teacherDraft=teacherDraft;persist();};Q('#teacher-form').querySelectorAll('input,select,textarea').forEach(el=>el.oninput=()=>{teacherDraft[el.name]=['year','month'].includes(el.name)?Number(el.value):el.value;if(['year','month','timelineMode','report'].includes(el.name)&&teacherDraft.version>=2)teacherDraft.needsRegeneration=true;data.teacherDraft=teacherDraft;persist();});Q('#teacher-form').onsubmit=e=>{e.preventDefault();if((teacherDraft.version<2&&!teacherDraft.published)||teacherDraft.needsRegeneration){notice='Create a new draft to apply these changes first.';render();return;}if(!Lessons.checkAssignment(teacherDraft)){notice='Check the assignment settings before reviewing.';render();return;}reviewDraft();};applyStudioFlow(a);}
function applyStudioFlow(a){const layout=Q('.studio-layout');if(!layout)return;const dates=Q('[name=timelineMode]'),manual=Q('.manual-period');manual.hidden=dates.value==='auto';dates.addEventListener('change',()=>{manual.hidden=dates.value==='auto';teacherDraft.needsRegeneration=teacherDraft.version>=2;});Q('.studio-options summary span').textContent=((a.timelineMode||'auto')==='auto'&&a.version<2?'Dates chosen to fit your notes':month(a))+' · '+(a.support==='independent'?'No hints':'Hints available')+' · '+(a.report==='statements'?'Statement totals':'Lesson balances');if(a.version>=2&&!a.needsRegeneration){Q('.studio-settings .studio-section-title h2').textContent='Your draft is ready';Q('.studio-settings .studio-section-title p').textContent='Check what students will see before sharing it.';}layout.classList.toggle('reviewing',a.version>=2&&!a.needsRegeneration);const edit=Q('#edit-draft-notes');if(edit)edit.onclick=()=>{layout.classList.remove('reviewing');Q('#teacher-notes').focus();Q('.studio-source').scrollIntoView({behavior:'smooth',block:'start'});};}
function teacherLibrary(){const connected=typeof cloudAccount!=='undefined'&&cloudAccount,assignments=data.assignments.filter(a=>!connected||a.classId===cloudClass),live=assignments.filter(a=>!a.deleted),deleted=assignments.filter(a=>a.deleted);return `<section class="card assignment-library"><h2>Published assignments</h2><p>${connected?'Students in this class can open these assignments.':'Assignments saved in this browser.'}</p>${live.map(a=>`<div class="library-row"><div><strong>${safe(businessText(a.title))}</strong><p>${safe(Lessons.topic(a).name)} · ${month(a)} · ${safe(a.origin)}</p></div><div class="actions"><button class="secondary" data-review="${safe(a.id)}">Review</button><button class="secondary" data-download="${safe(a.id)}">Download instructor copy</button><button class="quiet delete-link" data-delete="${safe(a.id)}">Delete</button></div></div>`).join('')||'<div class="library-empty"><h3>No published assignments yet</h3><p>Create an assignment, review its records, and publish it to this class.</p></div>'}${deleted.length?`<details class="deleted-library"><summary>Deleted assignments (${deleted.length})</summary><p>Student work is kept. Restore an assignment to make it available again.</p>${deleted.map(a=>`<div class="library-row"><div><strong>${safe(a.title)}</strong><p>${month(a)}</p></div><button class="secondary" data-restore="${safe(a.id)}">Restore</button></div>`).join('')}</details>`:''}</section>`;}

function deleteAssignmentDialog(id){const a=data.assignments.find(x=>x.id===id),d=Q('#lesson-dialog');d.innerHTML=`<div class="tag">ASSIGNMENT MANAGEMENT</div><h2>Delete this assignment?</h2><p><strong>${safe(a.title)}</strong> will be removed from students’ assignments.</p><p>Student entries and grades are kept. You can restore it from Deleted assignments.</p><div class="actions"><button id="confirm-delete" class="delete-button" data-cloud-submit>Delete assignment</button><button id="cancel-delete" class="secondary">Keep assignment</button></div><div id="delete-status" role="status"></div>`;d.showModal();Q('#cancel-delete').onclick=()=>d.close();Q('#confirm-delete').onclick=()=>changeAssignmentAvailability(id,true);}

function defaultChoice(topic){return topic==='prepaid'?{location:1,months:3}:topic==='receivables'?{order:1,collection:1}:topic==='equipment'?{level:1,life:1}:{investment:1,ad:1};}
function professorSummary(a){const topics=a.teachingTopics||[],covered=new Set((a.topicCoverage||[]).map(x=>x.topicIndex)),controls=a.interactive?.controls||[],events=a.interactive?.events||a.blueprint?.paths?.[0]?.events||[],months=a.periodMonths||1,adjustments=events.filter(e=>e.stage===Lessons.finalStage(a)||/count|adjust|coverage|depreciation|accru|closing/i.test(e.title));return `<section class="professor-summary"><div class="tag">AT A GLANCE · STUDENT WORK</div><h3>What students will do</h3><p>Students run their own business over <strong>${months} ${months===1?'month':'months'}</strong> (${safe(month(a))}). They make the choices below, receive records from those choices, and write dated journal entries. Later records show what changes as time passes.</p><ul>${controls.map(c=>`<li>${safe(businessText(c.label,{name:'their business',type:'business',specialty:'its products and services'}))} — ${safe(businessText(c.purpose,{name:'their business',type:'business',specialty:'its products and services'}))}</li>`).join('')}</ul><p><strong>Accounting work:</strong> ${events.length} source records${adjustments.length?`, including ${adjustments.length} period-end or adjustment records`:''}. ${a.objectives.map(safe).join(' ')}</p><p><strong>How it unfolds:</strong> business choice → invoice or receipt → dated entry → next decision or month-end evidence → update the books. Grades come from accounting entries.</p>${topics.length?`<h4>Topics from the notes</h4><ul class="topic-coverage">${topics.map((t,i)=>`<li><strong>${safe(t.name)}</strong><span>${a.topicCoverage?.length?(covered.has(i)?'Included in source records':'Not covered in this draft'):'Check the records below for coverage'}</span></li>`).join('')}</ul>${a.topicCoverage?.length?`<p>${covered.size} of ${topics.length} topics included. Use the draft chat below if a missing topic matters for this lesson.</p>`:''}`:''}</section>`;}
function reviewDraft(){const a=teacherDraft,reviewBusiness={name:'Example business',type:reviewBusinessType},s=Lessons.expected(a,a.interactive?(Lessons.decisions.validChoice(a,reviewDecision,reviewBusiness)?reviewDecision:Lessons.decisions.defaultChoice(a,reviewBusiness)):a.version===3?{plan:reviewPlan}:a.version===2?Lessons.defaultEpisodeChoice(a):defaultChoice(a.topic),reviewBusiness),d=Q('#lesson-dialog'),example={...reviewBusiness,color:'sage'};d.innerHTML=`<div class="tag">PROFESSOR REVIEW · DRAFT</div><h2>${safe(businessText(a.title))}</h2><p>${safe(businessText(a.instructions))}</p>${a.version===3?professorSummary(a):''}${a.interactive?`<section class="review-decisions"><h3>Try the student’s decisions</h3><label class="field">Preview business<select id="review-business-type">${Object.keys(Lessons.businesses).map(type=>`<option ${type===reviewBusinessType?'selected':''}>${safe(type)}</option>`).join('')}</select></label><form id="review-decisions">${businessControls(a,reviewBusiness,Lessons.decisions.validChoice(a,reviewDecision,reviewBusiness)?reviewDecision:Lessons.decisions.defaultChoice(a,reviewBusiness))}<button class="secondary">Update preview</button></form></section>`:a.version===3?`<label class="field">Review this business option<select id="review-plan">${a.blueprint.paths.map((path,i)=>`<option value="${i}" ${i===reviewPlan?'selected':''}>${safe(path.label)}</option>`).join('')}</select></label>`:''}<div class="message"><strong>Student choice:</strong> ${safe(s.decision)}<br>The documents and answers below reflect these decisions. Change the preview to check a different order or budget.</div>${a.version>=2?`<details class="review-alignment"><summary>Topics covered and source notes</summary>${notesAnalysisHtml(a,true)}<p>${s.events.length} records · ${a.interactive?a.interactive.controls.length+' business decisions':a.version===3?'3 alternative business choices':a.concepts.length+' decision areas'} · ${s.stages.length} parts · dated journal entries.</p><p>Student records use their own business name and relevant items. Amounts come from their decisions.</p></details>`:''}<h3>What students will receive</h3><p class="foot">Open each record to check the facts. Then review the expected accounting below.</p><div class="review-docs">${s.events.map((e,i)=>`<details class="review-record" ${i===0?'open':''}><summary><span>${safe(e.date)}</span><strong>${safe(e.title)}</strong><small>View record</small></summary>${documentHtml(e,a,example)}</details>`).join('')}</div><details class="teacher-key"><summary>Answer key and grades</summary><table><thead><tr><th>Date</th><th>Debit</th><th>Credit</th><th>Amount</th></tr></thead><tbody>${s.events.map(e=>`<tr><td>${e.date}</td><td>${e.lines?e.lines.filter(x=>x.debit).map(x=>safe(x.account)+' '+cash(x.debit)).join('<br>'):e.debit}</td><td>${e.lines?e.lines.filter(x=>x.credit).map(x=>safe(x.account)+' '+cash(x.credit)).join('<br>'):e.credit}</td><td>${cash(e.amount)}</td></tr>`).join('')}</tbody></table>${a.version===3?'':`<p>${safe(s.prediction.prompt)}<br>Expected: ${safe(s.prediction.options[s.prediction.correct])}</p>`}<p>${s.effects.map(e=>e.label+': '+cash(e.value)).join('<br>')}</p><p>${a.version===3?'Journal entries: 100%. Corrections improve scores. Earlier submissions stay available for review. No quiz or balance-copying points.':'Journal entries 80% · final balances 15% · concept check 5%.'}</p></details><div class="message">This assignment starts fresh. ${a.version===3?'Opening balances: '+a.blueprint.opening.map(x=>safe(x.account)+' '+cash(x.debit||x.credit)+' '+(x.debit?'Dr':'Cr')).join(' · '):s.opening?cash(s.opening)+' verified opening Cash and Owner Capital.':'Starts with no balances.'} No earlier assignment is required.</div><div class="actions review-publish-bar"><button id="publish-assignment">${a.published?'Save as a new assignment':'Approve & publish assignment'}</button><button class="secondary" id="close-review">Return to draft</button></div><p class="foot">P function episodeDocument(e,a,business){const lines=e.detail.lines;const moneyKeys=/rate$|premium$|cost|amount|received|principal|payment|due$|wage$|purchased$|at cost$|transfer|advance$|supplies$/i;return `<article class="source-document"><div class="paper-top"><span>${safe(lines.find(([k])=>['Supplier','Provider','Lender','Depositor','Sender'].includes(k))?.[1]||business.name+' · Business records')}</span><span class="paper-status">${e.stage===2?'MONTH-END':'BUSINESS COPY'}</span></div><h2>${safe(businessText(e.title,business))}</h2><div class="paper-meta"><span>Ref ${safe(a.id.slice(0,6)).toUpperCase()}-${safe(e.id).toUpperCase()}</span><span>${safe(e.date)}</span></div><div class="paper-item">${safe(business.name)} · ${safe(business.specialty||business.type)}</div><dl class="document-facts">${lines.map(([key,value])=>`<div><dt>${safe(key)}</dt><dd>${safe(typeof value==='number'&&moneyKeys.test(key)?cash(value):value)}</dd></div>`).join('')}</dl>${e.stage!==2?`<div class="paper-total"><span>Transaction amount</span><strong>${cash(e.amount)}</strong></div>`:''}<div class="paper-footer">Retain with the ${safe(month(a))} business records · All dates refer to this scenario</div></article>`;}
function notesAnalysisHtml(a,review=false){if(a.version===3)return `<div class="scope-analysis"><h3>Learning objectives</h3><ul>${a.objectives.map(x=>`<li>${safe(x)}</li>`).join('')}</ul><h3>Referenced course material</h3>${a.source.map(x=>`<blockquote>${safe(x.evidence)}</blockquote>`).join('')}<p class="foot">Topics taken from your notes. Entries and reporting totals checked across business decisions. Check the source facts, topics, and answers. Try different student decisions before publishing.</p></div>`;if(typeof cloudAccount!=='undefined'&&cloudAccount&&!review)return `<p class="foot">${a.notes?.trim()?a.notes.trim().split(/\s+/).length+' words loaded. Generate a new draft after changing the source.':'Upload notes or paste the material you want students to apply.'}</p>`;const analysis=Lessons.analyzeNotes(a.notes||'');return `<div class="scope-analysis"><h3>${analysis.matches.length?'Concepts found in your notes':'What are you teaching?'}</h3>${analysis.matches.length?analysis.matches.map(x=>`<div class="scope-concept">${review?`<strong>${safe(x.name)}</strong>`:`<label><input type="checkbox" name="note-concept" value="${x.id}" ${a.needsRegeneration||!a.concepts||a.concepts.includes(x.id)?'checked':''}> ${safe(x.name)}</label>`}<blockquote>${safe(x.evidence)}</blockquote></div>`).join(''):'<p>Upload or paste the relevant notes. You can combine rent, insurance, supplies, receivables, equipment, owner funding, customer deposits, wages, operating accruals, supplier purchases, loans, withdrawals, and cash revenue.</p>'}${analysis.unsupported.length?`<div class="message error"><strong>Outside the current generator’s scope</strong><p>${analysis.unsupported.map(safe).join('; ')}. These topics will not be assigned or graded. Narrow the source material or leave them for a separate lesson.</p></div>`:''}<p class="foot">Select only concepts already taught. Up to six per episode. Generated depreciation uses straight-line, zero residual value, and a full month; generated l async function readCourseNotes(file){if(file.size>10*1024*1024)throw Error('Choose a notes file smaller than 10 MB.');if(/\.(txt|md)$/i.test(file.name))return file.text();if(/\.pdf$/i.test(file.name)){const pdfjs=await import('./assets/pdf.mjs');pdfjs.GlobalWorkerOptions.workerSrc=new URL('./assets/pdf.worker.mjs',location.href).href;const loadingTask=pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false});const pdf=await loadingTask.promise;try{if(pdf.numPages>80)throw Error('Upload the relevant chapter or slides, up to 80 pages.');let text='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),content=await page.getTextContent();text+=content.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join('')+'\n';if(text.length>30000)break;}return text;}finally{await loadingTask.destroy();}}if(/\.docx$/i.test(file.name)){if(!window.mammoth)await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='./assets/mammoth.browser.min.js';script.onload=resolve;script.onerror=()=>reject(Error('The document reader could not load. Refresh or paste your notes.'));document.head.appendChild(script);});const result=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return result.value;}throw Error('Use PDF, DOCX, TXT, or Markdown. You can also paste text from slides.');}

function variedDocument(e,d,layout,business){const fields=d.fields.filter(f=>f.value!==business.name),header=`<header><strong>${safe(d.issuer)}</strong><span>${safe(d.status)}</span></header>`,ref=`<p class="document-reference">${safe(e.date)} · ${safe(e.id).toUpperCase()}</p>`,facts=fields.map(f=>`<div><span>${safe(f.label)}</span><strong>${safe(f.value)}</strong></div>`).join('');if(layout==='payment'||layout==='bank'){const amount=fields.find(f=>/amount paid|transfer amount|cash paid|payment amount|amount received|deposited|withdrawal|cash received/i.test(f.label));return `<article class="bank-voucher">${header}<div class="bank-voucher-body"><span class="bank-confirmed">✓ ${layout==='bank'?'Bank activity record':'Transfer confirmed'}</span><h2>${safe(e.title)}</h2><p>Business account · ${safe(business.name)}</p>${amount?`<div class="bank-transfer-amount">${safe(amount.value)}</div>`:''}${ref}<div class="bank-transfer-details">${facts}</div><footer>Keep this confirmation with the original invoice.</footer></div></article>`;}if(layout==='receipt')return `<article class="till-receipt">${header}<h2>Receipt</h2><p>${safe(e.title)}<br>${safe(business.name)}</p>${ref}<div class="receipt-lines">${facts}</div><footer>Transaction copy<br>Thank you for your business</footer></article>`;if(layout==='count'||layout==='schedule')return `<article class="internal-sheet">${header}<div class="sheet-caption">${layout==='count'?'MONTH-END PHYSICAL COUNT':'COVERAGE & BUSINESS SCHEDULE'}</div><h2>${safe(e.title)}</h2><p>Prepared for ${safe(business.name)}</p>${ref}<table><thead><tr><th>${layout==='count'?'Count information':'Schedule detail'}</th><th>Recorded fact</th></tr></thead><tbody>${fields.map(f=>`<tr><td>${safe(f.label)}</td><td>${safe(f.value)}</td></tr>`).join('')}</tbody></table><footer>${layout==='count'?'A count is evidence of what remains, not a new purchase.':'Use the coverage dates to identify what belongs in this period.'}</footer></article>`;return `<article class="s   const sections=[['Assignment title',a=>a.title],['Student instructions',a=>a.instructions],['Learning goals',a=>a.objectives],['Dates and timeline',a=>[a.year,a.month,a.periodMonths]],['Business decisions',a=>a.interactive?.controls],['Source documents and entries',a=>a.interactive?.events||a.blueprint?.paths],['Chart of accounts',a=>a.blueprint?.accounts],['Topic coverage',a=>a.topicCoverage]];
  return sections.filter(([,read])=>stable(read(previous))!==stable(read(next))).map(([label])=>label);
 }

function wireDraftChat(root=document){

   if(!Lessons.checkAssignment(revised))throw Error('The response did not contain a checked assignment.');

  }catch(error){const text=error.message+' Your previous assignment is still available; the preview has not changed.';teacherDraft.revisionChat=[...sent,{role:'assistant',text,error:true}].slice(-12);saveTeacherWorkspace();thread.innerHTML=chatMessages(teacherDraft.revisionChat);thread.scrollTop=thread.scrollHeight;status.className='draft-chat-status revision-error';status.innerHTML='<strong>The preview was not updated.</strong><p>'+safe(error.message)+'</p><button type="button" class="secondary" data-cloud-submit>Retry this change</button>';status.querySelector('button').onclick=()=>{textarea.value=message;f.dataset.retry='true';f.requestSubmit();};status.scrollIntoView({behavior:'smooth',block:'center'});}
