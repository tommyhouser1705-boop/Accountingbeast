</style></head><body><div id="classroom"></div><script>(function(root){
const topics={prepaid:{name:'Prepaid expenses',goal:'Distinguish paying for future benefits from using those benefits.',effect:'Show rent used this month and rent remaining for future months.'},receivables:{name:'Credit sales & collections',goal:'Separate earning revenue from collecting a customer payment.',effect:'Show revenue earned, cash received, and the customer balance still owed.'},equipment:{name:'Equipment & depreciation',goal:'Separate buying a long-lived asset from allocating its cost over time.',effect:'Show equipment cost, depreciation expense, and net equipment value.'},capital:{name:'Owner investment & cash expenses',goal:'Distinguish owner contributions from revenue and business expenses.',effect:'Show contributed capital, cash remaining, and expenses incurred.'}};
const accounts=['Cash','Accounts Receivable','Prepaid Rent','Equipment','Accumulated Depreciation','Owner Capital','Sales Revenue','Rent Expense','Depreciation Expense','Advertising Expense'];
const cents=n=>Math.round(n*100)/100;
function checkAssignment(a){if(!a||a.version!==1||!Object.hasOwn(topics,a.topic)||typeof a.id!=='string'||!a.id.trim()||a.id.length>100||typeof a.title!=='string'||!a.title.trim()||a.title.length>160||typeof a.instructions!=='string'||a.instructions.length>10000||!Number.isInteger(a.year)||a.year<2020||a.year>2100||!Number.isInteger(a.month)||a.month<1||a.month>12||!['guided','independent'].includes(a.support))return false;return typeof a.course==='string'&&a.course.length<=120&&typeof a.notes==='string'&&a.notes.length<=30000;}
function suggestTopic(notes){const t=notes.toLowerCase();return /prepaid|prepayment|rent in advance|unexpired/.test(t)?'prepaid':/depreciation|useful life|salvage|long.lived/.test(t)?'equipment':/receivable|credit sale|on account|customer payment/.test(t)?'receivables':'capital';}
function day(a,d){return `${a.year}-${String(a.month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function end(a){return new Date(Date.UTC(a.year,a.month,0)).getUTCDate();}
function expected(a,choice){const opening=a.topic==='capital'?0:8000;let events=[],decision='',prediction={},effects=[];const event=(id,title,kind,date,amount,debit,credit,detail)=>events.push({id,title,kind,date,amount:cents(amount),debit,credit,detail});
if(a.topic==='prepaid'){const rate=[150,250,400][choice.location],months=choice.months;if(!rate||![1,3,6].includes(months))throw Error('Invalid rental choice');decision=`${['Quiet side street','Neighborhood main street','Town center'][choice.location]}, ${months} month${months===1?'':'s'} paid in advance`;event('payment','Commercial lease payment','lease',day(a,1),rate*months,'Prepaid Rent','Cash',{rate,months,location:choice.location});event('adjustment','Month-end rental coverage','coverage',day(a,end(a)),rate,'Rent Expense','Prepaid Rent',{rate,months});prediction={prompt:'At month-end, how much of the payment has the business used?',options:['One month of coverage','All of the prepaid coverage','None of the coverage'],correct:0,feedback:'One month of time has passed. The unused coverage remains an asset, regardless of how many months were paid for.'};effects=[{key:'expense',label:'Rent expense for the month',value:rate},{key:'remaining',label:'Prepaid rent remaining',value:rate*(months-1)},{key:'cash',label:'Ending cash',value:opening-rate*months}];}
if(a.topic==='receivables'){const sale=[400,700,1000][choice.order],paid=cents(sale*[.25,.5,1][choice.collection]);if(!sale||![0,1,2].includes(choice.collection))throw Error('Invalid customer choice');decision=`${['Small','Medium','Large'][choice.order]} customer order; ${[25,50,100][choice.collection]}% collected this month`;event('sale','Customer order completed','invoice',day(a,8),sale,'Accounts Receivable','Sales Revenue',{sale});event('collection','Customer payment received','remittance',day(a,22),paid,'Cash','Accounts Receivable',{sale,paid});prediction={prompt:'What happens to revenue when this customer pays an existing invoice?',options:['Revenue increases again','Revenue stays the same','Revenue decreases'],correct:1,feedback:'Revenue was earned when services were delivered. The later payment changes Cash and Accounts Receivable, without earning the revenue again.'};effects=[{key:'revenue',label:'Revenue earned this month',value:sale},{key:'remaining',label:'Customer balance remaining',value:sale-paid},{key:'cash',label:'Ending cash',value:opening+paid}];}
if(a.topic==='equipment'){const cost=[600,1200,1800][choice.level],life=[3,5,6][choice.life];if(!cost||!life)throw Error('Invalid equipment choice');const dep=cents(cost/life/12);decision=`${['Starter','Expanded','Professional'][choice.level]} equipment; ${life}-year useful-life estimate`;event('purchase','Equipment delivered and paid','equipment',day(a,1),cost,'Equipment','Cash',{cost,life});event('depreciation','Month-end asset register','asset',day(a,end(a)),dep,'Depreciation Expense','Accumulated Depreciation',{cost,life});prediction={prompt:'Does the month-end depreciation adjustment require a new cash payment?',options:['Yes, the full purchase price','Yes, the monthly depreciation amount','No new cash payment'],correct:2,feedback:'Cash was paid when the equipment was purchased. Depreciation allocates that recorded cost to periods of use; it is a noncash adjustment.'};effects=[{key:'expense',label:'Depreciation expense for one month',value:dep},{key:'remaining',label:'Net equipment value',value:cents(cost-dep)},{key:'cash',label:'Ending cash',value:opening-cost}];}
if(a.topic==='capital'){const investment=[3000,5000,7000][choice.investment],ad=[60,120,200][choice.ad];if(!investment||!ad)throw Error('Invalid funding choice');decision=`Owner contribution $${investment}; advertising package $${ad}`;event('investment','Owner funds deposited','deposit',day(a,1),investment,'Cash','Owner Capital',{investment});event('advertising','Advertising campaign delivered','advertising',day(a,10),ad,'Advertising Expense','Cash',{ad});prediction={prompt:'Does money contributed by the owner count as sales revenue?',options:['Yes, any cash received is revenue','No, it increases owner equity','Only if the business spends it'],correct:1,feedback:'The owner supplied capital rather than purchasing a service from the business. Cash and owner equity increase; revenue does not.'};effects=[{key:'capital',label:'Owner capital contributed',value:investment},{key:'expense',label:'Advertising expense',value:ad},{key:'cash',label:'Ending cash',value:investment-ad}];}
return {opening,events,decision,prediction,effects};}
function validateRows(rows){if(rows.length<2||rows.length>8)return 'Use between two and eight lines.';let d=0,c=0;for(const r of rows){if(!accounts.includes(r.account))return 'Choose an account for every line.';const debit=Number(r.debit||0),credit=Number(r.credit||0);if(!Number.isFinite(debit)||!Number.isFinite(credit)||debit<0||credit<0||(debit>0)===(credit>0))return 'Each line needs a positive debit or a positive credit.';d+=Math.round(debit*100);c+=Math.round(credit*100);}return d===c?null:'Debits and credits do not balance.';}
function assess(rows,date,e){const b={};for(const r of rows)b[r.account]=(b[r.account]||0)+Math.round((Number(r.debit||0)-Number(r.credit||0))*100);const used=Object.keys(b).filter(a=>b[a]!==0);const account=used.length===2&&used.includes(e.debit)&&used.includes(e.credit);const amount=account&&b[e.debit]===Math.round(e.amount*100)&&b[e.credit]===-Math.round(e.amount*100);return {account,amount,date:date===e.date,correct:account&&amount&&date===e.date};}
function balances(scenario,entries){const b=Object.fromEntries(accounts.map(a=>[a,0]));b.Cash=scenario.opening;b['Owner Capital']=-scenario.opening;for(const e of Object.values(entries))for(const r of e.rows)b[r.account]+=Math.round((Number(r.debit||0)-Number(r.credit||0))*100)/100;return Object.fromEntries(Object.entries(b).map(([a,v])=>[a,cents(v)]));}
function grade(run){let journal=0;for(const e of run.scenario.events){const f=run.first[e.id];if(f)journal+=(f.account?1:0)+(f.amount?1:0)+(f.date?1:0);}return {journal:Math.round(80*journal/(run.scenario.events.length*3)),prediction:run.predictionFirst===run.scenario.prediction.correct?5:0,effects:run.effectsFirst?Math.round(15*run.scenario.effects.filter(e=>Math.abs(Number(run.effectsFirst[e.key])-e.value)<.005).length/run.scenario.effects.length):0};}
const api={topics,accounts,checkAssignment,suggestTopic,expected,validateRows,assess,balances,grade,day,end};if(typeof module!=='undefined')module.exports=api;else root.Lessons=api;
})(globalThis);
</script><script>const Q=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cash=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
const key='ledger-lane-classroom-v1';let data;try{data=JSON.parse(localStorage.getItem(key));}catch{}data||={profile:null,assignments:[],runs:{}};let role='home',page='assignments',active=null,record=null,teacherDraft=null,teacherTab='builder',notice='',entryRows=[{account:'',debit:'',credit:''},{account:'',debit:'',credit:''}];
const icons={'Coffee shop':'☕','Design studio':'🎨','Bike repair':'🚲'};const equipmentNames={'Coffee shop':['Espresso machine & grinder','Higher-capacity espresso station','Two-station café equipment'],'Design studio':['Workstation & proof printer','Calibrated workstation & color printer','Two-workstation design studio'],'Bike repair':['Repair stand & tools','Two-bay workshop tools','Three-station repair equipment']};
function persist(){try{localStorage.setItem(key,JSON.stringify(data));}catch{notice='Browser storage is unavailable. Keep this tab open and export work before closing.';}}
function makeAssignment(topic,index=0){const t=Lessons.topics[topic];return {version:1,id:'demo-'+topic,title:['A home for your business','A customer buys on account','Equipment that lasts','Opening the doors'][index]||t.name,topic,course:'Introduction to Financial Accounting',instructions:t.goal,year:2026,month:9,support:'guided',notes:'',published:true,origin:'Example assignment'};}
if(!data.assignments.length){data.assignments=Object.keys(Lessons.topics).map((t,i)=>makeAssignment(t,i));persist();}
function run(){return data.runs[active];}function assignment(){return run()?.assignment||data.assignments.find(a=>a.id===active);}function month(a){return new Date(a.year,a.month-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});}function header(){return `<header><a href="#" class="brand" id="brand-home"><span>▥</span> ledger lane</a><div class="header-tools"><button class="quiet" id="help">How it works</button><button class="secondary" id="full">Full screen</button><button class="quiet" id="role-home">Home</button></div></header>`;}
function shell(content){Q('#classroom').innerHTML='<main class="shell">'+header()+content+(notice?`<div class="message" role="status">${safe(notice)}</div>`:'')+'<p class="foot classroom-foot">Classroom prototype · saved on this browser · assignments can be shared as files · no authenticated accounts or shared gradebook yet</p></main><dialog id="lesson-dialog"></dialog>';Q('#role-home').onclick=()=>{role='home';notice='';render();};Q('#brand-home').onclick=e=>{e.preventDefault();role='home';render();};Q('#full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen();}catch{notice='Use F11 on Windows or Control + Command + F on Mac for full screen.';render();}};Q('#help').onclick=help;}
function render(){if(role==='home'){shell(`<section class="class-home"><div class="tag">YOUR BUSINESS. EACH LESSON, ITS OWN STORY.</div><h1>Accounting makes<br>the business make sense.</h1><p>Create your business once. Practice one topic at a time through decisions, real-looking documents, journal entries, and the financial results.</p><div class="role-grid"><section class="card"><div class="tag">FOR STUDENTS</div><h2>${data.profile?safe(data.profile.name):'Build your business'}</h2><p>Every assignment takes place in your business. Each begins with its own verified balances, so earlier mistakes never follow you into a new lesson.</p><button id="student">${data.profile?'Enter your business':'Create your business'} →</button></section><section class="card"><div class="tag">FOR PROFESSORS</div><h2>Teach the topic.<br>Keep the context.</h2><p>Use your notes to draft a focused business episode. Review its choices, documents, expected entries and grading before sharing it.</p><button id="professor" class="secondary">Assignment studio →</button></section></div><a class="capstone-link" href="capstone.html">Explore the September–December comprehensive simulation →</a></section>`);Q('#student').onclick=()=>{role='student';page='assignments';render();};Q('#professor').onclick=()=>{role='professor';render();};return;}
if(role==='professor'){renderProfessor();return;}if(!data.profile){profilePage();return;}renderStudent();}
function profilePage(){shell(`<section class="welcome"><div class="tag">YOUR PERSISTENT BUSINESS PROFILE</div><h1>Give your business<br>a name and a home.</h1><p>This identity stays with you throughout the course. Assignments have independent starting balances and accounting records.</p><form id="profile-form"><label class="field">Business name<input id="business-name" maxlength="45" required placeholder="Tommy’s Coffee"></label><label class="field">Business type<select id="business-type">${Object.keys(icons).map(t=>`<option>${t}</option>`).join('')}</select></label><label class="field">Storefront color<select id="business-color"><option value="sage">Sage green</option><option value="terracotta">Warm terracotta</option><option value="blue">Harbor blue</option></select></label><button>Create my business →</button></form></section>`);Q('#profile-form').onsubmit=e=>{e.preventDefault();const name=Q('#business-name').value.trim();if(!name)return;data.profile={name,type:Q('#business-type').value,color:Q('#business-color').value};persist();render();};}
function shop(){const p=data.profile;return `<div class="class-shop ${p.color}"><div class="shop-sign">${safe(p.name)}</div><div class="class-awning"></div><div class="class-windows"><span>${icons[p.type]}</span><span class="shop-door">OPEN</span><span>${p.type==='Coffee shop'?'☕':p.type==='Bike repair'?'⚙':'▧'}</span></div><div class="shop-sidewalk"></div></div>`;}
function studentIntro(){return `<div class="intro"><div><div class="tag">${safe(data.profile.type)} · BUSINESS CLASSROOM</div><h1>${safe(data.profile.name)}</h1><p>Same business. A fresh accounting story for every assignment.</p></div><button id="import" class="secondary">Import assignment</button></div><nav class="tabs"><button data-page="assignments" class="${page==='assignments'?'selected':''}">Assignments</button><button data-page="portfolio" class="${page==='portfolio'?'selected':''}">Learning portfolio</button><button data-page="profile" class="${page==='profile'?'selected':''}">Business profile</button></nav>`;}
function studentNav(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;active=null;notice='';render();});Q('#import').onclick=importAssignment;}
function renderStudent(){let content='';if(page==='profile')content=`<div class="role-grid"><section class="card">${shop()}</section><section class="card"><h2>Your business identity</h2><p><strong>${safe(data.profile.name)}</strong><br>${safe(data.profile.type)}</p><p>Business identity carries across assignments. Balances, transactions and mistakes do not. Each assignment is a separate classroom scenario.</p><button id="edit-profile" class="secondary">Edit name & appearance</button></section></div>`;else if(page==='portfolio')content=portfolio();else if(active)content=assignmentPage();else content=`<div class="assignment-layout"><section class="card business-summary">${shop()}<h3>A business worth understanding.</h3><p>Select a lesson or import an assignment from your professor. You will choose a business action, read the documents, and account for the result.</p><div class="message">Example assignments are ready to try. Your professor can replace these with course-specific assignments.</div></section><div class="assignment-list">${data.assignments.filter(a=>a.published).map(a=>{const r=data.runs[a.id],s=r?Lessons.grade(r):null;return `<section class="card assignment-card"><div class="tag">${safe(a.origin||a.course)} · ${Lessons.topics[a.topic].name}</div><h2>${safe(a.title)}</h2><p>${safe(a.instructions)}</p><div class="assignment-meta"><span>${month(a)}</span><span>One business decision · two entries</span><span>${r?.completed?'Completed':r?'In progress':'Not started'}</span></div><button data-open="${safe(a.id)}">${r?.completed?'Review assignment':r?'Continue assignment':'Start assignment'} →</button></section>`;}).join('')}</div></div>`;
shell(studentIntro()+content);studentNav();document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{active=b.dataset.open;record=null;notice='';render();});if(page==='profile')Q('#edit-profile').onclick=editProfile;if(page==='portfolio'){Q('#export-portfolio').onclick=()=>download('ledger-lane-portfolio.json',{version:1,profile:data.profile,runs:data.runs,note:'Local student-controlled work, not an authenticated grade record.'});return;}if(active)wireAssignment();}
function portfolio(){const rows=data.assignments.filter(a=>data.runs[a.id]);return `<section class="card portfolio-card"><div class="tag">PRACTICE, FEEDBACK, AND PROGRESS</div><h2>Your learning portfolio</h2><p>Journal entries: 80 points. Financial effects: 15 points. One conceptual prediction: 5 points. First-attempt scores remain when you correct your work.</p><table><thead><tr><th>Assignment</th><th>Journal</th><th>Effects</th><th>Prediction</th><th>Status</th></tr></thead><tbody>${rows.map(a=>{const r=data.runs[a.id],s=Lessons.grade(r);return `<tr><td>${safe(a.title)}</td><td>${s.journal}/80</td><td>${s.effects}/15</td><td>${s.prediction}/5</td><td>${r.completed?'Completed':'In progress'}</td></tr>`;}).join('')||'<tr><td colspan="5">Start an assignment to begin your portfolio.</td></tr>'}</tbody></table><button id="export-portfolio">Download portfolio</button><p class="foot">Professors review exported work. This prototype does not transmit grades or verify student identity.</p></section>`;}
function editProfile(){const d=Q('#lesson-dialog');d.innerHTML=`<h2>Edit your business</h2><form id="edit-profile-form"><label class="field">Business name<input name="name" maxlength="45" required value="${safe(data.profile.name)}"></label><label class="field">Storefront color<select name="color">${['sage','terracotta','blue'].map(c=>`<option ${data.profile.color===c?'selected':''}>${c}</option>`).join('')}</select></label><p>Business type stays the same once assignments begin. Previous work keeps the business context in which it was completed.</p><button>Save profile</button></form>`;d.showModal();Q('#edit-profile-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.profile.name=String(f.get('name')).trim();data.profile.color=f.get('color');persist();d.close();render();};}
function choiceForm(a){let fields='';if(a.topic==='prepaid')fields=`<label class="field">Location<select name="location"><option value="0">Quiet side street · $150/month</option><option value="1">Neighborhood main street · $250/month</option><option value="2">Town center · $400/month</option></select></label><label class="field">Pay in advance for<select name="months"><option value="1">One month</option><option value="3" selected>Three months</option><option value="6">Six months</option></select></label><p>The payment purchases coverage beginning on the first day of the assignment month. At month-end, one month has been used. Other operating transactions are excluded from this lesson.</p>`;if(a.topic==='receivables')fields=`<label class="field">Customer order<select name="order"><option value="0">Small order · $400</option><option value="1">Medium order · $700</option><option value="2">Large order · $1,000</option></select></label><label class="field">Customer payment arrangement<select name="collection"><option value="0">Collect 25% this month</option><option value="1" selected>Collect 50% this month</option><option value="2">Collect 100% this month</option></select></label><p>You deliver the order on credit, then collect the agreed portion later in the month. Supplies and other expenses are outside this focused lesson.</p>`;if(a.topic==='equipment')fields=`<label class="field">Equipment package<select name="level">${equipmentNames[data.profile.type].map((x,i)=>`<option value="${i}">${safe(x)} · ${cash([600,1200,1800][i])}</option>`).join('')}</select></label><label class="field">Estimated useful life<select name="life"><option value="0">3 years</option><option value="1" selected>5 years</option><option value="2">6 years</option></select></label><p>Equipment is placed in service on the first day. Use straight-line depreciation, zero residual value, and one full month of use. The estimate is a classroom choice; actual estimates require evidence.</p>`;if(a.topic==='capital')fields=`<label class="field">Owner contribution<select name="investment"><option value="0">$3,000</option><option value="1" selected>$5,000</option><option value="2">$7,000</option></select></label><label class="field">Advertising package<select name="ad"><option value="0">Local listing · $60</option><option value="1">Neighborhood promotion · $120</option><option value="2">Opening campaign · $200</option></select></label><p>The owner funds the business, then you pay for advertising delivered during the month. No sales occur in this focused episode.</p>`;return `<section class="card"><div class="tag">1 · MAKE THE BUSINESS CHOICE</div><h2>What will ${safe(data.profile.name)} do?</h2><form id="business-choice">${fields}<div class="message" id="choice-preview"></div><button>Confirm business decision →</button></form></section>`;}
function assignmentPage(){const a=assignment(),r=run();if(!r)return `<button class="quiet" id="back-assignments">← All assignments</button><div class="lesson-heading"><div class="tag">${Lessons.topics[a.topic].name} · ${month(a)}</div><h2>${safe(a.title)}</h2><p>${safe(a.instructions)}</p><div class="message">Independent scenario · ${a.topic==='capital'?'Opening cash is $0.':'Opening cash is $8,000, supported by verified owner capital.'} No balances or mistakes carry in from another assignment.</div></div><div class="role-grid"><section class="card">${shop()}<h3>The lesson goal</h3><p>${Lessons.topics[a.topic].goal}</p><p>${Lessons.topics[a.topic].effect}</p></section>${choiceForm(a)}</div>`;
const s=r.scenario,unlocked=r.advanced?s.events:s.events.slice(0,1),allCorrect=s.events.every(e=>r.entries[e.id]&&Lessons.assess(r.entries[e.id].rows,r.entries[e.id].date,e).correct);return `<button class="quiet" id="back-assignments">← All assignments</button><div class="lesson-heading"><div class="tag">${Lessons.topics[a.topic].name} · ${month(a)}</div><h2>${safe(a.title)}</h2><p>${safe(a.instructions)}</p></div><div class="episode-strip"><div><span class="tag">YOUR DECISION</span><strong>${safe(s.decision)}</strong></div><div><span class="tag">VERIFIED STARTING CASH</span><strong>${cash(s.opening)}</strong></div><div><span class="tag">SCENARIO STATUS</span><strong>${r.completed?'Completed':r.advanced?'Month-end review':'Business decision made'}</strong></div></div><div class="lesson-workspace"><section class="card"><div class="tag">2 · READ THE BUSINESS RECORDS</div><h2>Records inbox</h2><p>Read dates, payment terms and delivery status. You choose when to do the bookkeeping.</p>${unlocked.map(e=>`<button class="record" data-record="${e.id}"><span>${e.date}<br><strong>${e.title}</strong><small>${r.entries[e.id]?'Entry saved':'Not yet entered'}</small></span><span>View document →</span></button>`).join('')}${!r.advanced?`<div class="time-step"><h3>${['prepaid','equipment'].includes(a.topic)?'The month moves forward':'The next business event arrives'}</h3><p>${['prepaid','equipment'].includes(a.topic)?'Your business has used its resources for one month. Check what changes at month-end.':'Read the next document to distinguish the later event from the original transaction.'}</p><button id="advance-episode">${['prepaid','equipment'].includes(a.topic)?'Advance to month-end →':'Continue the episode →'}</button></div>`:''}<button class="quiet" id="view-taccounts">Open T accounts</button></section><section class="card bookkeeper"><div class="tag">YOUR BOOKKEEPING</div><h2>${record?'Journal entry':'Open a document to begin'}</h2>${record?journalForm(s.events.find(e=>e.id===record)): '<p>Choose a document in the records inbox. Inspect it before selecting accounts and writing the entry.</p>'}</section></div>${r.advanced?predictionPanel():''}${r.advanced&&r.prediction!==undefined?`<section class="card reflection"><div class="tag">4 · SEE THE FINANCIAL EFFECT</div><h2>What do the accounts tell you?</h2><p>${Lessons.topics[a.topic].effect} Use your T accounts; these are small statement sections, not a full set of financial statements.</p><form id="effect-form">${s.effects.map(e=>`<label class="statement-line">${e.label}<input name="${e.key}" aria-label="${e.label}" type="number" step=".01" required value="${safe(r.effectDraft?.[e.key]??'')}"></label>`).join('')}<button ${!allCorrect?'disabled':''}>Check financial effects</button>${!allCorrect?'<p class="foot">Correct both journal entries before completing the statement sections.</p>':''}</form><div id="effect-feedback" role="status">${r.completed?completion(r):''}</div></section>`:''}<section class="card reflection"><h3>Assignment journal</h3><table><thead><tr><th>Date</th><th>Document</th><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${Object.entries(r.entries).map(([id,e])=>e.rows.map((x,i)=>`<tr><td>${i===0?e.date:''}</td><td>${i===0?s.events.find(x=>x.id===id).title:''}</td><td>${safe(x.account)}</td><td>${Number(x.debit)?cash(Number(x.debit)):''}</td><td>${Number(x.credit)?cash(Number(x.credit)):''}</td></tr>`).join('')).join('')||'<tr><td colspan="5">Your journal entries will appear here.</td></tr>'}</tbody></table><p class="foot">Corrections replace entries in these books. Original attempts remain in your grading record.</p></section>`;}
function journalForm(e){const r=run(),old=r.entries[e.id];if(record!==r.selectedRecord){entryRows=old?structuredClone(old.rows):[{account:'',debit:'',credit:''},{account:'',debit:'',credit:''}];r.selectedRecord=record;}return `${documentHtml(e,assignment(),r.business)}<form id="journal-form"><label class="field">Journal-entry date<input id="entry-date" type="date" required value="${safe(old?.date||r.entryDateDraft||'')}"></label><table><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${entryRows.map((x,i)=>`<tr><td><select data-line="${i}" data-field="account" aria-label="Account ${i+1}" required><option value="">Select account</option>${Lessons.accounts.map(a=>`<option ${a===x.account?'selected':''}>${a}</option>`).join('')}</select></td><td><input data-line="${i}" data-field="debit" aria-label="Debit ${i+1}" type="number" step=".01" min="0" value="${safe(x.debit)}"></td><td><input data-line="${i}" data-field="credit" aria-label="Credit ${i+1}" type="number" step=".01" min="0" value="${safe(x.credit)}"></td></tr>`).join('')}</tbody></table><div class="actions"><button>Save journal entry</button><button type="button" class="secondary" id="add-line">+ Line</button>${assignment().support==='guided'?'<button type="button" class="quiet" id="hint">Concept hint</button>':''}</div></form><div id="entry-feedback" role="status">${old?entryFeedback(Lessons.assess(old.rows,old.date,e)):''}</div>`;}
function entryFeedback(g){return `<div class="message ${g.correct?'':'error'}">${g.correct?'Entry verified. Read your T accounts to see its effect.':`${!g.date?'Check the transaction date. ':''}${!g.account?'Reconsider what the business received, used, earned, or owes. ':!g.amount?'Recheck the amount and which side each account belongs on. ':''}Your first attempt is retained; you can revise this entry.`}</div>`;}
function predictionPanel(){const r=run(),p=r.scenario.prediction;return `<section class="card reflection"><div class="tag">3 · A QUICK CONCEPT CHECK</div><h3>${p.prompt}</h3>${r.prediction===undefined?`<form id="prediction-form">${p.options.map((x,i)=>`<label class="prediction-option"><input type="radio" name="prediction" value="${i}" required>${x}</label>`).join('')}<button>Check my prediction</button></form>`:`<div class="message">${r.prediction===p.correct?'You predicted it correctly.':'Let’s connect the event to the accounts.'} ${p.feedback}</div>`}</section>`;}
function completion(r){const s=Lessons.grade(r);return `<div class="message"><strong>Assignment completed.</strong> First-attempt score: ${s.journal+s.effects+s.prediction}/100. Journal ${s.journal}/80 · effects ${s.effects}/15 · prediction ${s.prediction}/5.<br>Your business identity continues. The next assignment starts with its own balances.</div>`;}
function wireAssignment(){Q('#back-assignments').onclick=()=>{active=null;record=null;notice='';render();};const a=assignment(),r=run();if(!r){const form=Q('#business-choice');const preview=()=>{const choice=Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)]));const s=Lessons.expected(a,choice);Q('#choice-preview').textContent=`${s.decision}. Starting cash: ${cash(s.opening)}. The decision creates source documents; you must determine the entries.`;};form.querySelectorAll('select').forEach(s=>s.onchange=preview);preview();form.onsubmit=e=>{e.preventDefault();const choice=Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)]));data.runs[a.id]={assignment:structuredClone(a),business:structuredClone(data.profile),choice,scenario:Lessons.expected(a,choice),entries:{},first:{},advanced:false,completed:false};persist();render();};return;}
document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>viewRecord(b.dataset.record));Q('#view-taccounts').onclick=tAccounts;if(Q('#advance-episode'))Q('#advance-episode').onclick=()=>{r.advanced=true;persist();render();};if(Q('#journal-form')){Q('#entry-date').oninput=e=>r.entryDateDraft=e.target.value;document.querySelectorAll('[data-line]').forEach(el=>el.oninput=()=>entryRows[Number(el.dataset.line)][el.dataset.field]=el.value);Q('#add-line').onclick=()=>{if(entryRows.length<8){entryRows.push({account:'',debit:'',credit:''});render();}};if(Q('#hint'))Q('#hint').onclick=()=>{r.hints||=[];if(!r.hints.includes(record))r.hints.push(record);persist();Q('#entry-feedback').innerHTML='<div class="message">'+Lessons.topics[a.topic].goal+' Ask whether the business has received a future benefit, used a resource, earned revenue, or merely received payment for something already recorded.</div>';};Q('#journal-form').onsubmit=e=>{e.preventDefault();const error=Lessons.validateRows(entryRows);if(error){Q('#entry-feedback').innerHTML='<div class="message error">'+error+'</div>';return;}const event=r.scenario.events.find(e=>e.id===record),date=Q('#entry-date').value,g=Lessons.assess(entryRows,date,event);r.first[record]??=g;r.entries[record]={rows:structuredClone(entryRows),date};r.entryDateDraft='';r.completed=false;persist();render();};}
if(Q('#prediction-form'))Q('#prediction-form').onsubmit=e=>{e.preventDefault();const n=Number(new FormData(e.target).get('prediction'));r.prediction=n;r.predictionFirst??=n;persist();render();};if(Q('#effect-form')){Q('#effect-form').querySelectorAll('input').forEach(el=>el.oninput=()=>{r.effectDraft||={};r.effectDraft[el.name]=el.value;persist();});Q('#effect-form').onsubmit=e=>{e.preventDefault();const input=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,Number(v)]));r.effectsFirst??=input;r.effectsLatest=input;const incorrect=r.scenario.effects.filter(x=>Math.abs(input[x.key]-x.value)>.005);if(!incorrect.length){r.completed=true;persist();Q('#effect-feedback').innerHTML=completion(r);}else{persist();Q('#effect-feedback').innerHTML='<div class="message error">Recheck '+incorrect.map(x=>x.label).join(', ')+'. Your first attempt is retained. Use the T accounts to revise your work.</div>';}};}}
function viewRecord(id){const e=run().scenario.events.find(e=>e.id===id),d=Q('#lesson-dialog');d.innerHTML=documentHtml(e,assignment(),run().business)+'<div class="actions"><button id="work-entry">Work on this entry</button><button class="secondary" id="close-record">Keep running the business</button></div>';d.showModal();Q('#close-record').onclick=()=>d.close();Q('#work-entry').onclick=()=>{d.close();record=id;run().entryDateDraft='';render();Q('.bookkeeper').scrollIntoView({behavior:'smooth',block:'start'});};}
function documentHtml(e,a,business){const d=e.detail,kind=e.kind,name=safe(business.name);let title='',issuer='',status='',body='',total=cash(e.amount),label='Total';if(kind==='lease'){title='Commercial rental receipt';issuer='Oak Street Property Management';status='PAID';body=`Tenant: ${name}<br>Location: ${['Quiet side street','Neighborhood main street','Town center'][d.location]}<br>Coverage begins: ${Lessons.day(a,1)}<br>Months paid in advance: ${d.months}<br>Monthly rental rate: ${cash(d.rate)}<br>Payment method: business checking`;label='Payment received';}if(kind==='coverage'){title='Rental coverage schedule';issuer='Oak Street Property Management';status='NO PAYMENT DUE';body=`Tenant: ${name}<br>Period ended: ${e.date}<br>Time occupied this period: 1 month<br>Original prepaid coverage: ${d.months} months<br>Monthly rental rate: ${cash(d.rate)}<br>Current cash charge: $0.00`;label='Coverage used at contract rate';}if(kind==='invoice'){title='Customer invoice';issuer=business.name;status='UNPAID';body=`Bill to: Neighborhood catering customer<br>Services delivered: ${e.date}<br>Order status: completed<br>Invoice total: ${cash(d.sale)}<br>Payment terms: agreed partial settlement later this month<br>Payment received on invoice date: $0.00`;label='Amount due';if(business.type==='Design studio')body=body.replace('catering customer','design client');if(business.type==='Bike repair')body=body.replace('catering customer','repair customer');}if(kind==='remittance'){title='Customer payment confirmation';issuer='Neighborhood Bank';status='RECEIVED';body=`Account holder: ${name}<br>Payment against invoice dated: ${Lessons.day(a,8)}<br>Original invoice: ${cash(d.sale)}<br>Transfer received: ${cash(d.paid)}<br>New services included with this transfer: none`;label='Cash deposited';}if(kind==='equipment'){title='Equipment supplier invoice';issuer='Northside Business Equipment';status='PAID';body=`Customer: ${name}<br>Item: ${safe(equipmentNames[business.type][[600,1200,1800].indexOf(d.cost)])}<br>Delivered and placed in service: ${e.date}<br>Payment method: business checking`;label='Invoice total';}if(kind==='asset'){title='Fixed asset register';issuer=business.name+' · Business records';status='MONTH-END';body=`Placed in service: ${Lessons.day(a,1)}<br>Cost: ${cash(d.cost)}<br>Estimated useful life: ${d.life} years<br>Residual value: $0.00<br>Depreciation method: straight-line<br>Convention: full month from placement in service<br>Months used this period: 1`;label='Asset cost';total=cash(d.cost);}if(kind==='deposit'){title='Owner capital deposit slip';issuer='Neighborhood Bank';status='RECEIVED';body=`Account holder: ${name}<br>Depositor: business owner<br>Transfer description: initial business investment<br>Customer services involved: none`;label='Cash deposited';}if(kind==='advertising'){title='Advertising service invoice';issuer='Local Reach Media';status='PAID';body=`Client: ${name}<br>Campaign: ${['Local listing','Neighborhood promotion','Opening campaign'][[60,120,200].indexOf(d.ad)]}<br>Service delivered during: ${month(a)}<br>Payment method: business checking`;label='Invoice total';}return `<article class="source-document"><div class="paper-top"><span>${safe(issuer)}</span><span class="paper-status">${status}</span></div><h2>${title}</h2><div class="paper-meta"><span>Document ${safe(e.id).toUpperCase()}</span><span>${e.date}</span></div><div class="paper-item">${safe(e.title)}</div><p>${body}</p><div class="paper-total"><span>${label}</span><strong>${total}</strong></div><div class="paper-footer">Business copy · Retain with assignment records</div></article>`;}
function tAccounts(){const r=run(),b=Lessons.balances(r.scenario,r.entries),d=Q('#lesson-dialog');const used=Lessons.accounts.filter(a=>b[a]||Object.values(r.entries).some(e=>e.rows.some(x=>x.account===a)));d.innerHTML='<h2>Assignment T accounts</h2><p>Verified opening balances are included. These books show your latest entries, including errors until corrected.</p><div class="t-grid">'+used.map(a=>{const opening=a==='Cash'?r.scenario.opening:a==='Owner Capital'?-r.scenario.opening:0;return `<section class="t-account"><h3>${a}</h3><div class="t-head"><span>Debit</span><span>Credit</span></div><div class="t-body">${['debit','credit'].map(side=>`<div>${opening&&((opening>0)===(side==='debit'))?`<div><small>Verified opening balance</small>${cash(Math.abs(opening))}</div>`:''}${Object.values(r.entries).flatMap(e=>e.rows.filter(x=>x.account===a&&Number(x[side])).map(x=>`<div><small>${e.date}</small>${cash(Number(x[side]))}</div>`)).join('')}</div>`).join('')}</div><p>Balance: ${cash(Math.abs(b[a]))} ${b[a]>=0?'Dr':'Cr'}</p></section>`;}).join('')+'</div><button id="close-ledger" class="secondary">Back to assignment</button>';d.showModal();Q('#close-ledger').onclick=()=>d.close();}
function defaultDraft(){return {version:1,id:crypto.randomUUID(),topic:'prepaid',title:'A home for your business',course:'Introduction to Financial Accounting',instructions:Lessons.topics.prepaid.goal,year:2026,month:9,support:'guided',notes:'',published:false,origin:'Professor assignment'};}
function renderProfessor(){teacherDraft||=data.teacherDraft||defaultDraft();const a=teacherDraft;shell(`<div class="intro"><div><div class="tag">PROFESSOR ASSIGNMENT STUDIO</div><h1>One topic.<br>A business decision.</h1><p>Draft a focused episode, review its accounting, then share it with your students.</p></div><button id="new-draft" class="secondary">New assignment</button></div><nav class="tabs"><button data-teacher="builder" class="${teacherTab==='builder'?'selected':''}">Build assignment</button><button data-teacher="library" class="${teacherTab==='library'?'selected':''}">Assignment library</button></nav>${teacherTab==='library'?teacherLibrary():`<div class="professor-layout"><section class="card"><div class="tag">1 · COURSE MATERIAL</div><h2>Start with your topic or notes</h2><p>Text notes suggest one of four supported topics. The accounting and grading come from tested lesson templates. Review the draft before sharing.</p><label class="field">Upload text notes<input id="notes-file" type="file" accept=".txt,.md,text/plain,text/markdown"></label><label class="field">Or paste notes<textarea id="teacher-notes" maxlength="30000" placeholder="e.g. Prepaid rent is an asset until the coverage is used. At month-end…">${safe(a.notes)}</textarea></label><button id="suggest-topic" class="secondary">Draft from notes</button><p class="foot">Files stay in your browser. Supported: TXT and Markdown. Paste text from PDFs or slides. No external AI service is connected.</p><div class="message">Four supported lessons: prepaid expenses, receivables, equipment depreciation, and owner investment/cash expenses. Notes outside these topics need a professor-selected supported topic.</div></section><section class="card"><div class="tag">2 · ASSIGNMENT SETTINGS</div><h2>Define the lesson</h2><form id="teacher-form"><label class="field">Topic<select name="topic">${Object.entries(Lessons.topics).map(([id,t])=>`<option value="${id}" ${a.topic===id?'selected':''}>${t.name}</option>`).join(' (function(root){

wireAssignment=function(){localWireAssignment();if(!cloudAccount)return;
if(!run()){Q('#business-choice').onsubmit=e=>{e.preventDefault();const choice=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,Number(v)]));cloudTask(async()=>{await submitCloud('start',{choice});render();});};return;}
if(Q('#advance-episode'))Q('#advance-episode').onclick=()=>cloudTask(async()=>{await submitCloud('advance',{});render();});
if(Q('#journal-form'))Q('#journal-form').onsubmit=e=>{e.preventDefault();const payload={record,date:Q('#entry-date').value,rows:structuredClone(entryRows)};cloudTask(async()=>{await submitCloud('entry',payload);render();});};
if(Q('#prediction-form'))Q('#prediction-form').onsubmit=e=>{e.preventDefault();const answer=Number(new FormData(e.target).get('prediction'));cloudTask(async()=>{await submitCloud('prediction',{answer});render();});};
if(Q('#effect-form'))Q('#effect-form').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,Number(v)]));cloudTask(async()=>{const r=await submitCloud('effects',{values});render();if(!r.completed)Q('#effect-feedback').textContent='Recheck your financial effects using the T accounts. Your first submitted attempt is retained.';});};};
async function startCloud(){const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('type')==='recovery'&&hash.get('access_token')){const token=hash.get('access_token');history.replaceState(null,'',location.pathname);shell('<section class="welcome"><h1>Set a new password</h1><form id="reset-password"><label class="field">New password<input type="password" id="new-password" required minlength="12" autocomplete="new-password"></label><button>Save password</button></form></section>');Q('#reset-password').onsubmit=e=>{e.preventDefault();cloudTask(async()=>{const response=await fetch(cloud.config.url+'/auth/v1/user',{method:'PUT',headers:{apikey:cloud.config.publishableKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:Q('#new-password').value})});if(!response.ok)throw Error('Reset link expired. Request another password reset.');cloud.setSession(null);cloudScreen='login';render();Q('#cloud-status').textContent='Password updated. Sign in with your new password.';});};return;}
if(hash.get('access_token'))history.replaceState(null,'',location.pathname);if(cloud.configured&&cloud.session){try{await loadCloud();cloudScreen='dashboard';}catch(e){cloudMessage=e.message;cloudScreen='login';}}render();}
startCloud();

function submissionDetails(attempt,state){const p=attempt.submitted;if(attempt.action==='entry')return `<p>Document: ${safe(p.record)} · Journal date: ${safe(p.date)}</p><table><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${p.rows.map(x=>`<tr><td>${safe(x.account)}</td><td>${cash(Number(x.debit||0))}</td><td>${cash(Number(x.credit||0))}</td></tr>`).join('')}</tbody></table>`;if(attempt.action==='prediction')return `<p>Student selected: ${safe(state.scenario.prediction.options[p.answer])}</p>`;if(attempt.action==='effects')return state.scenario.effects.map(e=>`<p>${safe(e.label)}: ${cash(p.values[e.key])}</p>`).join('');if(attempt.action==='start')return `<p>${safe(state.scenario.decision)}</p>`;return '<p>The student continued to the next business event.</p>';}
</script></body></html>
