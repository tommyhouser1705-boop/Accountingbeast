function draftChatHtml(){const messages=teacherDraft.revisionChat||[];return `<section class="draft-chat"><div class="tag">PROFESSOR ONLY · PRIVATE DRAFT</div><h3>Tell the AI what to change</h3><p>Describe what isn’t working. We’ll revise the draft and check its accounting. Students won’t see this chat.</p><div class="draft-chat-messages" aria-live="polite">${chatMessages(messages)}</div><form class="draft-chat-form"><label class="field">What should change?<textarea name="message" maxlength="2000" required placeholder="Break September into ordering supplies, recording the invoice, choosing a payment date, and recording the payment. Use shorter instructions."></textarea></label><button data-cloud-submit>Revise draft</button><p class="foot">The checked revision replaces your private draft. Published assignments and student work stay as they are.</p><div class="draft-chat-status" role="status"></div></form></section>`;}
function wireDraftChat(root=document){
 const f=root.querySelector('.draft-chat-form');if(!f||!cloudAccount||!['owner','professor'].includes(cloudAccount.role))return;
 f.onsubmit=e=>{e.preventDefault();const message=new FormData(f).get('message').trim();if(!message)return;
 const status=f.querySelector('.draft-chat-status');if(cloudBusy){status.textContent='Another request is finishing. Wait for it, then submit your change again.';return;}
 const current=structuredClone(teacherDraft),isRetry=f.dataset.retry==='true';delete f.dataset.retry;cloudTask(async()=>{
  status.className='draft-chat-status revision-pending';status.textContent='Updating the assignment preview and checking its entries…';
  const textarea=f.querySelector('textarea'),thread=f.closest('.draft-chat').querySelector('.draft-chat-messages'),sent=(isRetry?(current.revisionChat||[]).slice(0,-1):[...(current.revisionChat||[]),{role:'user',text:message}]).slice(-11);textarea.value='';textarea.disabled=true;teacherDraft.revisionChat=sent;saveTeacherWorkspace();thread.innerHTML=chatMessages(sent)+'<div class="chat-assistant chat-pending"><strong>Draft assistant</strong><p>Updating your assignment…</p></div>';thread.scrollTop=thread.scrollHeight;
  try{
   const revised=await cloud.call('generate',{phase:'revise',notes:current.notes,currentDraft:current,request:message,year:current.year,month:current.month,timelineMode:'auto',depth:current.depth||'standard',course:current.course,report:current.report,support:current.support});
   if(!Lessons.checkAssignment(revised))throw Error('The response did not contain a checked assignment.');
   const changes=CloudClient.revisionChanges(current,revised);if(!changes.length)throw Error('The AI returned the same assignment. No changes were applied. Try describing a specific change to the instructions, decisions or records.');
   revised.revisionChanges=changes;revised.revisionOf=current.revisionOf||(current.published?current.id:null);revised.revisionAt=new Date().toISOString();
   revised.revisionChat=[...sent,{role:'assistant',text:'Preview updated. Changed: '+changes.join(', ')+'. Review the updated draft below before publishing.'}].slice(-12);
   revised.grading=structuredClone(current.grading);revised.depth=current.depth||revised.depth;revised.request=current.request||'';teacherDraft=revised;data.teacherDraft=revised;teacherTab='builder';reviewPlan=0;reviewDecision=null;saveTeacherWorkspace();
   const d=Q('#lesson-dialog');if(d.open)d.close();notice='The preview now shows your revised draft.';render();reviewDraft();Q('#lesson-dialog').scrollTop=0;
  }catch(error){const text=error.message+' Your previous assignment is still available; the preview has not changed.';teacherDraft.revisionChat=[...sent,{role:'assistant',text,error:true}].slice(-12);saveTeacherWorkspace();thread.innerHTML=chatMessages(teacherDraft.revisionChat);thread.scrollTop=thread.scrollHeight;status.className='draft-chat-status revision-error';status.innerHTML='<strong>The preview was not updated.</strong><p>'+safe(error.message)+'</p><button type="button" class="secondary" data-cloud-submit>Retry this change</button>';status.querySelector('button').onclick=()=>{textarea.value=message;f.dataset.retry='true';f.requestSubmit();};status.scrollIntoView({behavior:'smooth',block:'center'});}
  finally{textarea.disabled=false;}
 });};
}

function generationProgress(step,text){const status=Q('#generation-status');if(!status)return;status.className='generation-progress';status.innerHTML=`<ol><li class="done">Notes loaded</li><li class="${step===1?'current':'done'}">Reading topics</li><li class="${step===2?'current':step>2?'done':''}">Building the assignment</li></ol><p>${safe(text)}</p>`;}
renderProfessor=function(){localProfessor();if(!cloudAccount)return;
 let privateDraft=teacherDraft;try{const saved=JSON.parse(sessionStorage.getItem('ledger-teacher-draft-'+cloudAccount.id));if(saved?.revisionChanges?.length)privateDraft=saved;}catch{}if(teacherTab==='library'&&privateDraft.revisionChanges?.length){Q('.assignment-library').insertAdjacentHTML('beforebegin',`<section class="revision-banner"><strong>Your revised draft is saved</strong><p>${safe(privateDraft.title)}</p><button id="continue-revision">Open updated preview</button></section>`);Q('#continue-revision').onclick=()=>{teacherDraft=privateDraft;teacherTab='builder';render();reviewDraft();};document.querySelectorAll('[data-review]').forEach(b=>{if(b.dataset.review===privateDraft.revisionOf)b.onclick=()=>{teacherDraft=privateDraft;teacherTab='builder';render();reviewDraft();};});}
 if(teacherTab==='builder'&&teacherDraft.revisionChanges?.length)Q('.draft-preview').insertAdjacentHTML('afterbegin',revisedDraftBanner(teacherDraft));
 if(teacherDraft.version===3&&teacherTab==='builder'&&['owner','professor'].includes(cloudAccount.role)){Q('#teacher-form').insertAdjacentHTML('afterend',draftChatHtml());wireDraftChat();}
 const newButton=Q('#new-draft');if(newButton){const localNew=newButton.onclick;newButton.onclick=()=>{sessionStorage.removeItem('ledger-generation-'+cloudAccount.id);sessionStorage.removeItem('ledger-teacher-draft-'+cloudAccount.id);localNew();};}
 if(Q('#suggest-topic')){
  const sourceCard=Q('#notes-file').closest('.card');sourceCard.querySelector('.studio-section-title p').textContent='A fresh business scenario based on the material you teach.';
  sourceCard.querySelector(':scope > .foot').textContent='We send the text from your notes to the connected AI service to create and check the draft. PDFs need readable text. Nothing is shared with students until you publish.';
  const button=Q('#suggest-topic');button.textContent='Create assignment from notes';button.dataset.cloudSubmit='';
  Q('#teacher-notes').addEventListener('input',saveTeacherWorkspace);Q('#teacher-form').addEventListener('input',saveTeacherWorkspace);
  const localFile=Q('#notes-file').onchange;Q('#notes-file').onchange=async e=>{await localFile(e);saveTeacherWorkspace();};
  let pending;try{pending=JSON.parse(sessionStorage.getItem('ledger-generation-'+cloudAccount.id));}catch{}
  if(pending?.draft&&pending.input.notes===teacherDraft.notes.trim()){button.textContent='Continue creating assignment';Q('#generation-status').textContent='The accounting topics are saved. Continue creating the assignment from those topics.';}
  button.onclick=()=>{
   const notes=Q('#teacher-notes').value.trim();if(notes.length<40){const status=Q('#generation-status');status.className='generation-error';status.textContent='Add a notes file or at least a few sentences of course material first.';return;}
   const input={notes,request:'',depth:'standard',year:teacherDraft.year,month:teacherDraft.month,timelineMode:'auto',course:'Introduction to financial accounting',report:'topic',support:'guided'};
   const grading=structuredClone(teacherDraft.grading);saveTeacherWorkspace();cloudTask(async()=>{
    const controls=[...document.querySelectorAll('.studio-layout input,.studio-layout select,.studio-layout textarea,#new-draft')];controls.forEach(el=>el.disabled=true);
    try{
     let saved;try{saved=JSON.parse(sessionStorage.getItem('ledger-generation-'+cloudAccount.id));}catch{}
     if(!saved?.draft||JSON.stringify(saved.input)!==JSON.stringify(input)){
      generationProgress(1,'Reading the accounting topics and methods in your notes.');
      const result=await cloud.call('generate',{...input,phase:'draft'});saved={input,draft:result.draft};sessionStorage.setItem('ledger-generation-'+cloudAccount.id,JSON.stringify(saved));
     }
     generationProgress(2,'Creating new business decisions and checking the resulting entries.');
     teacherDraft=await cloud.call('generate',{...input,phase:'review',draft:saved.draft});teacherDraft.grading=grading;teacherDraft.depth=input.depth;teacherDraft.request=input.request;saveTeacherWorkspace();sessionStorage.removeItem('ledger-generation-'+cloudAccount.id);
     reviewPlan=0;reviewDecision=null;notice='Assignment created. Try the student decisions and review the records and answers before publishing.';render();Q('.draft-preview')?.scrollIntoView({behavior:'smooth',block:'center'});
    }catch(error){
     const status=Q('#generation-status');if(status){status.className='generation-error';status.innerHTML=`<strong>We couldn’t finish this draft.</strong><p>${safe(error.message)}</p><small>Your notes are saved. ${sessionStorage.getItem('ledger-generation-'+cloudAccount.id)?'The topics from your notes are saved too. Click below to try again.':'Try again when you’re ready.'}</small>`;status.scrollIntoView({behavior:'smooth',block:'center'});}
     if(sessionStorage.getItem('ledger-generation-'+cloudAccount.id))button.textContent='Try again';
     if([401,403].includes(error.status))accountError(error);
    }finally{controls.forEach(el=>el.disabled=false);}
   });
  };
 }
 Q('.intro').insertAdjacentHTML('afterend',`<label class="field class-selector">CLASS<select id="publish-class">${classOptions()||'<option>Create a class in My classroom first</option>'}</select></label>`);Q('#publish-class').onchange=e=>{cloudClass=e.target.value;render();};
 if(Q('.library-row')){const desc=Q('.library-row').parentElement.querySelector('p');if(desc)desc.textContent='These assignments are available to students in your class.';}
};
reviewDraft=function(){localReviewDraft();if(!cloudAccount)return;const d=Q('#lesson-dialog'),a=structuredClone(teacherDraft),b=Q('#publish-assignment');b.textContent='Publish to '+(cloudClasses.find(c=>c.id===cloudClass)?.name||'a class');b.disabled=!cloudClass;b.dataset.cloudSubmit='';if(a.revisionChanges?.length){d.querySelector('h2').insertAdjacentHTML('afterend',revisedDraftBanner(a));b.textContent='Publish revised assignment';}if(a.version===3&&['owner','professor'].includes(cloudAccount.role)){d.querySelector('.review-publish-bar').insertAdjacentHTML('beforebegin',draftChatHtml());wireDraftChat(d);}d.querySelector('.foot').textContent='Students in this class receive the assignment in their accounts. Publishing creates a new assignment; existing work stays unchanged.';b.onclick=()=>cloudTask(async()=>{await cloud.call('publish',{classId:cloudClass,assignment:a});sessionStorage.removeItem('ledger-teacher-draft-'+cloudAccount.id);await loadCloud();d.close();cloudScreen='';role='professor';teacherTab='library';render();});};
const localAvailability=changeAssignmentAvailability;
changeAssignmentAvailability=async function(id,deleted){if(!cloudAccount)return localAvailability(id,deleted);return cloudTask(async()=>{try{await cloud.call(deleted?'delete-assignment':'restore-assignment',{assignmentId:id});await loadCloud();Q('#lesson-dialog')?.close();teacherTab='library';cloudScreen='';notice=deleted?'Assignment deleted. You can restore it below.':'Assignment restored.';render();}catch(error){const status=Q('#delete-status');if(status)status.textContent=error.message;else accountError(error);}});};
async function submitCloud(action,payload){const id=active,previous=data.runs[id],result=await cloud.call(action,{assignmentId:id,revision:cloudRevision[id]||0,...payload});if(previous){result.state.guidedStage=previous.guidedStage;result.state.selectedRecord=previous.selectedRecord;}data.runs[id]=result.state;cloudRevision[id]=result.revision;return result.state;}
wireAssignment=function(){localWireAssignment();if(!cloudAccount)return;
if(!run()){Q('#business-choice').onsubmit=e=>{e.preventDefault();const a=assignment(),choice=a.interactive?readBusinessChoice(a,new FormData(e.target),data.profile):Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,Number(v)]));cloudTask(async()=>{await submitCloud('start',{choice});render();focusAssignmentStep();});};return;}
if(Q('#monthly-choice'))Q('#monthly-choice').onsubmit=e=>{e.preventDefault();const a=assignment(),r=run(),m=Lessons.pendingMonth(r),all=readBusinessChoice(a,new FormData(e.target),r.business,r.choice),choice=Object.fromEntries(Lessons.decisionControls(r).map(c=>[c.id,all[c.id]]));cloudTask(async()=>{await submitCloud('decide',{choice});render();focusAssignmentStep();});};
if(Q('#join-challenge'))Q('#join-challenge').onchange=e=>{const join=e.target.checked;cloudTask(async()=>{await submitCloud('challenge',{join});render();});};
if(Q('#view-challenge'))Q('#view-challenge').onclick=()=>cloudTask(async()=>{const rows=await cloud.call('leaderboard',{assignmentId:active});Q('#challenge-results').innerHTML=rows.length?`<ol>${rows.map(x=>`<li><strong>${safe(x.business)}${x.mine?' · You':''}</strong> · Profit ${cash(x.profit)} · Cash ${cash(x.cash)}</li>`).join('')}</ol>`:'<p>No finished businesses have joined yet. Participation is optional.</p>';});
if(Q('#finish-assignment'))Q('#finish-assignment').onclick=()=>cloudTask(async()=>{await submitCloud('complete',{});render();});
if(Q('#advance-episode'))Q('#advance-episode').onclick=()=>cloudTask(async()=>{await submitCloud('advance',{});render();focusAssignmentStep();});
if(Q('#journal-form'))Q('#journal-form').onsubmit=e=>{e.preventDefault();const payload={record,date:Q('#entry-date').value,rows:structuredClone(entryRows)};cloudTask(async()=>{await submitCloud('entry',payload);render();});};
if(Q('#no-entry'))Q('#no-entry').onclick=()=>{if(!Q('#entry-date').reportValidity())return;const date=Q('#entry-date').value;cloudTask(async()=>{await submitCloud('entry',{record,date,rows:[]});render();});};
if(Q('#prediction-form'))Q('#prediction-form').onsubmit=e=>{e.preventDefault();const answer=Number(new FormData(e.target).get('prediction'));cloudTask(async()=>{await submitCloud('prediction',{answer});render();});};
if(Q('#effect-form'))Q('#effect-form').onsubmit=e=>{e.preventDefault();const values=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,Number(v)]));cloudTask(async()=>{const r=await submitCloud('effects',{values});render();if(!r.completed)Q('#effect-feedback').textContent='Recheck your financial effects using the T accounts. Your first submitted attempt is retained.';});};};
async function startCloud(){const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);const callbackError=hash.get('error')||query.get('error');if(callbackError){history.replaceState(null,'',location.pathname);cloudScreen='login';cloudMessage='This email link could not be used. It may have expired or already been opened. Try signing in with your password, or request a new confirmation email below.';render();return;}if(hash.get('type')==='recovery'&&hash.get('access_token')){const token=hash.get('access_token');history.replaceState(null,'',location.pathname);shell('<section class="account-layout account-recovery"><section class="account-panel"><div class="tag">PASSWORD RECOVERY</div><h2>Choose a new password</h2><p class="account-intro">Use at least 12 characters. You’ll sign in with this password once it’s saved.</p><form id="reset-password"><label class="field">New password<input type="password" id="new-password" required minlength="12" autocomplete="new-password"></label><label class="field">Confirm new password<input type="password" id="confirm-new-password" required minlength="12" autocomplete="new-password"></label><button class="account-submit" data-cloud-submit>Save password</button></form></section></section>');Q('#reset-password').append(Q('#cloud-status'));Q('.classroom-foot').textContent='Ledger Lane · Password recovery';Q('#reset-password').onsubmit=e=>{e.preventDefault();if(Q('#new-password').value!==Q('#confirm-new-password').value){Q('#cloud-status').textContent='The passwords don’t match. Please check them and try again.';return;}cloudTask(async()=>{const response=await fetch(cloud.config.url+'/auth/v1/user',{method:'PUT',headers:{apikey:cloud.config.publishableKey,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:Q('#new-password').value})});if(!response.ok)throw Error('Reset link expired. Request another password reset.');cloud.setSession(null);cloudScreen='login';render();Q('#cloud-status').textContent='Password updated. Sign in with your new password.';});};return;}
if(hash.get('access_token')){history.replaceState(null,'',location.pathname);cloudScreen='login';cloudMessage='Your confirmation link opened. Sign in below using the email and password you chose.';}if(cloud.configured&&cloud.session){try{await loadCloud();cloudScreen='dashboard';}catch(e){cloudMessage=e.message;cloudScreen='login';}}render();}
startCloud();

function submissionDetails(attempt,state){const p=attempt.submitted;if(attempt.action==='entry')return `<p>Document: ${safe(p.record)} · Journal date: ${safe(p.date)}</p><table><thead><tr><th>Account</th><th>Debit</th><th>Credit</th></tr></thead><tbody>${p.rows.map(x=>`<tr><td>${safe(x.account)}</td><td>${cash(Number(x.debit||0))}</td><td>${cash(Number(x.credit||0))}</td></tr>`).join('')}</tbody></table>`;if(attempt.action==='prediction')return `<p>Student selected: ${safe(state.scenario.prediction.options[p.answer])}</p>`;if(attempt.action==='effects')return state.scenario.effects.map(e=>`<p>${safe(e.label)}: ${cash(p.values[e.key])}</p>`).join('');if(attempt.action==='start')return `<p>${safe(state.scenario.decision)}</p>`;return '<p>The student continued to the next business event.</p>';}
</script><script>// Signed-in instructor and student app: sidebar navigation, one task per page.
let dashPage = '';

function dashNav(items) {
  return `<nav class="app-nav">${items.map(([k, t, href]) => href ? `<a href="${href}">${t}</a>` : `<button data-dash="${k}" class="${dashPage === k ? 'on' : ''}">${t}</button>`).join('')}</nav>`;
}

function appFrame(side, main) {
  const msg = cloudMessage ? `<div class="app-msg" role="status">${safe(cloudMessage)}</div>` : '';
  return `<div class="app"><aside class="app-side"><a class="app-logo" href="index.html">Ledger Lane</a>${side}<div class="app-who">${safe(cloudAccount.email)}<button id="cloud-logout" class="app-link">Sign out</button></div></aside><main class="app-main">${msg}${main}</main></div>`;
}

function pageHead(title, sub, action = '') {
  return `<div class="app-head"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${action}</div>`;
}

function avg(list) { return list.length ? Math.round(list.reduce((t, x) => t + x.score, 0) / list.length) + '%' : '—'; }

function professorHome() {
  const cls = cloudClasses.find((c) => c.id === cloudClass), book = cloudBook[cloudClass], students = book?.students || [];
  const lessons = book?.lessons || cloudLessons.filter((l) => l.class_id === cloudClass);
  const owner = cloudAccount.role === 'owner';
  if (!dashPage || !['gradebook', 'students', 'classes', 'access'].includes(dashPage)) dashPage = cloudClasses.length ? 'gradebook' : 'classes';
  const side = `${cloudClasses.length ? `<label class="app-class">Class<select id="cloud-class">${classOptions()}</select></label>` : ''}${dashNav([['gradebook', 'Gradebook'], ['lessons', 'Lessons', 'lessons.html#library'], ['students', 'Students'], ['classes', 'Classes'], ...(owner ? [['access', 'Instructor access']] : [])])}<a class="app-try" href="lessons.html">Try a lesson as a student</a>`;
  const steps = [[cloudClasses.length > 0, 'Create a class', 'classes'], [students.length > 0, 'Add your students', 'students'], [lessons.length > 0, 'Assign a lesson from the library', 'lessons']];
  const setup = steps.every((s) => s[0]) ? '' : `<div class="app-setup"><b>Get your class ready</b><ol>${steps.map(([done, t, k]) => `<li class="${done ? 'done' : ''}">${done ? t : k === 'lessons' ? `<a href="lessons.html#library">${t}</a>` : `<button class="app-link" data-dash="${k}">${t}</button>`}</li>`).join('')}</ol></div>`;
  let main = '';
  if (dashPage === 'gradebook') {
    const body = !cloudClass ? '<p class="app-empty">Create a class to see its gradebook.</p>' : !book ? '<p class="app-empty">Loading the gradebook…</p>' : book.error ? `<p class="app-empty">${safe(book.error)}</p>` : !lessons.length ? '<p class="app-empty">No lessons assigned yet. Assign one from the lesson library and scores will appear here.</p>' : !students.length ? '<p class="app-empty">No students yet. Add them on the Students page.</p>'
      : `<div class="app-scroll"><table class="app-table"><thead><tr><th>Student</th>${lessons.map((l) => `<th class="num">${safe(l.title)}<small>${dueText(l.dueDate)}</small></th>`).join('')}<th class="num">Average</th></tr></thead><tbody>${students.map((s) => { const sc = lessons.map((l) => (s.lessonScores || []).find((x) => x.assignment_id === l.id)); return `<tr><td><strong>${safe(s.email)}</strong><small>${s.business ? safe(s.business.name) : 'Not signed in yet'}</small></td>${sc.map((x) => `<td class="num">${x ? scoreBadge(x) : '—'}</td>`).join('')}<td class="num"><strong>${avg(sc.filter(Boolean))}</strong></td></tr>`; }).join('')}</tbody></table></div><p class="app-note">Scores are first-attempt accuracy on graded tasks. Later attempts don’t change them.</p>`;
    main = pageHead('Gradebook', cls ? safe(cls.name) : '', '<a class="app-btn" href="lessons.html#library">Assign a lesson</a>') + setup + body;
  } else if (dashPage === 'students') {
    main = pageHead('Students', cls ? safe(cls.name) : 'Create a class first.') + `<form id="invite-student" class="app-inline"><input name="email" type="email" required maxlength="254" placeholder="student@school.edu" aria-label="Student email" ${!cloudClass ? 'disabled' : ''}><button class="app-btn" data-cloud-submit ${!cloudClass ? 'disabled' : ''}>Add student</button></form><p class="app-note">Adding an email doesn’t send a message. Share the site link; students create an account with that email and join automatically.</p>`
      + (students.length ? `<div class="app-scroll"><table class="app-table"><thead><tr><th>Email</th><th>Business</th><th class="num">Average</th><th></th></tr></thead><tbody>${students.map((s) => `<tr><td>${safe(s.email)}</td><td>${s.business ? safe(s.business.name) : '<span class="app-mut">Not signed in yet</span>'}</td><td class="num">${avg(s.lessonScores || [])}</td><td class="num"><button class="app-link" data-remove="${safe(s.email)}">Remove</button></td></tr>`).join('')}</tbody></table></div>` : `<p class="app-empty">${cloudClass && !book ? 'Loading…' : 'No students in this class yet.'}</p>`);
  } else if (dashPage === 'classes') {
    main = pageHead('Classes', 'Each class has its own roster, assignments and gradebook.') + `<form id="create-class" class="app-inline"><input name="name" required maxlength="120" placeholder="e.g. ACCT 203 · Section 01" aria-label="New class name"><button class="app-btn" data-cloud-submit>Create class</button></form>`
      + (cloudClasses.length ? `<table class="app-table"><thead><tr><th>Class</th><th class="num">Lessons assigned</th><th></th></tr></thead><tbody>${cloudClasses.map((c) => `<tr><td><strong>${safe(c.name)}</strong></td><td class="num">${cloudLessons.filter((l) => l.class_id === c.id).length}</td><td class="num"><button class="app-link" data-open-class="${safe(c.id)}">Open gradebook</button></td></tr>`).join('')}</tbody></table>` : '<p class="app-empty">You don’t have a class yet. Create one to get started.</p>');
  } else {
    main = pageHead('Instructor access', 'Approve an email so that person can create an account.') + `<form id="grant-access" class="app-inline"><input name="email" type="email" required maxlength="254" placeholder="professor@school.edu" aria-label="Email"><select name="role" aria-label="Role"><option value="professor">Professor</option><option value="student">Student</option></select><button class="app-btn" data-cloud-submit>Approve</button></form><button id="view-access" class="app-link">View approved accounts</button>`;
  }
  return appFrame(side, main);
}

function studentHome() {
  if (!['assignments', 'grades'].includes(dashPage)) dashPage = 'assignments';
  const side = dashNav([['assignments', 'Assignments'], ['grades', 'Grades'], ['business', 'My business', 'lessons.html']]);
  const score = (l) => cloudLessonScores.find((x) => x.assignment_id === l.id);
  const sorted = [...cloudLessons].sort((a, b) => String(a.dueDate || '9').localeCompare(String(b.dueDate || '9')));
  let main;
  if (dashPage === 'assignments') {
    const next = sorted.find((l) => !score(l));
    const start = (l) => `lessons.html#lesson=${encodeURIComponent(l.lessonId)}`;
    main = pageHead('Assignments', cloudClasses.map((c) => safe(c.name)).join(', '))
      + (!cloudClasses.length ? '<p class="app-empty">You aren’t in a class yet. Ask your professor to add your email.</p>'
        : !sorted.length ? '<p class="app-empty">Your professor hasn’t assigned a lesson yet. You can start your business from My business in the meantime.</p>'
        : `${next ? `<div class="app-next"><div><small>Next up · ${dueText(next.dueDate)}</small><b>${safe(next.title)}</b></div><a class="app-btn" href="${start(next)}">Start</a></div>` : '<div class="app-next"><div><b>You’re all caught up.</b></div></div>'}<table class="app-table"><thead><tr><th>Lesson</th><th>Due</th><th class="num">Status</th></tr></thead><tbody>${sorted.map((l) => { const s = score(l); return `<tr><td><strong>${safe(l.title)}</strong></td><td>${dueText(l.dueDate).replace('Due ', '')}</td><td class="num">${s ? scoreBadge(s) : `<a class="app-link" href="${start(l)}">Start</a>`}</td></tr>`; }).join('')}</tbody></table>`);
  } else {
    const done = sorted.filter(score);
    main = pageHead('Grades', 'First-attempt scores. Your professor sees the same numbers.') + (done.length ? `<table class="app-table"><thead><tr><th>Lesson</th><th class="num">Score</th></tr></thead><tbody>${done.map((l) => `<tr><td>${safe(l.title)}</td><td class="num">${scoreBadge(score(l))}</td></tr>`).join('')}<tr class="app-total"><td>Average</td><td class="num">${avg(done.map(score))}</td></tr></tbody></table>` : '<p class="app-empty">No graded lessons yet. Scores appear here when you finish an assigned lesson.</p>');
  }
  return appFrame(side, main);
}

function renderDashboard() {
  const student = cloudAccount.role === 'student';
  document.body.dataset.screen = 'app';
  Q('#classroom').innerHTML = student ? studentHome() : professorHome();
  const on = (sel, ev, fn) => { const el = Q(sel); if (el) el[ev] = fn; };
  document.querySelectorAll('[data-dash]').forEach((b) => (b.onclick = () => { dashPage = b.dataset.dash; cloudMessage = ''; render(); }));
  on('#cloud-logout', 'onclick', () => cloudTask(async () => { try { await cloud.logout(); } finally { location.reload(); } }));
  if (student) return;
  loadBook();
  on('#cloud-class', 'onchange', (e) => { cloudClass = e.target.value; cloudMessage = ''; render(); });
  document.querySelectorAll('[data-open-class]').forEach((b) => (b.onclick = () => { cloudClass = b.dataset.openClass; dashPage = 'gradebook'; render(); }));
  on('#create-class', 'onsubmit', (e) => { e.preventDefault(); const name = new FormData(e.target).get('name'); cloudTask(async () => { const c = await cloud.call('create-class', {name}); await loadCloud(); cloudClass = c.id; dashPage = 'students'; cloudMessage = 'Class created. Next, add your students.'; render(); }); });
  on('#invite-student', 'onsubmit', (e) => { e.preventDefault(); const email = new FormData(e.target).get('email'); cloudTask(async () => { await cloud.call('invite', {classId: cloudClass, email}); delete cloudBook[cloudClass]; cloudMessage = 'Student added. Share the site link and ask them to create an account with that email.'; render(); }); });
  document.querySelectorAll('[data-remove]').forEach((el) => (el.onclick = () => { if (!confirm('Remove ' + el.dataset.remove + ' from this class?')) return; cloudTask(async () => { await cloud.call('remove-student', {classId: cloudClass, email: el.dataset.remove}); delete cloudBook[cloudClass]; render(); }); }));
  on('#grant-access', 'onsubmit', (e) => { e.preventDefault(); const p = Object.fromEntries(new FormData(e.target)); cloudTask(async () => { await cloud.call('authorize', {...p, active: true}); cloudMessage = 'Account approved. Share the site link; they can create an account with this email.'; render(); }); });
  on('#view-access', 'onclick', () => cloudTask(accessList));
}
