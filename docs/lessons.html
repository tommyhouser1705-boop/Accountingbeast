<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger Lane · Financial Accounting Lessons</title>
<meta name="description" content="A semester of financial accounting lessons where students build and run their own business, then account for every decision.">
<style>.lib-table small{display:block;margin-top:5px}.app-table td{vertical-align:top}.app-filters{display:flex;gap:10px;margin:18px 0}.app-filters button{padding:8px 12px;background:#fff;border:1px solid #ccd7e3;border-radius:5px;cursor:pointer}.app-filters .on{background:#e9f0f8;color:#173f68}.lib-acts{white-space:normal}
:root{--ink:#0f172a;--txt:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f5f7fb;--card:#fff;--navy:#1e3a8a;--blue:#2563eb;--soft:#eff4ff;--green:#047857;--red:#b91c1c;--amber:#d97706}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0}
.top{display:flex;align-items:center;gap:14px;padding:12px 28px;position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em;color:var(--navy)}
.logo i{width:30px;height:30px;border-radius:7px;background:var(--navy);display:grid;place-items:center;font-style:normal;color:#fff;font-weight:800;font-size:15px}
.tabs{margin-left:auto;display:flex;background:#f1f5f9;border-radius:8px;padding:3px;border:1px solid var(--line)}
.tabs button{background:none;color:var(--mut);padding:7px 14px;border-radius:6px;font-weight:600;font-size:14px}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.12)}
.wrap{max-width:1180px;margin:0 auto;padding:32px 28px 64px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center;margin-bottom:28px}
.hero h1{font-size:36px;line-height:1.15;margin:8px 0 12px;letter-spacing:-.02em;font-weight:700}
.hero h1 span{color:var(--blue)}
.kick{font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}
.hero p{color:var(--mut);font-size:16px;line-height:1.55;max-width:580px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left}
.stat b{display:block;font-size:28px;font-weight:700;color:var(--navy)}.stat small{color:var(--mut);font-weight:500;font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.filters button{background:#fff;color:var(--ink);border:1px solid var(--line);padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px}
.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.unit{margin:28px 0 12px;font-weight:700;color:var(--mut);letter-spacing:.06em;font-size:12px;display:flex;gap:12px;align-items:center}
.unit:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.lc{position:relative;border-radius:12px;padding:20px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s,border-color .15s;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.lc:hover{border-color:#cbd5e1;box-shadow:0 6px 20px rgba(15,23,42,.08)}
.lc .band{position:absolute;inset:0 0 auto 0;height:4px;border-radius:12px 12px 0 0;background:var(--g)}
.lc .num{font-weight:700;font-size:12px;color:var(--mut);letter-spacing:.06em}
.lc h3{margin:0;font-size:19px;letter-spacing:-.01em;font-weight:700}
.lc .biz{font-weight:600;color:var(--blue);font-size:14px}
.lc .what{color:#475569;font-size:14px;line-height:1.5;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:#f1f5f9;color:#334155}
.meta{display:flex;gap:14px;color:var(--mut);font-size:13px;margin-top:auto;padding-top:4px}
.acts{display:flex;gap:8px}
.btn{padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;color:#fff;background:var(--navy);transition:background .15s}
.btn:hover{background:#172e6e}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.alt:hover{background:#f8fafc}
.btn.go{background:var(--blue)}.btn.go:hover{background:#1d4ed8}
.btn.big{font-size:15px;padding:11px 22px}
.lc.assigned:before{content:"Assigned";position:absolute;top:16px;right:16px;background:#ecfdf5;color:var(--green);font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid #a7f3d0}
.lc.final{grid-column:1/-1;flex-direction:row;align-items:center;gap:24px;background:var(--navy);border-color:var(--navy);color:#fff;padding:28px}
.lc.final .band{display:none}
.lc.final h3{font-size:24px;color:#fff}.lc.final .num{color:#93c5fd}.lc.final .what{color:#dbeafe;max-width:640px;margin-top:6px}.lc.final .meta{color:#bfdbfe;margin-top:12px}
.lc.final .btn{background:#fff;color:var(--navy)}.lc.final .btn.alt{background:transparent;color:#fff;border-color:#3b5bb5}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;z-index:20;padding:16px}
.sheet{background:#fff;border-radius:12px;padding:24px;width:min(440px,100%);box-shadow:0 20px 50px rgba(15,23,42,.25)}
.sheet h3{margin:0 0 4px;font-size:19px}.sheet label{display:block;font-weight:600;margin:14px 0 6px;font-size:13px}
.sheet select,.sheet input{width:100%;padding:9px 11px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:var(--ink);font:inherit}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:500;padding:11px 18px;border-radius:8px;z-index:30;box-shadow:0 10px 30px rgba(15,23,42,.3)}
.hud{display:grid;grid-template-columns:auto repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.shop{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px 10px 10px}
.shop b{display:block;font-size:16px}.shop small{color:var(--mut);font-size:13px}
.meter{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.meter small{color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.06em}
.meter b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;transition:color .4s}
.meter.flash b{color:var(--blue)}
.stage{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:20px;align-items:start}
.path{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 10px;position:sticky;top:76px}
.path h4{margin:2px 6px 8px;font-size:11px;letter-spacing:.08em;color:var(--mut)}
.node{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:7px;color:var(--mut);font-weight:500;font-size:14px}
.node i{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:#fff;border:1.5px solid #cbd5e1}
.node.done{color:var(--ink)}.node.done i{background:var(--green);border-color:var(--green);color:#fff}
.node.now{background:var(--soft);color:var(--navy);font-weight:600}.node.now i{background:var(--blue);border-color:var(--blue);color:#fff}
.main{min-width:0}
.ev{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.ev-top{padding:22px 26px 18px;border-bottom:1px solid var(--line)}
.ev-top small{font-weight:700;letter-spacing:.08em;font-size:12px;color:var(--blue)}
.ev-top h2{margin:6px 0 8px;font-size:24px;letter-spacing:-.01em}
.ev-top p{margin:0;color:#475569;max-width:640px;font-size:15px;line-height:1.55}
.ev-body{padding:22px 26px}
.qlabel{font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--mut);margin:4px 0 10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.ch{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;text-align:left;color:var(--ink);transition:border-color .15s,background .15s}
.ch:hover{border-color:#94a3b8}
.ch.on{border-color:var(--blue);background:var(--soft);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.ch b{display:block;font-size:15px;margin-bottom:3px}.ch span{color:var(--mut);font-size:13px;line-height:1.4}
.forecast{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:20px}
.forecast div small{display:block;color:var(--mut);font-weight:600;font-size:11px;letter-spacing:.06em;margin-bottom:2px}
.forecast div b{font-size:20px;font-variant-numeric:tabular-nums}.good{color:var(--green)}.warn{color:var(--amber)}
.task{background:var(--soft);border:1px solid #c7d7fe;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:15px}
.task b{color:var(--navy)}
.je{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.je-h,.je-r{display:grid;grid-template-columns:64px minmax(0,1fr) 110px 110px 28px;gap:8px;align-items:center}
.je-h{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut);padding:0 2px 8px;border-bottom:1px solid var(--line)}
.je-r{padding:7px 2px;border-bottom:1px solid #f1f5f9}
.je-r .d{font-weight:600;color:var(--mut);font-size:13px}
.je select,.je input{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.je input{text-align:right;font-variant-numeric:tabular-nums}
.je select:focus,.je input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.je-r.cr select{margin-left:26px;width:calc(100% - 26px)}
.je-r .x{background:none;color:#94a3b8;font-size:18px}.je-r .x:hover{color:var(--red)}
.je-f{display:flex;align-items:center;gap:10px;padding-top:10px;flex-wrap:wrap}
.add{background:none;color:var(--blue);padding:6px 4px;font-weight:600;font-size:14px}
.tot{margin-left:auto;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;display:flex;gap:14px;align-items:center}
.tot .ok{color:var(--green)}.tot .no{color:var(--mut)}
.expl{font-style:italic;color:var(--mut);font-size:13px;padding:8px 2px 0}
.fb{margin-top:14px;padding:11px 14px;border-radius:8px;font-size:14px;line-height:1.5}
.fb.bad{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.fb.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.link{background:none;color:var(--blue);font-weight:600;font-size:14px}
.calc{display:grid;grid-template-columns:1fr auto;gap:8px 16px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.calc .r{text-align:right;font-variant-numeric:tabular-nums}
.calc .t{border-top:1px solid #cbd5e1;padding-top:8px;font-weight:700}
.aging{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:14px}
.aging th{text-align:right;color:var(--mut);font-size:11px;letter-spacing:.06em;padding:6px;border-bottom:1px solid var(--line)}
.aging th:first-child,.aging td:first-child{text-align:left}
.aging td{padding:8px 6px;text-align:right;border-bottom:1px solid #f1f5f9;font-variant-numeric:tabular-nums}
.ask input{padding:8px 11px;border-radius:7px;border:1px solid #cbd5e1;font:inherit;font-weight:600;width:150px;text-align:right}
.mc{display:grid;gap:8px}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:76px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.panel h4{margin:0 0 10px;font-size:11px;letter-spacing:.08em;color:var(--mut)}
.ts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{background:#f8fafc;border:1px solid var(--line);border-radius:7px;padding:7px 8px;transition:border-color .4s,background .4s}
.t.hit{border-color:var(--blue);background:var(--soft)}
.t b{display:block;font-size:12px;font-weight:600;text-align:center;border-bottom:1.5px solid #334155;padding-bottom:4px;margin-bottom:4px}
.t .lr{display:grid;grid-template-columns:1fr 1fr;font-size:12px;font-variant-numeric:tabular-nums;min-height:17px}
.t .lr span:first-child{border-right:1.5px solid #334155;padding-right:4px;text-align:right}.t .lr span:last-child{padding-left:4px}
.t .bal{font-weight:700;font-size:12px;text-align:center;margin-top:4px;color:var(--navy)}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;text-align:center;gap:4px;font-weight:700;color:var(--mut)}
.eq div small{display:block;font-size:10px;letter-spacing:.06em;font-weight:600}.eq div b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.tip{font-size:14px;color:#475569;line-height:1.5}.tip b{color:var(--ink)}
.win{text-align:center;padding:30px 26px}
.stars{font-size:34px;letter-spacing:4px;color:#e2e8f0}.stars .s{color:#f59e0b}
.win h2{font-size:28px;margin:4px 0}
.res{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left;margin-top:22px}
.stmt{border:1px solid var(--line);border-radius:10px;padding:16px;font-size:14px}
.stmt h4{margin:0}.stmt small{color:var(--mut)}
.stmt table{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
.stmt td{padding:5px 0}.stmt td:last-child{text-align:right}.stmt .in td:first-child{padding-left:16px}
.stmt .tt td{border-top:1px solid var(--ink);font-weight:700}
.recap{grid-column:1/-1;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:16px;font-size:14px}
.recap li{margin:6px 0;color:#334155}
.confetti{display:none}
@keyframes pop{0%{transform:translateY(4px);opacity:0}100%{transform:none;opacity:1}}
.ev.pop{animation:pop .2s ease-out}
@media(max-width:1020px){.stage{grid-template-columns:1fr}.path{position:static;display:flex;overflow:auto;gap:4px}.path h4{display:none}.node{flex:none}.node span{display:none}.side{position:static}.hud{grid-template-columns:1fr 1fr}.shop{grid-column:1/-1}.hero{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:20px 16px 48px}.top{padding:10px 16px}.hero h1{font-size:28px}.je-h{display:none}.je-r{grid-template-columns:1fr 1fr 28px}.je-r .d{display:none}.je-r select{grid-column:1/3;grid-row:1}.je-r .x{grid-column:3;grid-row:1}.je-r [data-f=d]{grid-column:1;grid-row:2}.je-r [data-f=c]{grid-column:2/4;grid-row:2}.je-r.cr select{margin-left:0;width:100%}.res{grid-template-columns:1fr}.forecast{grid-template-columns:1fr}.ev-top h2{font-size:21px}.lc.final{flex-direction:column;align-items:flex-start}.lc.final .acts{margin-left:0!important}.tabs button{padding:7px 9px;font-size:13px}.logo span{display:none}}

<script>// Ledger Lane office simulation: the student's business as a persistent, seeded
// simulation. Months are lists of dated inbox items (decisions and source
// documents). No DOM access so every month can be played in Node.
(function (root) {
  const LL = root.LL || (typeof require !== 'undefined' ? require('./lessons-engine.js') : null);
  const {ACC, checkJE, post, money, r2} = LL;

  function rng(seed) {
    let a = seed >>> 0 || 1;
    return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  const CITIES = {
    columbus: {city: 'Columbus', state: 'OH', zip: '43215', street: 'N. High Street', area: '614'},
    denver: {city: 'Denver', state: 'CO', zip: '80205', street: 'Larimer Street', area: '303'},
    raleigh: {city: 'Raleigh', state: 'NC', zip: '27601', street: 'Glenwood Avenue', area: '919'},
    austin: {city: 'Austin', state: 'TX', zip: '78702', street: 'E. Cesar Chavez Street', area: '512'},
  };

  const months = [];

  function newGame(o) {
    const seed = o.seed || Math.floor(Math.random() * 1e9);
    const st = {
      v: 1, seed, biz: {type: o.type || 'bike', name: (o.name || '').replace(/[<>]/g,'').trim().slice(0,40), founder: (o.founder || '').replace(/[<>]/g,'').trim().slice(0,40) || 'Owner', city: CITIES[o.city] ? o.city : 'columbus'},
      m: 0, day: 1, led: {}, journal: [], book: [], done: {}, ch: {}, vars: {}, log: [], first: 0, graded: 0, tries: {}, misses: {},
    };
    st.biz.name = st.biz.name || LL.PROFILES[st.biz.type].name;
    return st;
  }

  const place = (st) => CITIES[st.biz.city];
  const prof = (st) => LL.profile({type: st.biz.type, name: st.biz.name, founder: st.biz.founder});
  const rand = (st, key) => { let h = st.seed; for (const c of key) h = (Math.imul(h, 31) + c.charCodeAt(0)) | 0; return rng(h)(); };
  const current = (st) => st.casePeriod || months[st.m];
  const items = (st) => current(st).items.filter((it) => !it.when || it.when(st)).map((it) => {
    if (it.day > st.day || it.kind === 'decision') return it;
    st.paper ||= {};
    if (!st.paper[it.id]) {
      const data = {};
      for (const key of ['doc', 'lines', 'fields']) if (it[key] != null) data[key] = V(it[key], st);
      st.paper[it.id] = data;
    }
    return {...it, ...st.paper[it.id]};
  });
  const inbox = (st) => items(st).filter((it) => it.day <= st.day).sort((a, b) => a.day - b.day);
  const open = (st) => inbox(st).filter((it) => !st.done[it.id]);
  const V = (x, st) => (typeof x === 'function' ? x(st) : x);
  const want = (st, it) => { const l = V(it.lines, st); return l ? l.filter((x) => r2(x[2]) !== 0).map(([a, s, x]) => [a, s, r2(x)]) : null; };

  function dateOf(st, day) {
    const mo = current(st).start;
    return new Date(Date.UTC(mo[0], mo[1] - 1, day));
  }
  const fmtDate = (st, day, style = 'long') => dateOf(st, day).toLocaleDateString('en-US', {timeZone: 'UTC', ...(style === 'long' ? {month: 'long', day: 'numeric', year: 'numeric'} : style === 'short' ? {month: '2-digit', day: '2-digit', year: 'numeric'} : {weekday: 'long', month: 'long', day: 'numeric'})});

  function record(st, it, lines) {
    if (lines && lines.length) {
      post(st, lines, it.id);
      st.book.push({m: st.m, date: fmtDate(st, it.day, 'short'), day: it.day, id: it.id, memo: V(it.memo, st) || V(it.subject, st), lines});
    }
    st.done[it.id] = true;
    if (it.after) it.after(st);
  }

  function grade(st, it, ok) {
    if (st.tries[it.id] == null) { st.tries[it.id] = 0; st.graded++; if (ok) st.first++; }
    st.tries[it.id]++;
    if (!ok) st.misses[it.id] = (st.misses[it.id] || 0) + 1;
  }

  // action: {choice:{qid:value}} | {rows:[{a,d,c}]} | {noEntry:true} | {reveal:true}
  function handle(st, id, action) {
    const it = items(st).find((x) => x.id === id);
    if (!it || st.done[id] || it.day > st.day) return {ok: false, text: 'This item is not available.'};
    if (it.kind === 'decision') {
      const qs = V(it.q, st), ch = action.choice || {};
      if (qs.some((q) => !q.opts.some((o) => o.v === ch[q.id]))) return {ok: false, text: 'Choose a reply before sending.'};
      qs.forEach((q) => (st.ch[q.id] = ch[q.id]));
      if (it.apply) it.apply(st, ch);
      st.log.push({day: it.day, text: V(it.outcome, st) || ''});
      record(st, it, want(st, it));
      return {ok: true, done: true, text: V(it.outcome, st) || ''};
    }
    if (it.kind === 'work') {
      const fields = V(it.fields, st), values = action.values || {};
      const ok = fields.every((f) => String(values[f.id] ?? '').trim() !== '' && Math.abs(LL.num(values[f.id]) - f.value) < 0.015);
      grade(st, it, ok);
      if (ok) { record(st, it, null); return {ok: true, done: true, text: 'Filed.'}; }
      return {ok: false, text: 'The worksheet does not tie to the supporting records. Review the amounts before filing.'};
    }
    const w = want(st, it);
    if (action.reveal) { if ((st.misses[id] || 0) < 2) return {ok: false, text: 'Try at least twice before you look at the answer.'}; return {ok: true, reveal: w}; }
    if (action.noEntry) {
      const ok = !w;
      grade(st, it, ok);
      if (ok) { record(st, it, null); return {ok: true, done: true, text: V(it.why, st) || 'Correct. Nothing changed in the accounting equation, so there is nothing to record.'}; }
      return {ok: false, text: 'This document does change the business’s accounts. Record it.'};
    }
    if (!w) { grade(st, it, false); return {ok: false, text: V(it.hint, st) || 'Look again: did anything actually change hands? Not every document is a transaction.'}; }
    const r = checkJE(st, action.rows || [], w);
    grade(st, it, r.ok);
    if (r.ok) { record(st, it, w); return {ok: true, done: true, text: V(it.why, st) || 'Posted.'}; }
    return {ok: false, text: r.text + (V(it.hint, st) && st.misses[id] > 1 ? ' ' + V(it.hint, st) : '')};
  }

  const nextDay = (st) => { const d = items(st).filter((it) => it.day > st.day).map((it) => it.day); return d.length ? Math.min(...d) : null; };
  function advance(st) {
    if (open(st).length) return {ok: false, text: 'Finish everything in your inbox before you move on.'};
    const d = nextDay(st);
    if (d == null) { st.day = current(st).days; return {ok: true, monthEnd: true}; }
    st.day = d;
    return {ok: true, day: d, arrived: open(st).map((x) => x.id)};
  }

  const bal = (st, a) => LL.bal(st, a);
  function summary(st) {
    const sum = (t) => Object.keys(st.led).filter((a) => ACC[a][1] === t).reduce((s, a) => s + bal(st, a), 0);
    const rev = sum('R') - sum('XR'), exp = sum('E');
    return {cash: bal(st, 'cash'), revenue: r2(rev), expenses: r2(exp), netIncome: r2(rev - exp), first: st.first, graded: st.graded, score: st.graded ? Math.round((100 * st.first) / st.graded) : 0};
  }
  function trialBalance(st) {
    return Object.keys(ACC).filter((a) => st.led[a] && bal(st, a)).map((a) => { const b = bal(st, a) * (LL.dn(a) ? 1 : -1); return [a, ACC[a][0], Math.max(b, 0), Math.max(-b, 0)]; });
  }

  function complete(st) {
    if (open(st).length || nextDay(st) != null) return false;
    st.results ||= {};
    const base = st.mark || {first: 0, graded: 0};
    const first = st.first - base.first, graded = st.graded - base.graded;
    st.results[current(st).lessonId || 'ch2'] ||= {first, graded, score: graded ? Math.round(100 * first / graded) : 0};
    st.ended = true;
    return true;
  }

  function nextMonth(st) {
    if (st.casePeriod) return false;
    if (!st.ended || !months[st.m + 1]) return false;
    st.m++; st.day = 1; st.ended = false; st.review = false;
    st.mark = {first: st.first, graded: st.graded};
    st.opening = JSON.parse(JSON.stringify(st.led));
    return true;
  }

  root.SIM = {rng, CITIES, months, newGame, current, inbox, open, handle, advance, nextDay, summary, trialBalance, want, V, place, prof, rand, fmtDate, money, r2, bal, complete, nextMonth};
  if (typeof module !== 'undefined' && module.exports) module.exports = root.SIM;
})(typeof globalThis !== 'undefined' ? globalThis : this);

    reply('m8-finance', 1, 'Avery Chen · Heartland Capital', 'Expansion funding offers', 'The expansion needs $20,000 of funding. We can arrange a 6% bank note at face value, or a five-year private bond placement with $20,000 face value and a 5% coupon, priced at 98. Bond discount is amortized straight-line monthly for this course.', 'funding', [['note', 'Accept the 6% bank note', '$20,000 proceeds.'], ['bond', 'Authorize the bond placement at 98', '$19,600 proceeds; $400 discount.']], s => 'Funding route selected: ' + s.ch.funding + '.'),
    doc('m8-funds', 3, 'Heartland Capital', 'Funding settlement advice', s => sheet(s, 'Funding settlement', [['Face principal', 20000], ['Cash deposited', s.ch.funding === 'note' ? 20000 : 19600], ['Term, months', 60], ['Annual coupon', s.ch.funding === 'note' ? '6%' : '5%']], 'No issuance fees. Funds deposited today.'), s => s.ch.funding === 'note' ? [dr('cash', 20000), cr('np', 20000)] : [dr('cash', 19600), dr('bdisc', 400), cr('bonds', 20000)]),
    doc('m8-project', 10, 'Midstate Installation', 'New equipment installation', s => invoice(s, 10, 'Midstate Installation', 'MI-801', 'Expansion equipment delivered and placed in service; ACH paid', 14000, 'Paid'), () => [dr('equip', 14000), cr('cash', 14000)]),
    doc('m8-oldinterest', 14, bank, 'Accrued interest settlement', s => receipt(s, 14, bank, 'LN-801-I', 'Payment of all previously accrued interest', bal(s, 'intpay')), s => bal(s, 'intpay') ? [dr('intpay', bal(s, 'intpay')), cr('cash', bal(s, 'intpay'))] : null),
    doc('m8-principal', 18, bank, 'Original note principal installment', s => receipt(s, 18, bank, 'LN-801-P', 'Principal reduction on original September note; not the expansion note', Math.min(1000, s.ch.loan || 0)), s => s.ch.loan ? [dr('np', 1000), cr('cash', 1000)] : null),
    doc('m8-interest', 30, 'Heartland Capital', 'Expansion debt accrual', s => sheet(s, 'Debt rollforward · expansion funding only', [['Face principal', 20000], ['Annual coupon', s.ch.funding === 'note' ? '6%' : '5%'], ['Elapsed months since issue, full-month convention', 1], ['Bond discount, if applicable', s.ch.funding === 'bond' ? 400 : 0], ['Amortization term, months', 60]], 'Accrue one month of coupon interest. For bonds, add straight-line discount amortization to interest expense.'), s => s.ch.funding === 'note' ? [dr('intexp', 100), cr('intpay', 100)] : [dr('intexp', r2(20000 * 0.05 / 12) + r2(400 / 60)), cr('intpay', 20000 * 0.05 / 12), cr('bdisc', 400 / 60)]),
  ]);

  month('ch10', 9, 'Bring in an investor', [2027, 5], ['Common stock', 'APIC', 'Treasury stock', 'Dividends', 'Equity rollforward'], [
    ...operations('m9', 31),
    reply('m9-investor', 1, 'Elena Ortiz · Local Growth Partners', 'Equity term sheet', 'We can invest $12,000 for 1,000 new $1-par common shares, or $24,000 for 2,000 shares. Both offers price shares at $12. The larger offer provides cash but gives up more ownership.', 'shares', [[1000, 'Issue 1,000 new shares', '$12,000 in fresh equity.'], [2000, 'Issue 2,000 new shares', '$24,000 in fresh equity.']], s => 'Board authorized ' + s.ch.shares + ' shares.'),
    doc('m9-issue', 4, 'Ramsey & Cole', 'Share subscription settled', s => sheet(s, 'Share register · new issue', [['New common shares', s.ch.shares], ['Par value per share', 1], ['Cash subscription price per share', 12]], 'Investor cash received in full. Record par separately from additional paid-in capital.'), s => [dr('cash', s.ch.shares * 12), cr('cs', s.ch.shares), cr('apic', s.ch.shares * 11)]),
    doc('m9-treasury', 11, 'Transfer agent', 'Treasury share repurchase', s => receipt(s, 11, 'Transfer agent', 'EQ-901', '100 common shares repurchased at $13; use cost method', 1300), () => [dr('treasury', 1300), cr('cash', 1300)]),
    doc('m9-reissue', 18, 'Transfer agent', 'Treasury share reissue', s => sheet(s, 'Treasury stock sale confirmation', [['Shares reissued', 40], ['Original repurchase cost per share', 13], ['Cash received per share', 15]], 'Excess over cost goes to Additional Paid-in Capital, Common. Do not report a gain in earnings.'), () => [dr('cash', 600), cr('treasury', 520), cr('apic', 80)]),
    reply('m9-dividend', 23, 'Board secretary', 'Cash dividend resolution', 'The board can retain earnings for expansion or declare a $600 cash dividend payable May 29. A declaration creates an obligation before cash is paid.', 'dividend9', [[0, 'Retain cash in the business', 'No declaration.'], [600, 'Declare a $600 dividend', 'Payment scheduled May 29.']], s => s.ch.dividend9 ? 'The board declared the dividend.' : 'The board retained cash.'),
    doc('m9-declare', 24, 'Board secretary', 'Board minutes · dividend declared', s => sheet(s, 'Dividend declaration', [['Authorized cash dividend', s.ch.dividend9]], 'Declaration date May 24. Payment date May 29.'), s => s.ch.dividend9 ? [dr('div', 600), cr('divpay', 600)] : null),
    doc('m9-paydiv', 29, 'Transfer agent', 'Dividend payment advice', s => receipt(s, 29, 'Transfer agent', 'EQ-902', 'Dividend distribution authorized May 24', s.ch.dividend9), s => s.ch.dividend9 ? [dr('divpay', 600), cr('cash', 600)] : null),
  ]);
  review('build3', 'Third quarter · report to investors', [2027, 5], 'q3');

  month('ch11', 10, 'Show where the cash went', [2027, 6], ['Operating cash flows', 'Investing', 'Financing', 'Financial statements'], [
    ...operations('m10', 30),
    reply('m10-growth', 1, 'Jordan Pike', 'Summer operating plan', 'We can keep our current footprint, or spend $500 on local advertising to fill the mobile schedule. The campaign adds $900 of completed work this month.', 'summer', [['steady', 'Keep the current footprint', 'No extra advertising.'], ['campaign', 'Launch the $500 campaign', 'Additional work arrives June 19.']], s => s.ch.summer === 'campaign' ? 'Campaign booked.' : 'Current footprint retained.'),
    doc('m10-ad', 4, 'Neighborhood Media', 'Campaign receipt', s => receipt(s, 4, 'Neighborhood Media', 'NM-1001', 'Summer mobile service campaign', 500), () => [dr('adv', 500), cr('cash', 500)], {when: s => s.ch.summer === 'campaign'}),
    doc('m10-bonus', 19, 'Operations desk', 'Campaign jobs completed', s => invoice(s, 19, s.biz.name, 'C-1001', 'Completed summer campaign work · paid', 900, 'Paid'), () => [dr('cash', 900), cr('rev', 900)], {when: s => s.ch.summer === 'campaign'}),
    doc('m10-collect', 20, 'Collections desk', 'Trade receivables collected', s => receipt(s, 20, s.biz.name, 'RC-1001', 'Customer ACH settlements of all open trade invoices', bal(s, 'ar')), s => bal(s, 'ar') ? [dr('cash', bal(s, 'ar')), cr('ar', bal(s, 'ar'))] : null),
    doc('m10-ap', 24, 'Accounts payable', 'Trade payables settled', s => receipt(s, 24, 'Vendor payments', 'AP-1001', 'All outstanding trade invoices paid', bal(s, 'ap')), s => bal(s, 'ap') ? [dr('ap', bal(s, 'ap')), cr('cash', bal(s, 'ap'))] : null),
    doc('m10-land', 25, 'Mason County Title', 'Land purchase settlement', s => invoice(s, 25, 'Mason County Title', 'L-1001', 'Vacant expansion parcel · closing costs included, paid cash', 8000, 'Paid'), () => [dr('land', 8000), cr('cash', 8000)]),
    work('m10-cf', 30, 'Send the lender a cash-flow package', s => email(s, 30, 'Avery Chen · Heartland Capital', 'Cash flow follow-up', 'Please file operating, investing and financing cash flows for this operating period, plus the net change and ending checking balance. Use Books → Statements. Include cash transactions only; do not classify noncash depreciation as a cash payment.'), s => { const f = S.statements(s); return ['operating', 'investing', 'financing', 'change', 'cash'].map(id => ({id, label: {operating: 'Operating cash flow', investing: 'Investing cash flow', financing: 'Financing cash flow', change: 'Net change in checking', cash: 'Ending checking balance'}[id], value: f[id]})); }),
  ]);
  const year = review('capstone', 'Year-end · hand over the books', [2027, 8], 'year');
  year.topics = ['Year-end cut-off', 'Adjustments', 'Financial statements', 'Closing', 'Lender package'];
  const firstReview = S.months.findIndex(m => m.lessonId === 'build1');
  S.months.splice(3, 0, S.months.splice(firstReview, 1)[0]);
  S.months[0].lessonId = 'ch2';
  S.catalog = S.months.map((m, i) => ({id: m.lessonId, index: i, title: m.title, n: m.n, topics: m.topics, review: !!m.review}));
  S.findLesson = id => S.catalog.find(m => m.id === (id === 'ch1' ? 'ch2' : id));

  S.statements = function (s) {
    const f = S.summary(s), sums = types => r2(Object.keys(s.led).filter(a => types.includes(LL.ACC[a][1])).reduce((t, a) => t + bal(s, a), 0));
    f.assets = r2(sums(['A']) - sums(['XA'])); f.liabilities = r2(sums(['L']) - sums(['XL']));
    f.equity = r2(sums(['SE']) - sums(['XSE']) + f.netIncome);
    f.operating = 0; f.investing = 0; f.financing = 0;
    for (const j of s.book.filter(j => !j.opening && (j.m ?? 0) === s.m)) {
      const cash = j.lines.filter(([a]) => a === 'cash').reduce((t, [, side, x]) => t + (side === 'dr' ? x : -x), 0);
      if (!cash) continue;
      const finance = j.lines.filter(([a]) => ['np', 'bonds', 'bdisc', 'bprem', 'cs', 'ps', 'apic', 'apicp', 'treasury', 'div', 'divpay', 'casecapital', 'casedrawings'].includes(a)).reduce((t, [, side, x]) => t + (side === 'cr' ? x : -x), 0);
      const notePrincipal = j.lines.filter(([a]) => a === 'nr').reduce((t,[,side,x]) => t + (side === 'cr' ? x : -x),0);
      const invest = notePrincipal || (j.lines.some(([a]) => ['equip', 'vehicle', 'land', 'building'].includes(a)) ? cash - finance : 0);
      f.financing += finance; f.investing += invest; f.operating += cash - finance - invest;
    }
    for (const k of ['operating', 'investing', 'financing']) f[k] = r2(f[k]);
    f.change = r2(f.operating + f.investing + f.financing);
    return f;
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>(function () {
  const app = document.querySelector('#app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cloud = new CloudClient(window.LEDGER_CLOUD || {});
  let account = null, classes = [], assignments = [], filter = 'all', error = '';
  const teacher = () => account && account.role !== 'student';
  const href = (id, preview = false) => `office.html?lesson=${encodeURIComponent(id)}${preview ? '&preview=1' : ''}`;
  function render() {
    const nav = teacher() ? [['index.html#dash=gradebook','Gradebook'],['lessons.html#library','Lessons'],['index.html#dash=students','Students'],['index.html#dash=classes','Classes']] : [['index.html','Assignments'],['office.html','My business'],['index.html#dash=grades','Grades']];
    const visible = SIM.catalog.filter(l => filter === 'all' || (filter === 'close' ? l.review : !l.review));
    app.innerHTML = `<div class="app"><aside class="app-side"><a class="app-logo" href="index.html">Ledger Lane</a><nav class="app-nav">${nav.map(([h,t])=>`<a href="${h}" class="${t==='Lessons'?'on':''}">${t}</a>`).join('')}</nav><div class="app-who">${esc(account?.email || 'Free sample')}<a href="index.html#signin">${account?'Account home':'Sign in'}</a></div></aside><main class="app-main"><div class="app-head"><div><h1>${teacher()?'Simulation library':account?'Your business periods':'Run a business. Keep its books.'}</h1><p>${teacher()?'Assign an operating month or a period close. Students keep the same company and books throughout the course.':'Work from business correspondence, make operating decisions, and record what actually happened. No quizzes.'}</p></div></div><p class="note">Each period continues the preceding one. Opening month includes incorporation and Chapters 1–2. Quarter closes are integrated accounting work, not separate quiz reviews.${teacher()?' Preview starts a separate practice company; it never changes a student record.':''}</p>${error?`<p role="alert">${esc(error)}</p>`:''}<div class="app-filters">${[['all','All periods'],['month','Operating months'],['close','Period closes']].map(([id,t])=>`<button data-filter="${id}" class="${filter===id?'on':''}">${t}</button>`).join('')}</div><div class="app-scroll"><table class="app-table lib-table"><thead><tr><th>Period</th><th>Simulation</th><th>Accounting work</th><th>Actions</th></tr></thead><tbody>${visible.map(l=>{
      const assigned = assignments.some(a=>a.lessonId===l.id || l.id==='ch2'&&a.lessonId==='ch1');
      const open = teacher() || (account?.role==='student' && assigned) || l.id==='ch2';
      return `<tr><td>${esc(l.n)}<small>${l.id==='ch2'?'Chapters 1–2':l.review?'Integrated close':'Chapter '+l.id.slice(2)}</small></td><td><strong>${esc(l.title)}</strong><small>${l.review?'Extended closing assignment':'Operating assignment'}</small></td><td>${esc(l.topics.join(' · '))}</td><td class="lib-acts">${open?`<a class="app-link" href="${href(l.id,!!teacher())}">${teacher()?'Preview':assigned?'Open':'Try sample'}</a>`:'<span class="lockline">'+(account?'Not assigned':'Class account required')+'</span>'}${teacher()?`<button class="app-btn" data-assign="${l.id}">${assigned?'Update assignment':'Assign'}</button>`:''}</td></tr>`;
    }).join('')}</tbody></table></div><p class="note">Progress and first-attempt accounting scores save with the student account. Business choices are not graded. Public samples and instructor previews stay in this browser.</p></main></div>`;
    app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();});
    app.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>assign(b.dataset.assign));
  }
  function assign(id) {
    if (!teacher()) return;
    const l = SIM.findLesson(id), modal = document.createElement('div'); modal.className='modal';
    modal.innerHTML=`<form class="sheet"><h2>Assign ${esc(l.title)}</h2><p>Students continue their existing business. Earlier periods must be completed first; no accounting is completed for them.</p>${classes.length?`<label>Class<select name="classId">${classes.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label><label>Due date<input type="date" name="dueDate" required></label><button class="btn" type="submit">Assign period</button>`:'<p>Create a class on your instructor home first.</p>'}<button class="btn alt" type="button" id="cancel">Cancel</button><p role="alert" id="assign-error"></p></form>`;
    document.body.append(modal);modal.querySelector('#cancel').onclick=()=>modal.remove();
    modal.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),button=e.target.querySelector('[type=submit]');button.disabled=true;
      try{await cloud.call('lesson-assign',{classId:f.get('classId'),dueDate:f.get('dueDate'),lessonId:id,title:l.title});const r=await cloud.call('bootstrap');assignments=r.lessons||[];modal.remove();render();}
      catch(e){modal.querySelector('#assign-error').textContent=e.message;button.disabled=false;}
    };
  }
  async function init() {
    if (cloud.configured && cloud.session) { try { const b=await cloud.call('bootstrap');account=b.user;classes=b.classes||[];assignments=b.lessons||[]; } catch(e){error=e.message;} }
    const id=location.hash.startsWith('#lesson=')?decodeURIComponent(location.hash.slice(8)):null;
    if(id&&SIM.findLesson(id)){location.replace(href(SIM.findLesson(id).id,!!teacher()));return;}
    render();
  }
  init();
})();
</script>
