<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger Lane · Run a business for a year</title>
<meta name="description" content="Run a business for a year, record every journal entry, close the books and prepare your own financial statements.">
<style>:root{--v:#6c5ce7;--v2:#4834d4;--navy:#1e1b4b;--peach:#ffb38a;--or:#ff7a45;--mint:#12b5a0;--sun:#ffd166;--pink:#ff6b9d;--ink:#1f1d3a;--soft:#6b6890;--card:#fff;--line:#e6e2ff;--good:#0f9f6e;--bad:#e5484d}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 600px at 10% -10%,#ffd9c7 0,transparent 60%),radial-gradient(1000px 700px at 110% 0,#d9d2ff 0,transparent 55%),linear-gradient(180deg,#f6f3ff,#fff6ef);min-height:100vh}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.top{display:flex;align-items:center;gap:14px;padding:14px clamp(14px,3vw,32px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;color:var(--navy);text-decoration:none}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--v),var(--pink));color:#fff;font-size:15px;box-shadow:0 6px 16px #6c5ce755}
.biz-pill{background:var(--navy);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800}
.top-actions{margin-left:auto;display:flex;gap:8px}
.ghost{background:#fff;border:2px solid var(--line);border-radius:999px;padding:9px 16px;font-weight:800;color:var(--v2)}
.ghost:hover{border-color:var(--v)}
.go{background:linear-gradient(135deg,var(--v),#8c7bff);color:#fff;border:0;border-radius:16px;padding:14px 22px;font-weight:900;font-size:17px;box-shadow:0 8px 0 var(--v2),0 14px 26px #6c5ce755;transition:transform .08s}
.go:active{transform:translateY(4px);box-shadow:0 4px 0 var(--v2)}
.go:disabled{background:#c9c4ea;box-shadow:0 6px 0 #aaa4d6;cursor:not-allowed}
.go.light{background:#fff;color:var(--v2);box-shadow:0 8px 0 #c9c1ff}
.year{list-style:none;display:flex;gap:4px;margin:0 clamp(14px,3vw,32px) 10px;padding:6px;background:#fff;border-radius:16px;box-shadow:0 4px 16px #2b235a14;overflow-x:auto}
.year li{flex:1;min-width:34px;text-align:center;border-radius:10px;padding:7px 2px;font-size:12px;font-weight:800;color:var(--soft);background:#f3f0ff}
.year li.wide{flex:1.6;min-width:64px}
.year li.past{background:linear-gradient(135deg,var(--mint),#3ddbb6);color:#fff}
.year li.now{background:linear-gradient(135deg,var(--or),var(--sun));color:var(--navy);transform:scale(1.08);box-shadow:0 4px 12px #ff7a4566}
main{padding:0 clamp(14px,3vw,32px) 60px}
.stats{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 6px 20px #2b235a14;position:relative;overflow:hidden}
.stat small{display:block;font-weight:800;color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat b{font-size:26px;font-weight:900}
.stat.cash{background:linear-gradient(135deg,#0f9f6e,#3ddbb6);color:#fff}.stat.cash small{color:#e6fff6}
.stat.cash i{position:absolute;left:0;bottom:0;height:6px;background:var(--sun);transition:width .6s}
.stat.cash.up b{animation:pop .6s}.stat.cash.down b{animation:shake .5s}
@keyframes pop{40%{transform:scale(1.2)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.eqn div{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.eqn span{font-size:13px;font-weight:700;color:var(--soft)}.eqn span b{display:block;font-size:20px;color:var(--ink)}.eqn em{font-style:normal;font-weight:900;font-size:22px;color:var(--v)}
.eqn.ok small{color:var(--good)}.eqn.off small{color:var(--bad)}
.score b span{font-size:16px;color:var(--soft)}
.play{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:16px;align-items:start}
.card{position:sticky;top:12px;background:var(--card);border-radius:24px;padding:20px;box-shadow:0 14px 40px #2b235a22;border:3px solid #fff;outline:3px solid var(--line)}
.card.big{text-align:center}
.when{display:inline-block;background:var(--navy);color:var(--sun);font-weight:900;border-radius:999px;padding:5px 12px;font-size:13px}
.who{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:800;color:var(--soft)}.av{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:#fff2ea;border-radius:14px}
.card h2{margin:8px 0 6px;font-size:24px;line-height:1.15;font-weight:900;color:var(--navy)}.story{font-size:17px;line-height:1.45;margin:0 0 14px}
.burst{font-size:56px;margin:8px 0}
.choices{display:grid;gap:10px}
.choice{text-align:left;background:linear-gradient(135deg,#fff,#f5f2ff);border:3px solid var(--line);border-radius:18px;padding:13px 15px;display:grid;gap:2px;transition:transform .1s,border-color .1s}
.choice b{font-size:17px;color:var(--navy)}.choice span{color:var(--soft);font-size:14px;font-weight:700}
.choice:hover:not(:disabled){border-color:var(--v);transform:translateY(-2px)}
.choice:disabled{opacity:.55;cursor:not-allowed}.lock{color:var(--bad)!important}
.picked{background:#f3f0ff;border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.task{font-size:15px;line-height:1.4}.dr-t{color:#2563eb;font-weight:900}.cr-t{color:#d9468b;font-weight:900}
.amount{margin:12px auto;width:max-content;background:linear-gradient(135deg,var(--sun),var(--or));color:var(--navy);font-weight:900;font-size:28px;padding:10px 22px;border-radius:18px;box-shadow:0 8px 0 #d65f2c;cursor:grab;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.slots{display:grid;gap:6px;margin-bottom:10px}.slots span{background:#f6f6fb;border:2px dashed #d6d2f0;border-radius:12px;padding:7px 10px;font-size:14px}.slots span.set{border-style:solid;border-color:var(--v);background:#f1eeff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.row.center{justify-content:center;margin-top:22px}
.fb{border-radius:14px;padding:11px 14px;margin:10px 0;font-size:15px;line-height:1.45}.fb ul{margin:6px 0 0;padding-left:18px}
.fb.good{background:#e3fbf1;border:2px solid #7fe0b9}.fb.bad{background:#ffecec;border:2px solid #ffb3b5}.fb.warn{background:#fff6dc;border:2px solid #ffd98a}.fb.info{background:#eef0ff;border:2px solid #c6c0ff}
.muted{color:var(--soft);display:block;margin-top:10px}
.mini{list-style:none;padding:0;display:grid;gap:6px;font-weight:800;margin:12px 0 18px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.t{background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 4px 14px #2b235a12;overflow:hidden;border:2px solid transparent}
.t header{display:flex;justify-content:space-between;gap:6px;padding:7px 10px;font-weight:800;font-size:13px;border-bottom:3px solid var(--navy)}
.t header b{white-space:nowrap}
.t.asset header,.t.contra header{background:#e8f6ff}.t.liability header{background:#fff0e6}.t.equity header,.t.draw header{background:#f0ecff}.t.revenue header{background:#e5fbf1}.t.expense header{background:#ffeef5}
.t-body{display:grid;grid-template-columns:1fr 1fr}
.zone{min-height:44px;padding:5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.zone.dr{border-right:3px solid var(--navy)}
.zone small{font-size:10px;font-weight:800;text-transform:uppercase;color:#a5a2c4}
.zone.live{cursor:pointer;background:repeating-linear-gradient(45deg,#fafaff,#fafaff 6px,#f3f0ff 6px,#f3f0ff 12px)}
.zone.live.dr:hover{background:#dbeafe}.zone.live.cr:hover{background:#fde2ef}
.zone.fresh{background:#e3fbf1}
.chip{background:#f1f1f7;border-radius:8px;padding:2px 7px;font-weight:800}
.chip.new{background:var(--mint);color:#fff;animation:pop .6s}
.chip.pending{border:0;background:linear-gradient(135deg,var(--sun),var(--or));color:var(--navy)}
.more{font-size:10px;color:var(--soft)}
.pick .hero{text-align:center;padding:26px 0 10px}
.eyebrow{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.1em;color:var(--v2);background:#ece8ff;border-radius:999px;padding:6px 12px}
.hero h1{font-size:clamp(36px,6vw,64px);line-height:1.02;margin:14px 0;color:var(--navy);font-weight:900}.hero h1 span{background:linear-gradient(90deg,var(--v),var(--pink),var(--or));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:640px;margin:0 auto;font-size:19px;line-height:1.5;color:#4a4770}
.resume{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff;border-radius:18px;padding:12px 16px;margin:18px auto 0;max-width:760px;box-shadow:0 6px 20px #2b235a14}
.bizzes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:1100px;margin:26px auto}
.biz{--c:var(--v);text-align:left;border:0;border-radius:28px;padding:22px;color:#fff;background:linear-gradient(160deg,var(--c),var(--navy) 130%);box-shadow:0 18px 40px #2b235a33;display:grid;gap:6px;transition:transform .15s}
.biz:hover{transform:translateY(-6px) rotate(-.5deg)}
.biz .em{font-size:64px;line-height:1;filter:drop-shadow(0 6px 10px #0004)}.biz small{font-weight:900;text-transform:uppercase;letter-spacing:.08em;opacity:.85}.biz b{font-size:28px;font-weight:900}.biz span{font-size:16px;opacity:.95}.biz i{font-style:normal;margin-top:10px;background:#fff;color:var(--navy);border-radius:14px;padding:10px 14px;font-weight:900;width:max-content}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1100px;margin:0 auto}.how div{background:#fff;border-radius:18px;padding:14px;display:grid;gap:4px;box-shadow:0 4px 14px #2b235a10}.how b{color:var(--v2)}.how span{color:var(--soft);font-size:14px}
.teach{max-width:1100px;margin:26px auto 0;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,var(--navy),#3b2f9e);color:#fff;border-radius:28px;padding:26px}.teach h2{margin:10px 0 6px;font-size:28px}.teach p{margin:0;opacity:.85;max-width:560px}.teach .eyebrow{background:#ffffff22;color:var(--sun)}
.stmts,.report{max-width:1180px;margin:0 auto}
.stmt-head{text-align:center;margin:8px 0 14px}.stmt-head h2{font-size:32px;margin:8px 0 4px;color:var(--navy)}.stmt-head p{margin:0;color:var(--soft)}
.step{background:var(--or);color:#fff;font-weight:900;border-radius:999px;padding:5px 12px;font-size:13px}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#fff;border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 6px 20px #2b235a14;min-height:64px;position:sticky;top:8px;z-index:2}
.item{background:linear-gradient(135deg,#fff,#f5f2ff);border:2px solid var(--line);border-radius:12px;padding:8px 11px;font-weight:800;font-size:14px}
.item b{color:var(--v2);margin-left:4px}.item.sel{border-color:var(--or);background:#fff1e8;box-shadow:0 0 0 4px #ffb38a66;transform:translateY(-2px)}.item.wrong{border-color:var(--bad);background:#ffecec}
.papers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.paper{background:#fffdf8;border-radius:18px;padding:16px;box-shadow:0 10px 30px #2b235a1c;border-top:8px solid var(--v)}
.paper:nth-child(2){border-top-color:var(--or)}.paper:nth-child(3){border-top-color:var(--mint)}
.paper h3{margin:0;font-size:18px;color:var(--navy);text-align:center}.paper>small{display:block;text-align:center;color:var(--soft);margin-bottom:8px}
.paper h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
.drop{border:3px dashed #d6d2f0;border-radius:14px;padding:8px;margin-top:10px;min-height:70px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;cursor:pointer}
.drop h4{width:100%;margin:0 0 2px}.drop:hover{border-color:var(--or);background:#fff7f1}.drop.fixed{cursor:default;background:#f6f6fb;border-style:solid;border-color:#ecebf5;min-height:0}
.hint{color:#aaa6c8;font-size:13px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px;border-bottom:1px dotted #e3e0f2}.ln b{white-space:nowrap}
.ln.tot{font-weight:800;border-bottom:2px solid #cfcbe6}.ln.grand{font-weight:900;font-size:16px;border-bottom:4px double var(--navy);background:#fff6d6;margin-top:4px;padding:6px 4px;align-items:center}
.ln input{width:120px;text-align:right;border:3px solid var(--v);border-radius:10px;padding:5px 8px;font-weight:900;background:#fff}.ln input.wrong{border-color:var(--bad);background:#ffecec}
.hero-end{text-align:center;background:linear-gradient(135deg,var(--v),var(--pink) 60%,var(--or));color:#fff;border-radius:30px;padding:26px 18px;margin-bottom:16px;box-shadow:0 20px 50px #6c5ce755}
.hero-end h1{font-size:clamp(28px,4.4vw,46px);margin:6px 0}.hero-end p{margin:0;opacity:.95;font-weight:700}
.stars span{font-size:52px;color:#ffffff55;margin:0 4px}.stars span.on{color:var(--sun);text-shadow:0 4px 0 #d65f2c;animation:pop .7s}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.kpis div{background:#ffffff26;border-radius:16px;padding:10px}.kpis small{display:block;font-weight:800;opacity:.9}.kpis b{font-size:24px}
.decisions{margin-top:14px;border-top-color:var(--sun)}.decisions ol{padding-left:0;list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px}.decisions li{font-size:14px}.decisions li span{display:inline-block;min-width:64px;font-weight:900;color:var(--or)}
.scrim{position:fixed;inset:0;background:#1e1b4bcc;display:grid;place-items:center;padding:16px;z-index:20}
.modal{position:relative;background:#fff;border-radius:26px;padding:24px;width:min(680px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px #0006}
.modal h2{margin:10px 0;color:var(--navy);font-size:26px}.modal label{display:grid;gap:6px;font-weight:800;margin:10px 0}
.modal input,.modal textarea{border:2px solid var(--line);border-radius:12px;padding:10px;width:100%;font-size:15px}.modal textarea{resize:vertical}
.x{position:absolute;right:14px;top:14px;border:0;background:#f3f0ff;border-radius:50%;width:36px;height:36px;font-weight:900}
.key{padding-left:20px;display:grid;gap:8px}.key li{font-size:14px}.key li span{display:block}.key li b{color:var(--good);font-size:13px}.key li em{color:var(--bad);font-size:13px}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.how{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){.play{grid-template-columns:1fr}.card{position:static}.stats{grid-template-columns:1fr 1fr}.eqn{grid-column:1/-1;order:3}.papers{grid-template-columns:1fr}.bizzes{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.decisions ol{grid-template-columns:1fr}}
@media (max-width:560px){.top-actions{width:100%;margin-left:0}.top-actions button{flex:1;padding:8px 10px;font-size:14px}.board{gap:8px}.t header{font-size:12px;padding:6px 7px}.zone{font-size:11px}.stat b{font-size:21px}.eqn span b{font-size:16px}.how{grid-template-columns:1fr}.card h2{font-size:21px}.ln{font-size:13px}.ln input{width:100px}.hero p{font-size:17px}}
</style>
</head>
<body>
<div id="app"></div>
<script>// Ledger Lane "Year One" demo engine: scenarios, double-entry ledger, statements.
(function ENGINE(root){
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const ACCOUNTS={
 cash:['Cash','asset','💵'],supplies:['Supplies','asset','📦'],prepaid:['Prepaid Rent','asset','🗓️'],equip:['Equipment','asset','🛠️'],accdep:['Accumulated Depreciation','contra','📉'],
 ap:['Accounts Payable','liability','🧾'],wagespay:['Wages Payable','liability','⏰'],intpay:['Interest Payable','liability','🏦'],unearned:['Unearned Revenue','liability','⏳'],note:['Notes Payable','liability','📝'],
 capital:["Owner's Capital",'equity','👤'],draws:["Owner's Withdrawals",'draw','👛'],
 sales:['Sales Revenue','revenue','📈'],
 rentexp:['Rent Expense','expense','🏠'],wages:['Wages Expense','expense','🧑‍🍳'],suppexp:['Supplies Expense','expense','🥤'],depexp:['Depreciation Expense','expense','⚙️'],intexp:['Interest Expense','expense','💸'],utilexp:['Utilities Expense','expense','💡'],adexp:['Advertising Expense','expense','📣'],permits:['Permits & Insurance Expense','expense','🛡️'],repairs:['Repairs Expense','expense','🔧']};
const typeOf=id=>ACCOUNTS[id][1];
const debitNormal=id=>['asset','expense','draw'].includes(typeOf(id));
const nameOf=(biz,id)=>(biz.labels&&biz.labels[id])||ACCOUNTS[id][0];
const iconOf=id=>ACCOUNTS[id][2];
const SECTION={asset:'bs-assets',contra:'bs-assets',liability:'bs-liab',equity:'oe-cap',draw:'oe-draw',revenue:'is-rev',expense:'is-exp'};
const sectionOf=id=>SECTION[typeOf(id)];
const SECTIONS=[['is-rev','Income statement','Revenues'],['is-exp','Income statement','Expenses'],['oe-cap',"Statement of owner's equity",'Owner investments'],['oe-draw',"Statement of owner's equity",'Withdrawals'],['bs-assets','Balance sheet','Assets'],['bs-liab','Balance sheet','Liabilities']];
const SECTION_HINT={'is-rev':'This was earned from customers. Revenue belongs on the income statement.','is-exp':'This cost was used up to run the business. Expenses belong on the income statement.','oe-cap':"This is what the owner put in. It starts the statement of owner's equity.",'oe-draw':"The owner took this out for personal use. It's not an expense: it reduces owner's equity.",'bs-assets':'The business owns this (or it reduces an asset, like accumulated depreciation). It goes in balance sheet assets.','bs-liab':'The business owes this to someone. It goes in balance sheet liabilities.'};
const HINT_DR={cash:'Money came INTO the bank account.',supplies:"You got supplies you'll use up soon.",prepaid:"You paid now for something you'll use later. That's a future benefit you own.",equip:"Something you'll use for years arrived.",accdep:'Accumulated depreciation is almost never debited here.',ap:'You paid down a bill you owed, so that debt shrinks.',wagespay:'You paid wages you already owed.',intpay:'You paid interest you already owed.',unearned:'You finally did the work customers paid for in advance, so you owe them less.',note:'You paid back part of a loan.',capital:'The owner took capital back out.',draws:"The owner took money out for personal use. That's a withdrawal, not a business expense.",sales:'Revenue is almost never debited.',depexp:'Equipment wore out a little this year. That used-up cost is an expense.',intexp:'Borrowing cost you something this year. That cost is an expense.'};
const HINT_CR={cash:'Money LEFT the bank account.',supplies:'Supplies got used up, so what is on the shelves went down.',prepaid:'Part of what you prepaid got used up.',equip:'You gave up equipment.',accdep:'Record the wear on equipment without erasing its original cost. Use the contra-asset.',ap:'You promised to pay a supplier later. You now owe them.',wagespay:"Your team earned wages you haven't paid yet. You owe them.",intpay:"Interest built up that you haven't paid yet.",unearned:"Customers paid before you did the work. Until you do it, you owe them.",note:'You signed a loan. You owe the bank.',capital:'The money came from the owner.',draws:'Withdrawals are almost never credited.',sales:'You earned it by serving customers.'};
const hintDr=id=>HINT_DR[id]||'A cost got used up running the business. That is an expense.';
const hintCr=id=>HINT_CR[id]||'Expenses are almost never credited.';
const E=(when,make,yearEnd)=>({when,make,yearEnd:!!yearEnd});
const ch=(label,entry,why,extra)=>Object.assign({label,entry,why},extra||{});
const skip=(label,note,extra)=>Object.assign({label,entry:null,note},extra||{});
const adjSupplies=left=>E('Dec 31',h=>{const had=h.bal('supplies'),used=had-left;if(used<=0)return null;return {who:'Year-end count',av:'📋',title:'Count what is left',story:`Your books show ${money(had)} of supplies, but when you count the shelves only ${money(left)} is left. The rest was used up during the year.`,choices:[ch(`Record ${money(used)} of supplies used`,['suppexp','supplies',used],"Supplies you used are now an expense, and the Supplies asset shrinks to what's really on the shelves. This is an adjusting entry.")]};},true);
const adjPrepaid=(months,story)=>E('Dec 31',h=>{if(!h.f.prepaid)return null;const used=Math.round(h.f.prepaid*months/12);return {who:'Year-end adjustment',av:'🗓️',title:'Rent you have used up',story:`You prepaid ${money(h.f.prepaid)} of rent. ${story}`,choices:[ch(`Record ${money(used)} of rent used`,['rentexp','prepaid',used],"The months you've used move from the Prepaid Rent asset to Rent Expense."+(months<12?' The month you have left stays an asset.':''))]};},true);
const adjDep=()=>E('Dec 31',h=>{const d=h.f.dep||0;if(!d)return null;return {who:'Year-end adjustment',av:'⚙️',title:'Equipment wears out',story:`Your equipment won't last forever. Spread its cost over its useful life: ${money(d)} of depreciation this year.`,choices:[ch(`Record ${money(d)} of depreciation`,['depexp','accdep',d],'Depreciation spreads the cost of equipment over the years you use it. The credit goes to Accumulated Depreciation, a contra-asset, so the original cost stays visible.')]};},true);

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthOf=when=>Math.max(0,MONTHS.indexOf(String(when).slice(0,3)));
function newGame(biz){const g={biz,i:-1,ev:null,led:{},flags:{},status:[],first:0,rec:0,decisions:[],done:false,choice:null};biz.accounts.forEach(id=>g.led[id]={dr:[],cr:[]});return g;}
const sum=a=>a.reduce((s,x)=>s+x,0);
function bal(g,id){const l=g.led[id];if(!l)return 0;const d=sum(l.dr),c=sum(l.cr);return debitNormal(id)?d-c:c-d;}
const helper=g=>({bal:id=>bal(g,id),f:g.flags});
function advance(g){g.i++;g.choice=null;while(g.i<g.biz.events.length){const ev=g.biz.events[g.i].make(helper(g));if(ev){g.ev=ev;g.status[g.i]='cur';return ev;}g.status[g.i]='skip';g.i++;}g.ev=null;g.done=true;return null;}
const isDisabled=(g,c)=>g.ev.choices.length>1&&!!c.entry&&c.entry[1]==='cash'&&c.entry[2]>bal(g,'cash');
function choose(g,k){const c=g.ev&&g.ev.choices[k];if(!c||isDisabled(g,c))return null;Object.assign(g.flags,c.set||{});for(const key in c.add||{})g.flags[key]=(g.flags[key]||0)+c.add[key];g.choice=c;g.decisions.push({when:g.biz.events[g.i].when,title:g.ev.title,label:c.label});if(!c.entry)g.status[g.i]='done';return c;}
function checkEntry(g,dr,cr){const e=g.choice.entry,n=id=>nameOf(g.biz,id);if(!dr||!cr)return {ok:false,kind:'warn',text:'Every entry has two sides. Drop the amount on one <b>Debit</b> side and one <b>Credit</b> side.'};
 if(dr===e[0]&&cr===e[1])return {ok:true};
 if(dr===e[1]&&cr===e[0])return {ok:false,kind:'bad',text:'So close! Right accounts, wrong sides. <b>Debit</b> = what the business got or used up. <b>Credit</b> = where it came from.'};
 if(dr!==e[0]&&cr!==e[1])return {ok:false,kind:'bad',text:'Both sides need another look. <b>Debit hint:</b> '+hintDr(e[0])+' <b>Credit hint:</b> '+hintCr(e[1])};
 if(dr!==e[0])return {ok:false,kind:'bad',text:'<b>'+n(cr)+'</b> on the Credit side is right! Now the Debit: '+hintDr(e[0])};
 return {ok:false,kind:'bad',text:'<b>'+n(dr)+'</b> on the Debit side is right! Now the Credit: '+hintCr(e[1])};}
function post(g,tries){const [dr,cr,amt]=g.choice.entry;g.led[dr].dr.push(amt);g.led[cr].cr.push(amt);g.rec++;if(!tries)g.first++;g.status[g.i]='done';}

 const rev=of('revenue').map(row),exp=of('expense').map(row),totalRev=sum(rev.map(r=>r.amount)),totalExp=sum(exp.map(r=>r.amount)),netIncome=totalRev-totalExp;
 const investments=bal(g,'capital'),draws=bal(g,'draws'),endCapital=investments+netIncome-draws;

 if(!amt)return {line,ok:false,why:'No dollar amount found. Include one, like $500.'};

 if(/invest|contribut/.test(l))e=['cash','capital'];

 else if(/borrow|loan|note payable/.test(l)&&!/repa|pays? (back|off)/.test(l))e=['cash','note'];
 else if(/depreciat/.test(l))e=['depexp','accdep'];
 else if(/(wage|salar).*(owed|unpaid|accru|not (yet )?paid)|(owed|unpaid|accru).*(wage|salar)/.test(l))e=['wages','wagespay'];
 else if(/\bowed\b|payable|pays? off|settles?|pays? (the )?(supplier|vendor)/.test(l))e=['ap','cash'];
 else if(/in advance|advance|deposit|upfront|up front/.test(l))e=['cash','unearned'];
 else if(/(used|count|on hand)/.test(l)&&/suppl/.test(l))e=['suppexp','supplies'];
 else if(/prepa/.test(l))e=['prepaid','cash'];
 else if(/\brent\b/.test(l))e=['rentexp','cash'];
 else if(/wage|salar|payroll/.test(l))e=['wages','cash'];
 else if(/utilit|electric|water bill/.test(l))e=['utilexp','cash'];
 else if(/advertis|marketing|\bads?\b/.test(l))e=['adexp','cash'];
 else if(/interest/.test(l))e=['intexp','cash'];

const parseNotes=text=>String(text).split('\n').map(s=>s.trim()).filter(Boolean).map(parseLine);
const CUSTOM_ACCOUNTS=['cash','supplies','prepaid','equip','accdep','ap','wagespay','unearned','note','capital','draws','sales','rentexp','wages','suppexp','utilexp','adexp','depexp','intexp'];

 <article class="paper decisions"><h3>Your year in decisions</h3><ol>${g.decisions.filter(d=>!/^Record /.test(d.label)).map(d=>`<li><span>${esc(d.when)}</span><b>${esc(d.title)}:</b> ${esc(d.label)}</li>`).join('')}</ol><p class="muted">Different choices lead to a different year. Play again and try to beat your profit.</p></article>
 <div class="row center"><button class="go" id="play-again">Play another business →</button><button class="ghost" id="replay-same">Replay ${esc(g.biz.name)}</button><button class="ghost" id="open-instructor">Make one from my notes</button></div></section>`;}
function pickView(){const saved=load();return `<section class="pick"><div class="hero"><span class="eyebrow">NO LOGIN · ABOUT 15 MINUTES</span><h1>Run a real business<br><span>for a whole year.</span></h1><p>Make the calls an owner makes, record every journal entry, close the books on December 31, and prepare your own financial statements.</p></div>
 ${saved&&saved.log&&saved.log.length?`<div class="resume"><span>⏯️ You were running <b>${esc(saved.name||'a business')}</b> (${saved.rec||0} entries in).</span><button class="go" id="resume">Continue</button><button class="ghost" id="discard">Start over</button></div>`:''}
 <div class="bizzes">${P.BUSINESSES.map(b=>`<button class="biz" data-biz="${b.id}" style="--c:${b.color}"><span class="em">${b.emoji}</span><small>${esc(b.type)}</small><b>${esc(b.name)}</b><span>${esc(b.tagline)}</span><i>Play year one →</i></button>`).join('')}</div>
 <div class="how"><div><b>1 · Decide</b><span>One event at a time. Every choice has consequences.</span></div><div><b>2 · Record</b><span>Drop amounts onto live T accounts and watch the books move.</span></div><div><b>3 · Close</b><span>Make the year-end adjusting entries.</span></div><div><b>4 · Report</b><span>Build the income statement, owner's equity and balance sheet.</span></div></div>
 <div class="teach"><div><span class="eyebrow">FOR INSTRUCTORS</span><h2>Paste your course notes. Play them right away.</h2><p>Ledger Lane turns each transaction in your notes into a day in the business, with an answer key and a year-end statements challenge.</p></div><button class="go light" id="open-instructor">Turn notes into a game →</button></div></section>`;}
function modal(){const m=U.modal;if(!m)return '';const parsed=m.parsed;
 return `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="Instructor"><button class="x" id="close-modal" aria-label="Close">✕</button><span class="eyebrow">INSTRUCTOR DEMO</span><h2>Your notes → a playable year</h2>
 ${!parsed?`<label>Business name<input id="biz-name" value="${esc(m.name)}"></label><label>Course notes, one transaction per line<textarea id="notes" rows="10">${esc(m.notes)}</textarea></label><div class="row"><button class="go" id="gen">Build the game →</button><button class="ghost" id="sample">Use sample notes</button></div><small class="muted">In the signed-in classroom, AI reads full lecture notes. This demo reads one transaction per line.</small>`
 :`<p>${parsed.filter(p=>p.ok).length} of ${parsed.length} lines became playable days. Here's the answer key your students will be graded against:</p><ol class="key">${parsed.map(p=>`<li class="${p.ok?'ok':'no'}"><span>${esc(p.line)}</span>${p.ok?`<b>Dr ${esc(P.nameOf({},p.dr))} · Cr ${esc(P.nameOf({},p.cr))} · ${money(p.amt)}</b>`:`<em>${esc(p.why)}</em>`}</li>`).join('')}</ol><div class="row"><button class="go" id="play" ${parsed.filter(p=>p.ok).length>=3?'':'disabled'}>Play it as a student →</button><button class="ghost" id="edit">Edit notes</button></div>`}</div></div>`;}
function render(){let body;if(U.view==='pick')body=pickView();else if(U.phase==='sort')body=sortView();else if(U.phase==='compute')body=computeView();else if(U.phase==='report')body=reportView();else body=`${stats()}<div class="play">${card()}${board()}</div>`;
 app.innerHTML=header()+`<main class="${U.view}">${body}</main>`+modal();if(U.modal){const f=$('#notes')||$('#play');f&&f.focus();}}
function openModal(){U.modal={name:'Maple Street Bikes',notes:P.SAMPLE_NOTES,parsed:null};render();}
function checkSort(){const r=P.checkSort(U.g,U.placed);U.sortTries++;U.sortWrong=r.wrong;U.sel=null;if(!r.wrong.length&&!r.missing.length){U.phase='compute';U.inputs={};}render();window.scrollTo({top:0,behavior:'smooth'});}
function readInputs(){['ni','cap','ta'].forEach(k=>{const el=$('#in-'+k);if(el)U.inputs[k]=el.value;});}
function checkCompute(){readInputs();const s=P.statements(U.g),num=v=>{const t=String(v||'').replace(/[$,\s]/g,'').replace(/^\((.*)\)$/,'-$1');return t===''?NaN:Math.round(parseFloat(t));};
 const want={ni:s.netIncome,cap:s.endCapital,ta:s.totalAssets},tips={ni:'<b>Net income</b> = total revenues − total expenses.',cap:"<b>Ending owner's capital</b> = $0 starting capital + investments + net income − withdrawals.",ta:'<b>Total assets</b> = add up the assets, then subtract accumulated depreciation.'};
 U.computeWrong=Object.keys(want).filter(k=>num(U.inputs[k])!==Math.round(want[k]));U.computeTries++;
 if(!U.computeWrong.length){U.phase='report';clearSave();render();window.scrollTo({top:0,behavior:'smooth'});return;}
 U.computeMsg='Not quite. '+U.computeWrong.map(k=>tips[k]).join(' ');render();}
app.addEventListener('click',e=>{const t=e.target.closest('button,[data-zone],[data-section],[data-item]');if(!t||t.disabled)return;const id=t.id,d=t.dataset;
 if(d.biz){clearSave();return start(bizFor(d.biz));}
 if(d.choice!==undefined)return pick(+d.choice);
 if(d.unplace){e.stopPropagation();U.pending=U.pending.filter(p=>p.side!==d.unplace);return render();}
 if(d.zone){const [a,s]=d.zone.split(':');return place(a,s);}
 if(d.item){e.stopPropagation();const host=t.closest('[data-section]');if(U.sel&&U.sel!==d.item&&host&&host.dataset.section!=='tray'){U.placed[U.sel]=host.dataset.section;U.sortWrong=U.sortWrong.filter(x=>x!==U.sel);U.sel=null;return render();}U.sel=U.sel===d.item?null:d.item;return render();}
 if(d.section){if(!U.sel)return;if(d.section==='tray')delete U.placed[U.sel];else U.placed[U.sel]=d.section;U.sortWrong=U.sortWrong.filter(x=>x!==U.sel);U.sel=null;return render();}
 const A={next,check,'show-me':showMe,'begin-close':()=>{U.phase='story';render();focusCard();},'start-statements':()=>{U.phase='sort';render();window.scrollTo({top:0});},'check-sort':checkSort,'check-compute':checkCompute,
  'fill-totals':()=>{const s=P.statements(U.g);U.inputs={ni:String(s.netIncome),cap:String(s.endCapital),ta:String(s.totalAssets)};U.computeMsg=null;U.computeWrong=[];render();},
  'to-pick':()=>{U={view:'pick',modal:null};render();},'play-again':()=>{U={view:'pick',modal:null};render();window.scrollTo({top:0});},'replay-same':()=>start(U.g.biz.id==='custom'?U.g.biz:bizFor(U.g.biz.id)),
  'open-instructor':openModal,'close-modal':()=>{U.modal=null;render();},resume:()=>{const s=load();const b=s&&bizFor(s.bizId,s.custom);if(b)start(b,s.log,s.seenYE);},discard:()=>{clearSave();render();},
  sample:()=>{U.modal.notes=P.SAMPLE_NOTES;render();},gen:()=>{U.modal.name=$('#biz-name').value.trim()||'My class business';U.modal.notes=$('#notes').value;U.modal.parsed=P.parseNotes(U.modal.notes);render();},edit:()=>{U.modal.parsed=null;render();},
  play:()=>{const m=U.modal;clearSave();start(P.customBusiness(m.name,m.parsed));}};
 if(A[id]){if(U.phase==='compute')readInputs();A[id]();}});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-zone],[data-section]')){e.preventDefault();e.target.click();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.modal){U.modal=null;render();}});
app.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('in-'))U.inputs[e.target.id.slice(3)]=e.target.value;});
app.addEventListener('dragstart',e=>{const t=e.target.closest('[draggable]');if(!t)return;e.dataTransfer.setData('text/plain',t.dataset.item||'amt');if(t.dataset.item)U.sel=t.dataset.item;});
app.addEventListener('dragover',e=>{if(e.target.closest('[data-zone],[data-section]'))e.preventDefault();});
app.addEventListener('drop',e=>{const z=e.target.closest('[data-zone],[data-section]');if(!z)return;e.preventDefault();if(z.dataset.zone){const [a,s]=z.dataset.zone.split(':');place(a,s);}else if(U.sel){z.click();}});
app.addEventListener('click',e=>{if(e.target.id==='scrim'){U.modal=null;render();}});
window.__play=()=>({view:U.view,phase:U.phase,i:U.g?U.g.i:null,entry:U.g&&U.g.choice?U.g.choice.entry:null,rec:U.g?U.g.rec:0,biz:U.g?U.g.biz.id:null,modal:!!U.modal});
window.__playGame=()=>U.g;
render();if(location.hash==='#instructor')openModal();
})();
</script>
</body>
</html>
