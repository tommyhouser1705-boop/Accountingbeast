const reportTag=$('.monthly-report .tag');if(reportTag)reportTag.textContent=quarterLabel()+' · OPERATIONS REPORT';const run=$('#operate-month');if(run)run.textContent='Open for this month →';const missing=state.documents.filter(d=>!d.posted).length,rec=!!state.bankRecs?.[periodInfo().number],report=state.reports?.find(r=>r.period===periodInfo().number),path=document.createElement('section');path.className='card quarter-path';path.innerHTML=`<div class="tag">HOW TO MOVE TO THE NEXT MONTH</div><h3>${quarterLabel()}</h3><ol><li>${monthFinished()?'✓':'○'} Open for the month</li><li>${missing?'○':'✓'} Enter records (${missing} remaining)</li><li>${rec?'✓':'○'} Reconcile the bank</li><li>${report?.correct===report?.total&&report?'✓':'○'} Submit financial statements</li></ol><button id="quarter-next-step">${!monthFinished()?'View business setup':missing?'View unposted records':!rec?'Reconcile the bank':'Prepare financial statements →'}</button>`;$('.layout').before(path);$('#quarter-next-step').onclick=()=>{if(!monthFinished())$('.cards').scrollIntoView({behavior:'smooth'});else if(missing)$('.record-inbox').scrollIntoView({behavior:'smooth'});else{view=rec?'financials':'bank';render();}};decorateQuarter();const opsReport=state.monthReports?.find(r=>r.period===periodInfo().number);if(opsReport?.advanceEarned){const grid=$('.report-grid');if(grid){const item=document.createElement('div');item.innerHTML='<span>Previously prepaid services completed</span><strong>'+money(opsReport.advanceEarned)+'</strong>';grid.append(item);}}}
if(view==='financials'){$('.page-heading .tag').textContent=q===4?'YEAR-END FINANCIAL STATEMENTS':quarterLabel();$('.page-heading h2').textContent=q===4?'Prepare annual financial statements':'Prepare monthly financial statements';const form=$('#financial-form'),handler=form.onsubmit;form.onsubmit=e=>{handler(e);const next=$('#next-period');if(next&&q<4){next.textContent=`Start ${monthName(quarterPeriods[q])} →`;next.onclick=()=>{state.period={number:quarterPeriods[q],startDecisions:state.decisions||0,beginning:{ledger:structuredClone(state.ledger),effectiveCount:Engine.effective(state.ledger).length}};state.draftFinancials={};state.pending=null;state.journalDate='';view='business';save();render();window.scrollTo({top:0,behavior:'smooth'});};}};}
const walker=document.createTreeWalker($('#app'),NodeFilter.SHOW_TEXT),nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes)if(!node.parentElement.closest('.source-document,script,style,input,select'))node.textContent=node.textContent.replace(/Open for the month/g,'Open for the month').replace(/next month/g,'next month').replace(/twelve months/g,'September through December');};
function decorateQuarter(){const svg=$('.storefront');if(!svg)return;const q=quarterNumber();svg.querySelector('#sky stop')?.setAttribute('stop-color',['#dcebe4','#e4edcf','#e8d9bd','#dce3ef'][q-1]);const scene=document.createElement('div');scene.className='scene-update';scene.innerHTML=`<strong>${['Opening season','Settling into the neighborhood','Growing customer relationships','Year-end in the neighborhood'][q-1]}</strong><span>${esc(state.equipmentLevel||'Preparing the space')} · ${esc(state.location?.name||'Choose your location')}</span>`;$('.town').append(scene);if(q>1){const group=document.createElementNS('http://www.w3.org/2000/svg','g');group.innerHTML=q===2?'<rect x="228" y="247" width="75" height="23" fill="#f5e1ab"/><text x="266" y="263" text-anchor="middle" font-size="9" fill="#496343">NOW OPEN</text>':q===3?'<rect x="210" y="267" width="28" height="22" fill="#a78762"/><circle cx="224" cy="255" r="20" fill="#688348"/><rect x="518" y="267" width="27" height="22" fill="#a78762"/><circle cx="531" cy="255" r="20" fill="#688348"/>':'<path d="M213 145 Q380 180 548 145" fill="none" stroke="#657950" stroke-width="4"/><g fill="#d9b15b"><circle cx="245" cy="152" r="4"/><circle cx="310" cy="161" r="4"/><circle cx="380" cy="166" r="4"/><circle cx="450" cy="161" r="4"/><circle cx="515" cy="152" r="4"/></g>';svg.append(group);}}
function renderLegacyNotice(){$('#app').innerHTML=`<main class="shell">${header()}<section class="welcome"><h1>Four months. A clearer start.</h1><p>Your previous business is saved. The new version runs September through December. Download your existing progress, then start a new business to try it.</p><button id="legacy-download">Download existing progress</button><button class="secondary" id="fresh-quarter">Start September business</button></section></main>`;$('#legacy-download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='monthly-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};$('#fresh-quarter').onclick=()=>{localStorage.setItem('ledger-lane-monthly-backup',JSON.stringify(state));state=null;localStorage.removeItem('ledger-lane-intro');localStorage.removeItem('ledger-lane');render();};}
const oldQuarterSource=sourceDocument;
sourceDocument=function(d){let html=oldQuarterSource(d);if(d.credit==='Accounts Payable')html=paperOverride(d,'Supplier invoice','Market Street Supply Co.','UNPAID',`Delivered: ${esc(d.date)}<br>Goods: ${esc(d.itemDescription)}<br>Invoice due: ${esc(d.paymentDue)}<br>Payment received: $0.00`);if(d.debit==='Accounts Payable')html=paperOverride(d,'Bank payment confirmation','Neighborhood Bank','PAID','Recipient: Market Street Supply Co.<br>Reference: settlement of the prior supplier invoice');if(d.credit==='Unearned Revenue')html=paperOverride(d,'Customer advance receipt',state.name,'RECEIVED',`Funds received before service delivery.<br>Service scheduled for: ${esc(d.serviceDate)}<br>Service delivered on receipt date: no`);if(d.debit==='Unearned Revenue')html=paperOverride(d,'Service completion confirmation',state.name,'COMPLETED',`Order fulfilled: ${esc(d.date)}<br>Previously received deposit applied to completed services.<br>New cash collected: $0.00`);if(d.credit==='Wages Payable')html=paperOverride(d,'Payroll accrual schedule',state.name,'UNPAID',`Work completed by: ${esc(d.date)}<br>Unpaid wages: ${money(d.amount)}<br>Scheduled pay date: ${esc(d.paymentDue)}`);if(d.coverageStart)html=html.replace(/Coverage: [\s\S]*?<br>/,`Coverage begins: ${monthName(d.coverageStart)}; ${d.coverageMonths} month${d.coverageMonths===1?'':'s'}<br>`).replace(/Coverage month: [\s\S]*?<br>/,`Coverage used: ${d.coverageMonths} month${d.coverageMonths===1?'':'s'} starting ${monthName(d.coverageStart)}<br>`).replace('Coverage consumed: one month','Monthly rate: '+money(state.monthlyRent));if(d.debit==='Prepaid Rent')html=html.replace(/Coverage: [\s\S]*?<br>/,`Coverage begins: ${monthName(Number(d.date.slice(5,7)))}; ${d.coverageMonths} months in advance<br>`);if(d.debit==='Advertising Expense'){const aq=quarterPeriods.indexOf(d.month)+1;html=html.replace(/Campaign period: [^<]+/,`Campaign period: ${monthName(d.month)}`).replace('Campaign delivered during the current month.','Campaign delivered during the month.');}if(d.title.startsWith('Monthly')){const dq=quarterPeriods.indexOf(d.month)+1,label=monthName(d.month);html=html.replace(/Reporting period: [\s\S]*?<br>/,`Reporting period: ${label}<br>`).replace(/Services delivered during [^<]+/,'Services delivered during '+label).replace('Daily sales summary','Monthly sales report');if(d.debit==='Accounts Receivable'){const issuedMonth=Number(d.date.slice(5,7));const due=new Date(Date.UTC(2026,issuedMonth,15)).toISOString().slice(0,10);html=html.replace(/Due date: [^<]+/,'Due date: '+due);}}return html;};
function paperOverride(d,title,issuer,status,detail){return `<article class="source-document"><div class="paper-top"><span>${esc(issuer)}</span><span class="paper-status">${status}</span></div><h2>${title}</h2><div class="paper-meta"><span>Document ${esc(d.docId)}</span><span>${esc(d.date)}</span></div><div class="paper-party">${esc(state.name)}</div><div class="paper-item">${esc(d.title)}</div><p>${detail}</p><div class="paper-total"><span>Total</span><strong>${money(d.amount)}</strong></div><div class="paper-footer">Business copy · Retain with company records</div></article>`;}
const oldKind=documentKind;
documentKind=function(d){if(d.credit==='Accounts Payable')return 'Supplier invoice';if(d.debit==='Accounts Payable')return 'Bank payment confirmation';if(d.credit==='Unearned Revenue')return 'Customer advance receipt';if(d.debit==='Unearned Revenue')return 'Service completion confirmation';if(d.credit==='Wages Payable')return 'Payroll accrual schedule';return oldKind(d);};
render();
// Bank timing is based on dated documents, independently of student postings.
bankData=function(){const period=periodInfo().number,end=transactionDate(period,true);let running=0,outstanding=0,lines=[];for(const d of state.documents.filter(d=>d.month<=period)){const change=d.debit==='Cash'?d.amount:d.credit==='Cash'?-d.amount:0;if(!change)continue;const uncleared=change<0&&d.date===end&&['Rent Expense','Accounts Payable'].includes(d.debit);if(uncleared){outstanding+=d.amount;continue;}running+=change;lines.push({title:d.title,month:d.month,date:d.date,change,balance:Math.round(running*100)/100});}return {balance:Math.round(running*100)/100,outstanding:Math.round(outstanding*100)/100,lines,book:Engine.balances(state.ledger).Cash};};
const monthlyTour=introTour;
